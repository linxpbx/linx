# Cutting a release (ADR-084, docs/ops/RELEASES.md).
#
# A tag is what makes a release. Nothing is rebuilt here: the images for
# this commit already exist, built and tested by CI on master, so this
# gives them the release's own names and signs them again under those
# names. What ships is literally what was tested.
#
#   v1.2.0         -> 1.2.0, 1.2, stable
#   v1.3.0-beta.1  -> 1.3.0-beta.1, beta
#
# It refuses a tag whose commit CI hasn't published, which is what stops
# a release being cut from something that never went green.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # re-tag in ghcr.io
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, certd, coturn, wireguard, asterisk]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/linx-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the release out of the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          # Exactly what installer.ImageTag accepts, so the program and the
          # images can never disagree about what a release is called.
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            echo "::error::$tag is not a release tag: use v1.2.3 or v1.3.0-beta.1"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if printf '%s' "$v" | grep -q -- '-'; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            # 1.2.0 also answers to 1.2, so "the newest fix of 1.2" has a name.
            echo "extra=${v%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Give this commit's image the release's names
        run: |
          src="${IMAGE}:sha-${GITHUB_SHA}"
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "::error::$src isn't published. Tag a commit that is green on master and whose images CI pushed."
            exit 1
          fi
          tags="-t ${IMAGE}:${{ steps.v.outputs.version }} -t ${IMAGE}:${{ steps.v.outputs.channel }}"
          if [ -n "${{ steps.v.outputs.extra }}" ]; then
            tags="$tags -t ${IMAGE}:${{ steps.v.outputs.extra }}"
          fi
          # imagetools copies the manifest list, so every architecture comes
          # with it and no layer is rebuilt or re-pushed.
          docker buildx imagetools create $tags "$src"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the release (keyless, by digest)
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.v.outputs.version }}" --format '{{json .Manifest}}' | jq -r '.digest')
          cosign sign --yes "${IMAGE}@${digest}"

  # The `linx` program people download to install or update. Built from the
  # tag, so installer.ImageTag stamps the release into it and a server set
  # up with it runs the release's images rather than a commit's.
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attach the binaries to the GitHub release
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linx for both architectures
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X linxpbx.com/linx/internal/version.Version=${GITHUB_REF_NAME} -X linxpbx.com/linx/internal/version.Commit=${GITHUB_SHA}" \
              -o "linx-linux-$arch" ./cmd/linx
          done
          sha256sum linx-linux-* > SHA256SUMS

      - name: Check the program knows which images it belongs with
        run: |
          # A release build must pick the release's images, not a commit's.
          got=$(./linx-linux-amd64 version 2>/dev/null || true)
          printf 'linx version says: %s\n' "$got"
          case "$got" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "::error::the built program doesn't say it is ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the binaries (keyless)
        run: |
          # cosign v3 makes the new bundle format the default for sign-blob, and
          # it replaces the old --output-signature/--output-certificate pair with
          # a single self-contained bundle. Verify with:
          #   cosign verify-blob linx-linux-amd64 --bundle linx-linux-amd64.sigstore.json \
          #     --certificate-identity-regexp 'https://github.com/.+/linx/.github/workflows/release.yml@refs/tags/v.+' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in linx-linux-amd64 linx-linux-arm64 SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes $prerelease \
            linx-linux-amd64 linx-linux-arm64 SHA256SUMS \
            linx-linux-amd64.sigstore.json \
            linx-linux-arm64.sigstore.json \
            SHA256SUMS.sigstore.json
