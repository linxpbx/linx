# The iPhone/iPad app's own workflow: formatting, a simulator build, the unit
# tests and the release build a real iPhone would get. No Apple account, no
# signing and no secrets, so it runs on pull requests from anywhere.
#
# It is deliberately **not** part of CI (.github/workflows/ci.yml). This job
# needs a macOS machine, and GitHub regularly has none free: between
# 2026-10-21 and 2026-10-23 it was killed with no runner and no steps run in
# **nine** of the fourteen runs that went red, most of them on commits that
# touched nothing but documentation. A missing Mac turned the whole of CI red
# and told us nothing about the server, the web client or the images.
#
# Here it can be red on its own without saying anything false about the rest
# of Linx, and it only starts at all when the app's own files change. The
# nightly run means the app is still built and tested every day even if a
# push-time run never got a machine, and `workflow_dispatch` runs it on
# demand. Either way nothing the app does reaches a phone from here: a build
# goes to TestFlight from the owner's Mac (docs/ops/APPLE_SIGNING.md), after
# `make ios-test` and the phone bench have passed there.
#
# The hosted runner's newest Xcode is 26.x (the iOS 26 SDK, the app's
# minimum). The fold layouts need the iOS 27.1 SDK, which is on the owner's
# Mac; that code sits behind a compiler check so this runner builds without it.
name: iOS app

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "design/tokens.json"
      - "Makefile"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "design/tokens.json"
      - "Makefile"
      - ".github/workflows/ios.yml"
  # 02:30 UTC (06:30 in Dubai): the app is tested daily whatever the pushes
  # did, so a run that never got a machine is never the last word.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick Xcode
        run: |
          for app in /Applications/Xcode_26.6.app /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version
      - name: Formatting
        run: make ios-lint
      # Google's WebRTC (ADR-006), pinned by version and SHA-256 in
      # ios/tools/webrtc.sh; only a new version downloads it again.
      - name: WebRTC cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/webrtc
          key: webrtc-${{ hashFiles('ios/tools/webrtc.sh') }}
      - name: Fetch WebRTC
        run: make ios-deps
      - name: Build (no signing)
        run: make ios-build
      - name: Unit tests
        run: make ios-test
      # The same build the App Store would get, minus the signing: it is the
      # only one that compiles the release-only paths (docs/PHASE2.md §14).
      - name: Build for a real iPhone (no signing)
        run: make ios-build-device
