# Linx CI: tests on amd64 + arm64, security gates, signed multi-arch images.
# Every action is pinned to a full commit SHA (version in the trailing comment);
# Dependabot keeps them current.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup-dev
      - run: make lint
      - run: make test
      - run: make test-docker
      - run: make build

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup-dev
      - name: Vulnerabilities, audit and licences
        run: make security
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Source SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: linx-source.spdx.json

  images:
    needs: [test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io (master only)
      id-token: write # keyless cosign signing (master only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: control-plane, dockerfile: deploy/docker/go-service.Dockerfile, build-args: "SERVICE=control-plane" }
          - { service: certd, dockerfile: deploy/docker/go-service.Dockerfile, build-args: "SERVICE=certd" }
          # The official coturn image plus Linx's Go entrypoint (ADR-039).
          - { service: coturn, dockerfile: deploy/docker/coturn.Dockerfile, build-args: "" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/linx-${{ matrix.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          load: true
          tags: linx-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (block on high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: linx-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image (push on master)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ matrix.build-args }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with:
          cosign-release: v3.1.3

      - name: Sign image (keyless, by digest)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # linx-asterisk compiles Asterisk from source (deploy/docker/asterisk.Dockerfile);
  # QEMU-emulating that for arm64 on the amd64 runner above took 50+ minutes
  # for that leg alone. Each architecture instead builds natively on its own
  # runner and the two are merged into one multi-arch manifest below.
  asterisk-build:
    name: images (asterisk, ${{ matrix.arch }})
    needs: [test, security]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io by digest (master only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/linx-asterisk
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Always built for amd64 (Trivy needs a local image); for arm64 only
      # on a PR/branch build, to check it still compiles — on master this
      # arch goes straight to the push-by-digest build below instead of
      # building it twice.
      - name: Build local image
        if: matrix.arch == 'amd64' || env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/asterisk.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: linx-asterisk:${{ matrix.arch }}
          cache-from: type=gha,scope=asterisk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=asterisk-${{ matrix.arch }}

      - name: Scan image (block on high/critical)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: linx-asterisk:amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The phone engine's call suite (docs/PBX.md §7) against the image just
      # built: real Asterisk and Postgres, SIPp phones over TLS + SRTP, and
      # the control plane's ARI app (internal/calltest). The test job's
      # `make test-docker` skips it, having no Asterisk image.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.arch == 'amd64'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Call suite
        if: matrix.arch == 'amd64'
        env:
          LINX_ASTERISK_IMAGE: linx-asterisk:amd64
        run: make test-calls

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest (master only)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/asterisk.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=asterisk-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asterisk-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two single-arch digests above into one multi-arch manifest
  # and signs it — mirrors the "images" job's tag/sign steps for the other
  # services, just split because the build itself is split across runners.
  asterisk-publish:
    needs: [asterisk-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/linx-asterisk
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: asterisk-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (keyless, by digest)
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${{ github.sha }}" --format '{{json .Manifest}}' | jq -r '.digest')
          cosign sign --yes "${IMAGE}@${digest}"
