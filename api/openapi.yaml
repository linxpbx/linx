# Linx public API (docs/API.md). Hand-written; `make api` generates the Go
# server (services/control-plane/api/gen.go) and, later, the web TypeScript
# client from this file. Endpoints are added to this spec one build-order
# step at a time (docs/API.md §8): step 2, the skeleton; step 3,
# authentication (API keys, OAuth clients, /oauth/token); step 4, webhooks
# and the outbound allowlist; step 5, admin alert channels and alerts.
#
# Security: every operation needs a bearer credential unless it says
# `security: []`. The scopes listed under `bearer` are enforced by the
# request validator before the handler runs (docs/API.md §3).
openapi: 3.1.0
info:
  title: Linx API
  version: "1"
  description: >-
    The API used by the admin portal, the web client, the `linx` CLI and
    every integration (docs/API.md).
  license:
    name: Apache-2.0
    identifier: Apache-2.0

security:
  - bearer: []

paths:
  /api/v1/openapi.json:
    get:
      operationId: getOpenapiSpec
      summary: This API's own OpenAPI document
      description: Public; contains no secrets (docs/API.md §2).
      tags: [meta]
      security: []
      responses:
        "200":
          description: The OpenAPI document served by this API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Who am I, which scopes
      description: Identifies the caller — a signed-in person, API key or OAuth client — and the scopes it holds.
      tags: [meta]
      responses:
        "200":
          description: The calling principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/event-types:
    get:
      operationId: listEventTypes
      summary: Webhook and admin-alert event types this server can emit
      description: The event catalog webhook endpoints subscribe to (docs/API.md §4).
      tags: [meta]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of event types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypeList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Get the admin portal's settings
      description: Numbering plan, site kind, Simple mode and where admins may sign in from (docs/ADMIN.md §4, §3).
      tags: [settings]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSettings
      summary: Change the settings
      description: >-
        JSON Merge Patch: only the fields sent change. Changing
        `admin_network_restricted` or `admin_networks` needs a fresh
        "confirm it's you" (docs/ADMIN.md §7).
      tags: [settings]
      security:
        - bearer: [settings:write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The settings as they now are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/numbering/next:
    get:
      operationId: nextExtensionNumber
      summary: The next free extension number
      description: The lowest unused number in the people range (docs/ADMIN.md §4).
      tags: [settings]
      security:
        - bearer: [extensions:read]
      responses:
        "200":
          description: The next free number.
          content:
            application/json:
              schema:
                type: object
                required: [number]
                properties:
                  number:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/setup:
    get:
      operationId: getSetup
      summary: The setup wizard's progress
      description: >-
        Resumable (docs/ADMIN.md §4): the wizard's own data is saved to the
        real resource each step fills in (settings, people, phone lines,
        the "Everyone" calling level); this is only where to pick back up.
      tags: [settings]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The wizard's progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupProgress"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSetup
      summary: Move the setup wizard on
      description: >-
        Advances (or resumes) the wizard's step. Setting `complete: true`
        creates the "Everyone" calling level if none exists yet and gives
        it to every extension without one, new ones too (docs/ADMIN.md §4).
      tags: [settings]
      security:
        - bearer: [settings:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  type: integer
                  minimum: 1
                  maximum: 7
                complete:
                  type: boolean
      responses:
        "200":
          description: The wizard's progress as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupProgress"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      summary: The activity log
      description: Every write, key use for writes, replay and failed auth (docs/API.md §2), newest first.
      tags: [settings]
      security:
        - bearer: [audit:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor
          in: query
          description: Only entries by this actor, e.g. "user:<id>" or "api_key:<id>".
          schema:
            type: string
        - name: action
          in: query
          description: Only entries whose action starts with this, e.g. "user.".
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogEntryList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      description: >-
        What `linx doctor` can see from inside the control plane: each Linx
        service's state as the server helper (linx-ops-agent) last reported
        it, the certificate, open alerts, phone lines and WireGuard tunnels
        (docs/ADMIN.md §9). Host-only checks (firewall, systemd, DNS) stay
        in `linx doctor`.
      tags: [settings]
      security:
        - bearer: [system:read]
      parameters:
        - name: check
          in: query
          description: >-
            Ask the server helper to check every service now first ("Check
            now"), waiting up to 15 s. Without it, the state is at most 10 s
            old.
          schema:
            type: boolean
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/system/services/{service}/log:
    get:
      operationId: getServiceLog
      summary: A service's recent log lines
      description: >-
        The last lines of one Linx service's log, oldest first, read on the
        server by linx-ops-agent (docs/ADMIN.md §9, ADR-056). Only the
        services System → Status lists.
      tags: [settings]
      security:
        - bearer: [logs:read]
      parameters:
        - $ref: "#/components/parameters/ServiceName"
        - name: lines
          in: query
          description: How many lines (default 200, at most 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLog"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/system/services/{service}/restart:
    post:
      operationId: restartService
      summary: Restart a service
      description: >-
        Restarts one Linx service through linx-ops-agent and answers once
        it's running again (`restarted`), or at once for the control plane
        itself (`restarting`: this connection ends with it). Not the
        database or the internal certificate authority (409
        `not_restartable`); at most once in 30 s per service (429
        `restarted_recently`). Restarting the phone system ends calls in
        progress. Audited as `system.service_restart` (a second entry, result `failed`, if it didn't work).
      tags: [settings]
      security:
        - bearer: [system:write]
      parameters:
        - $ref: "#/components/parameters/ServiceName"
      responses:
        "200":
          description: Restarted, or restarting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRestart"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-settings:
    get:
      operationId: getBackupSettings
      summary: Get the backup schedule
      description: Off by default; daily, weekly or monthly otherwise, at a time the admin sets (docs/BACKUP.md §5).
      tags: [backups]
      security:
        - bearer: [backups:read]
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBackupSettings
      summary: Change the backup schedule
      description: "JSON Merge Patch: only the fields sent change."
      tags: [backups]
      security:
        - bearer: [backups:write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BackupSettingsPatch"
      responses:
        "200":
          description: The schedule as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettings"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backups:
    get:
      operationId: listBackups
      summary: Backup history
      description: Every attempt, scheduled or "back up now", newest first (docs/BACKUP.md §5).
      tags: [backups]
      security:
        - bearer: [backups:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of backup history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRunList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestBackup
      summary: Back up now
      description: >-
        Queues a run against every configured destination; linx-backup-agent
        picks it up within a minute and reports back, appearing in the
        history (docs/BACKUP.md §1).
      tags: [backups]
      security:
        - bearer: [backups:write]
      responses:
        "202":
          description: Queued.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-restore:
    get:
      operationId: getRestore
      summary: How a restore from a backup is going
      description: >-
        The setup wizard's "Restore from a backup" (docs/BACKUP.md §4).
        status none: nothing asked for; pending: waiting for the server's
        backup helper (linx-backup-agent), which checks once a minute;
        running: restoring; failed: see error. A finished restore replaces
        the whole database, sessions included, so the wizard learns it
        worked when this starts answering 401.
      tags: [backups]
      security:
        - bearer: [backups:read]
      responses:
        "200":
          description: The restore request, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStatus"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestRestore
      summary: Restore everything from a backup
      description: >-
        Replaces every person, setting and key on this server with a
        backup's. Only a system admin's own session, after "confirm it's
        you", and only before setup is finished (`restore_after_setup`
        otherwise; `sudo linx restore` on the server works any time).
        The password is kept sealed until the server's backup helper
        picks the request up (within a minute), then deleted.
      tags: [backups]
      security:
        - bearer: [backups:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-restore/file:
    put:
      operationId: uploadRestoreFile
      summary: Upload a backup file to restore from
      description: >-
        The setup wizard's "A backup file on my computer" (docs/BACKUP.md
        §8 step 5): the file System → Backups → Download gave you (or
        `sudo linx backup export`), sent as the raw request body, at most
        about 2 GB. The server keeps it, unopened, for two hours (only the
        newest upload); restore it with `POST /backup-restore`, source
        `upload`, location the returned `upload_id`. Same rules as the
        restore itself: a system admin's own session, after "confirm it's
        you", before setup is finished. Served by a hand-written handler
        (excluded from code generation), so the body streams to disk
        instead of being read into memory to validate.
      tags: [backups]
      security:
        - bearer: [backups:write]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreUpload"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-download:
    get:
      operationId: getBackupDownload
      summary: The backup file being made for download
      description: >-
        System → Backups → Download (docs/BACKUP.md §8 step 5). status none:
        nothing asked for (or the last file expired); pending: waiting for
        the server's backup helper (within a minute); preparing: backing up
        and making the file; ready: `mine` callers may fetch it and its
        password until expires_at; failed: see error.
      tags: [backups]
      security:
        - bearer: [backups:read]
      responses:
        "200":
          description: The backup-file request, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDownload"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestBackupDownload
      summary: Make a backup file to download
      description: >-
        The server's backup helper backs up now, then packs the backups
        kept on the server (the first local destination) into one file:
        still encrypted, needing that backup's password. Only the caller
        may fetch it, for an hour. A session confirms it's them first
        (`confirm_required`); `download_in_progress` while one is being
        made.
      tags: [backups]
      security:
        - bearer: [backups:write]
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDownload"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-download/file:
    get:
      operationId: getBackupDownloadFile
      summary: Download the backup file
      description: >-
        The ready backup file (application/x-tar, a download named
        linx-backup-DATE.tar), to the caller who asked for it only
        (`download_not_ready` otherwise). Supports Range, so a broken
        download can resume. Served by a hand-written handler (excluded
        from code generation), to stream the file.
      tags: [backups]
      security:
        - bearer: [backups:write]
      responses:
        "200":
          description: The file.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backup-download/password:
    post:
      operationId: showBackupDownloadPassword
      summary: Show the backup file's password
      description: >-
        The password the ready backup file needs: the backup's own,
        generated by Linx when backups were first set up. The caller who
        asked for the file only, after "confirm it's you"; every showing is
        in the activity log (docs/BACKUP.md §6).
      tags: [backups]
      security:
        - bearer: [backups:write]
      responses:
        "200":
          description: The password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPassword"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: Newest first, including revoked and expired keys. Secrets are never returned.
      tags: [api-keys]
      security:
        - bearer: [api_keys:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: >-
        The key is in the response once and can't be shown again. Its role
        and scopes can't exceed the caller's. Not idempotent: retrying
        creates a second key (a stored response would have to keep the secret).
      tags: [api-keys]
      security:
        - bearer: [api_keys:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: The new key, with its secret shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getApiKey
      summary: Get an API key
      tags: [api-keys]
      security:
        - bearer: [api_keys:read]
      responses:
        "200":
          description: The API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Takes effect immediately. Revoking a revoked key succeeds and changes nothing.
      tags: [api-keys]
      security:
        - bearer: [api_keys:write]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/oauth-clients:
    get:
      operationId: listOauthClients
      summary: List OAuth clients
      description: Newest first, including revoked and expired clients. Secrets are never returned.
      tags: [oauth-clients]
      security:
        - bearer: [oauth_clients:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of OAuth clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOauthClient
      summary: Create an OAuth client
      description: >-
        For the client credentials grant at /oauth/token. The secret is in
        the response once and can't be shown again. Role and scopes can't
        exceed the caller's. Not idempotent.
      tags: [oauth-clients]
      security:
        - bearer: [oauth_clients:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: The new client, with its secret shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/oauth-clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getOauthClient
      summary: Get an OAuth client
      tags: [oauth-clients]
      security:
        - bearer: [oauth_clients:read]
      responses:
        "200":
          description: The OAuth client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeOauthClient
      summary: Revoke an OAuth client
      description: Takes effect immediately, including for access tokens it already holds.
      tags: [oauth-clients]
      security:
        - bearer: [oauth_clients:write]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      description: Newest first. Signing secrets are never returned.
      tags: [webhooks]
      security:
        - bearer: [webhooks:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of webhook endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      summary: Register a webhook endpoint
      description: >-
        Linx will POST events to this HTTPS URL, signed in the Standard
        Webhooks format (docs/API.md §4). The signing secret is in the
        response once. A URL whose host resolves to a private address is
        refused unless that address or host is on the outbound allowlist.
        Not idempotent: retrying registers a second endpoint.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
      responses:
        "201":
          description: The new endpoint, with its signing secret shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getWebhook
      summary: Get a webhook endpoint
      tags: [webhooks]
      security:
        - bearer: [webhooks:read]
      responses:
        "200":
          description: The endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWebhook
      summary: Change a webhook endpoint
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the endpoint's `etag` to refuse the change (412) if someone else
        changed it first. Turning an endpoint off cancels deliveries still
        waiting to be retried; turning it on clears why it was off.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/WebhookPatch"
      responses:
        "200":
          description: The endpoint as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Deletes the endpoint and its delivery log.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rotateWebhookSecret
      summary: Issue a new signing secret
      description: >-
        The new secret is in the response once. For 24 hours messages carry
        two signatures, one with the new and one with the old secret, so
        the receiver can switch over without missing any.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      responses:
        "200":
          description: The endpoint and its new secret, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testWebhook
      summary: Send a test message now
      description: >-
        Sends a `webhook.test` event to this endpoint only and waits for the
        answer (up to 10 seconds). Works while the endpoint is turned off,
        to check it before turning it back on. Tried once; a failed test
        never turns the endpoint off.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      responses:
        "200":
          description: The delivery with its attempt (succeeded or failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: replayWebhook
      summary: Re-send failed deliveries
      description: >-
        Queues again every event that failed, or was cancelled when the
        endpoint was turned off, since `since` — unless it has been
        delivered or queued again already. Each gets the full retry
        schedule. At most 10,000 per call.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookReplay"
      responses:
        "202":
          description: How many deliveries were queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReplayResult"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listWebhookDeliveries
      summary: The endpoint's delivery log
      description: Newest first, kept 30 days. GET /webhook-deliveries/{id} shows each attempt.
      tags: [webhooks]
      security:
        - bearer: [webhooks:read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of deliveries (without their attempts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhook-deliveries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getWebhookDelivery
      summary: Get a delivery with its attempts
      tags: [webhooks]
      security:
        - bearer: [webhooks:read]
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/webhook-deliveries/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: replayWebhookDelivery
      summary: Re-send one delivery
      description: >-
        Queues the same event (same `webhook-id`) to the same endpoint again,
        with the full retry schedule. Not for deliveries still being tried or
        for test messages.
      tags: [webhooks]
      security:
        - bearer: [webhooks:write]
      responses:
        "202":
          description: The new delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/outbound-allowlist:
    get:
      operationId: listOutboundAllowlist
      summary: List the outbound allowlist
      description: >-
        Private addresses and host names that webhooks and alert senders may
        reach (a NAS, Home Assistant). Server-wide.
      tags: [outbound-allowlist]
      security:
        - bearer: [outbound_allowlist:read]
      responses:
        "200":
          description: Every entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowlistEntryList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOutboundAllowlistEntry
      summary: Allow a private range or host
      description: >-
        `value` is a CIDR range or address inside one private range
        (192.168.1.0/24, 10.0.0.5, fd00::/64), or an exact host name
        (nas.home.arpa) whose addresses may then be private. Loopback, Linx's
        own networks and cloud metadata addresses can never be allowed. The
        receiver still needs HTTPS with a trusted certificate.
      tags: [outbound-allowlist]
      security:
        - bearer: [outbound_allowlist:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowlistEntryCreate"
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowlistEntry"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/outbound-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteOutboundAllowlistEntry
      summary: Remove an allowlist entry
      description: New connections stop using it at once.
      tags: [outbound-allowlist]
      security:
        - bearer: [outbound_allowlist:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/alert-channels:
    get:
      operationId: listAlertChannels
      summary: List alert channels
      description: Newest first. Settings (URLs, tokens) are never returned.
      tags: [alerts]
      security:
        - bearer: [alerts:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of alert channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAlertChannel
      summary: Add an alert channel
      description: >-
        `config` holds the fields this kind needs (docs/API.md §5); a URL in
        it is checked the same way as a webhook's. For a `webhook` channel,
        Linx generates the signing secret and returns it once. Not
        idempotent: retrying adds a second channel.
      tags: [alerts]
      security:
        - bearer: [alerts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertChannelCreate"
      responses:
        "201":
          description: The new channel (with its signing secret, for a webhook channel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelCreated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/alert-channels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAlertChannel
      summary: Get an alert channel
      tags: [alerts]
      security:
        - bearer: [alerts:read]
      responses:
        "200":
          description: The channel.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAlertChannel
      summary: Change an alert channel
      description: >-
        JSON Merge Patch: only the fields sent change. `config` and
        `quiet_hours`, when sent, replace as a whole, not merged field by
        field. Send `If-Match` with the channel's `etag` to refuse the
        change (412) if someone else changed it first.
      tags: [alerts]
      security:
        - bearer: [alerts:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AlertChannelPatch"
      responses:
        "200":
          description: The channel as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAlertChannel
      summary: Remove an alert channel
      tags: [alerts]
      security:
        - bearer: [alerts:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/alert-channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testAlertChannel
      summary: Send a test message now
      description: >-
        Sends a test message to this channel and waits for the answer (up
        to 10 seconds). Works while the channel is turned off. Not logged.
      tags: [alerts]
      security:
        - bearer: [alerts:write]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelTestResult"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Open and recent alerts
      description: Newest first.
      tags: [alerts]
      security:
        - bearer: [alerts:read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/extensions:
    get:
      operationId: listExtensions
      summary: List extensions
      description: Newest first.
      tags: [extensions]
      security:
        - bearer: [extensions:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of extensions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createExtension
      summary: Add an extension
      description: "Not idempotent: retrying creates a second extension."
      tags: [extensions]
      security:
        - bearer: [extensions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionCreate"
      responses:
        "201":
          description: The new extension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/extensions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getExtension
      summary: Get an extension
      tags: [extensions]
      security:
        - bearer: [extensions:read]
      responses:
        "200":
          description: The extension.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateExtension
      summary: Change an extension
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the extension's `etag` to refuse the change (412) if someone else
        changed it first. Turning an extension off stops every device under
        it from ringing, at once.
      tags: [extensions]
      security:
        - bearer: [extensions:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ExtensionPatch"
      responses:
        "200":
          description: The extension as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteExtension
      summary: Delete an extension
      description: >-
        Revokes every device under it in the same transaction (their logins
        stop at once) and frees the number for reuse.
      tags: [extensions]
      security:
        - bearer: [extensions:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/devices:
    get:
      operationId: listDevices
      summary: List every device
      description: >-
        Every phone or app in the tenant, newest first — the Extensions
        list's "Phones" column (docs/ui/ADMIN_SCREENS_PHASE1E.md §5.1). To
        add one, POST to an extension's own `/devices` (it must belong to
        one).
      tags: [devices]
      security:
        - bearer: [devices:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/extensions/{id}/devices:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listExtensionDevices
      summary: List an extension's devices
      description: Newest first.
      tags: [devices]
      security:
        - bearer: [devices:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDevice
      summary: Add a device
      description: >-
        Its SIP login is generated by Linx and shown once in the response
        (ADR-033): Linx never asks for or stores a chosen password. Not
        idempotent: retrying adds a second device.
      tags: [devices]
      security:
        - bearer: [devices:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: The new device, with its SIP login shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredentials"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDevice
      summary: Get a device
      tags: [devices]
      security:
        - bearer: [devices:read]
      responses:
        "200":
          description: The device.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDevice
      summary: Change a device
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the device's `etag` to refuse the change (412) if someone else
        changed it first. Turning a device off logs it out at once; it can
        be turned back on with the same login. A revoked device can't be
        changed (409 `device_revoked`).
      tags: [devices]
      security:
        - bearer: [devices:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: The device as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeDevice
      summary: Revoke a device
      description: >-
        Takes effect immediately and for good: a revoked device can never be
        turned back on (add a new device instead). Revoking a revoked device
        succeeds and changes nothing.
      tags: [devices]
      security:
        - bearer: [devices:write]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/devices/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resetDevicePassword
      summary: Issue a new SIP password
      description: >-
        The device's SIP username doesn't change; only its password, shown
        once in the response. The phone or app must be reconfigured with it.
        Not for a revoked device (409 `device_revoked`).
      tags: [devices]
      security:
        - bearer: [devices:write]
      responses:
        "200":
          description: The device, with its new SIP login shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredentials"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/trunks:
    get:
      operationId: listTrunks
      summary: List trunks
      description: Newest first.
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of trunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrunkList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTrunk
      summary: Add a trunk
      description: >-
        Not idempotent: retrying adds a second trunk. Refused (422
        `unencrypted_confirmation_required`) if the trunk as given is
        unencrypted (docs/TRUNKS.md §6, ADR-023) and isn't reached through a
        WireGuard profile, unless `confirm_unencrypted` is sent too.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrunkCreate"
      responses:
        "201":
          description: The new trunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trunk"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/trunks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getTrunk
      summary: Get a trunk
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      responses:
        "200":
          description: The trunk.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trunk"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTrunk
      summary: Change a trunk
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the trunk's `etag` to refuse the change (412) if someone else
        changed it first. Send `confirm_unencrypted: true` in the same
        request that makes the trunk unencrypted (ADR-023).
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/TrunkPatch"
      responses:
        "200":
          description: The trunk as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trunk"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTrunk
      summary: Delete a trunk
      description: Also deletes every DID it owns, in the same transaction.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/trunks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testTrunk
      summary: Test a trunk's connection
      description: >-
        Checks the trunk as it's saved, from the control plane, step by
        step (docs/TRUNKS.md §6): its address, the connection, its TLS
        certificate (public CAs or the pinned one, and its name), that it
        answers SIP, and for a trunk Linx signs in to, that it accepts the
        login (a REGISTER with no Contact, which changes nothing at the
        provider). Takes up to about 20 seconds. Places no call.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      responses:
        "200":
          description: The result (a failed check is still a 200; see `ok`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrunkTest"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/route-test:
    post:
      operationId: testRoute
      summary: See what would happen to an outgoing call
      description: >-
        The same decision a real call gets (docs/TRUNKS.md §5), without
        making it: what kind of number it is, whether the extension may
        call it, and which lines it would go out on.
      tags: [trunks]
      security:
        - bearer: [routing:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTestRequest"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteTest"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/trunks/{id}/dids:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listTrunkDids
      summary: List a trunk's phone numbers
      description: Newest first.
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of phone numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DidList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDid
      summary: Add a phone number to a trunk
      description: >-
        Not idempotent: retrying adds a duplicate number (refused, 409
        `number_duplicate`: a number can belong to only one trunk).
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DidCreate"
      responses:
        "201":
          description: The new phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Did"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/dids/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDid
      summary: Get a phone number
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      responses:
        "200":
          description: The phone number.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Did"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDid
      summary: Change a phone number's route
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the number's `etag` to refuse the change (412) if someone else
        changed it first. Send `extension_id: ""` to clear it: calls to the
        number then hear "not in use".
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/DidPatch"
      responses:
        "200":
          description: The phone number as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Did"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDid
      summary: Remove a phone number from its trunk
      description: The number can be added to another trunk afterwards.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/inbound-routes:
    get:
      operationId: listInboundRoutes
      summary: List every phone number's route
      description: Every DID of every trunk, newest first (docs/TRUNKS.md §5).
      tags: [trunks]
      security:
        - bearer: [routing:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of phone numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundRouteList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/outbound-routing:
    get:
      operationId: getOutboundRouting
      summary: See the outgoing call order
      description: The country Linx is set up in and which trunks outgoing calls try, in order (docs/TRUNKS.md §5).
      tags: [trunks]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The outbound routing summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundRouting"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setOutboundRouting
      summary: Set the outgoing call order
      description: >-
        Trunks named in `order` are tried for outgoing calls in that
        sequence, primary first; trunks left out stop being used for
        outgoing calls (their phone numbers keep ringing in).
      tags: [trunks]
      security:
        - bearer: [routing:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundRoutingUpdate"
      responses:
        "200":
          description: The outbound routing summary as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundRouting"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/wireguard-profiles:
    get:
      operationId: listWireguardProfiles
      summary: List WireGuard profiles
      description: Newest first.
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireguardProfileList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWireguardProfile
      summary: Add a WireGuard profile
      description: >-
        Import a whole wg-quick configuration with `config`, or fill in the
        fields directly. The private key (and preshared key, if any) is
        sealed and never shown again. Not idempotent: retrying adds a
        second profile.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireguardProfileCreate"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireguardProfile"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/wireguard-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getWireguardProfile
      summary: Get a WireGuard profile
      tags: [trunks]
      security:
        - bearer: [trunks:read]
      responses:
        "200":
          description: The profile.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireguardProfile"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWireguardProfile
      summary: Change a WireGuard profile
      description: >-
        JSON Merge Patch of the profile's non-secret fields; reissue it
        (delete and re-create) to change its keys. Send `If-Match` with the
        profile's `etag` to refuse the change (412) if someone else changed
        it first.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/WireguardProfilePatch"
      responses:
        "200":
          description: The profile as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireguardProfile"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWireguardProfile
      summary: Delete a WireGuard profile
      description: Refused (409 `wireguard_profile_in_use`) while a trunk still connects through it.
      tags: [trunks]
      security:
        - bearer: [trunks:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/call-permission-levels:
    get:
      operationId: listCallPermissionLevels
      summary: List call permission levels
      description: Newest first.
      tags: [trunks]
      security:
        - bearer: [routing:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of levels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevelList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCallPermissionLevel
      summary: Add a call permission level
      description: "Not idempotent: retrying adds a second level."
      tags: [trunks]
      security:
        - bearer: [routing:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPermissionLevelCreate"
      responses:
        "201":
          description: The new level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/call-permission-levels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCallPermissionLevel
      summary: Get a call permission level
      tags: [trunks]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The level.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCallPermissionLevel
      summary: Change a call permission level
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the level's `etag` to refuse the change (412) if someone else
        changed it first.
      tags: [trunks]
      security:
        - bearer: [routing:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CallPermissionLevelPatch"
      responses:
        "200":
          description: The level as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCallPermissionLevel
      summary: Delete a call permission level
      description: Refused (409 `permission_level_in_use`) while an extension still has it assigned.
      tags: [trunks]
      security:
        - bearer: [routing:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/calls/active:
    get:
      operationId: listActiveCalls
      summary: Calls in progress
      description: >-
        Live, from the phone engine's own view of its calls (docs/PBX.md §4).
        Not paginated: a Linx server has at most a few dozen calls at once.
        `phone_engine_connected` false means the control plane can't see
        the phone engine right now, so the list may be out of date (calls
        themselves keep working).
      tags: [calls]
      security:
        - bearer: [calls:read]
      responses:
        "200":
          description: The calls in progress, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCallList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session:
    post:
      operationId: createSession
      summary: "Sign in (step 1: email and password)"
      description: >-
        Sets the __Host-linx_session and __Host-linx_csrf cookies
        (docs/WEB.md §4). Served by a hand-written handler (excluded from
        code generation): it needs to set two cookies, which a typed JSON
        response can't do.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: Signed in, or pending an authenticator code or first-run MFA enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Sign out
      description: >-
        Ends the caller's own session and clears its cookies. Served by a
        hand-written handler (excluded from code generation): it
        authenticates the session cookie itself, not through the bearer
        scheme this spec's operations otherwise declare.
      tags: [sessions]
      security: []
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/mfa:
    post:
      operationId: verifySessionMfa
      summary: "Sign in (step 2: authenticator code)"
      description: >-
        For a session still pending its authenticator code. A recovery code
        also works. Served by a hand-written handler (excluded from code
        generation).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCode"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/confirm:
    post:
      operationId: confirmSession
      summary: "\"Confirm it's you\""
      description: >-
        A fresh proof of identity for the most dangerous actions
        (docs/ADMIN.md §7), without ending this or any other session:
        password, plus the authenticator code if one is enrolled. After
        company sign-in (POST /session/confirm/company) answered
        `code_required`, send just the code. Good for 10 minutes. Served by a hand-written handler (excluded from code
        generation, like the other session endpoints).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                code:
                  type: string
                  description: The authenticator (or recovery) code, if one is enrolled.
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/setup-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: checkSetupLink
      summary: Check a set-password link before asking for a password
      description: >-
        200 with the link's person if it can still be used; 400
        `setup_link_invalid` if it was used, has expired or doesn't exist
        (the page then says so instead of showing the password form). A
        link that fails counts against the caller's address like a failed
        sign-in. Served by a hand-written handler (excluded from code
        generation).
      tags: [sessions]
      security: []
      responses:
        "200":
          description: The link can be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeSetupLink
      summary: Pick a password with a one-time set-password link
      description: >-
        Signs the person in at once (docs/WEB.md §4). Served by a
        hand-written handler (excluded from code generation).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  description: At least 12 characters.
                password_only:
                  type: boolean
                  description: >-
                    The "Password only" choice (docs/ADMIN.md §5): for an
                    admin, the "not recommended" warning was shown and
                    accepted, so no passkey or authenticator is asked for.
                    Refused (409 `second_step_exists`) for an account that
                    already has one.
      responses:
        "200":
          description: Signed in, or pending its second step (or that step's setup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List people
      tags: [people]
      security:
        - bearer: [users:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Add a person
      description: >-
        Returns a one-time set-password link token, valid 24 hours
        (docs/WEB.md §4). Their role can't exceed the caller's.
      tags: [people]
      security:
        - bearer: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: The new person, with a one-time set-password link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getUser
      summary: Get a person
      tags: [people]
      security:
        - bearer: [users:read]
      responses:
        "200":
          description: The person.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateUser
      summary: Change a person
      description: >-
        JSON Merge Patch: only the fields sent change. `disabled: true` ends
        every session of theirs at once (docs/WEB.md §4). Send `If-Match`
        with the person's `etag` to refuse the change (412) if someone else
        changed them first. Giving the admin or system_admin role needs a
        fresh "confirm it's you" (docs/ADMIN.md §7).
      tags: [people]
      security:
        - bearer: [users:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: The person as they now are.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: disableUser
      summary: Disable a person
      description: >-
        Stops them signing in and ends every session of theirs at once
        (docs/WEB.md §4). Disabling a disabled person succeeds and changes
        nothing. Never deletes their history.
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/setup-link:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createUserSetupLink
      summary: Issue a new set-password link
      description: A fresh one-time link (24 hours), for a new person or one who lost theirs.
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "200":
          description: A one-time set-password link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkIssued"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/reset-mfa:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resetUserMfa
      summary: Reset a person's authenticator
      description: >-
        Turns off their authenticator and passkeys and ends every session
        of theirs, for when they've lost their second step (docs/ADMIN.md
        §7); they enroll again from scratch. Needs a fresh "confirm it's
        you".
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "200":
          description: The person, with MFA now off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unlockUser
      summary: Let a locked person sign in again
      description: >-
        Clears their lockout wait and failed-attempt count; doesn't change
        their password — if someone else was guessing it, that's a separate
        decision (`linx user unlock`, docs/ui/ADMIN_SCREENS_PHASE1E.md §4).
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "200":
          description: The person, unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      summary: Change my own password
      description: Ends every session of mine, including this one (docs/WEB.md §4).
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/mfa:
    post:
      operationId: beginMyMfaEnrollment
      summary: Start turning on an authenticator app
      description: >-
        Returns a secret and its otpauth:// URI to scan; unconfirmed until
        POST /me/mfa/confirm (docs/WEB.md §4).
      tags: [people]
      responses:
        "200":
          description: A pending authenticator secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/mfa/confirm:
    post:
      operationId: confirmMyMfaEnrollment
      summary: Confirm the authenticator app and turn MFA on
      description: >-
        Returns 10 recovery codes, shown once. If the caller's session was
        still pending MFA, it's promoted to a full session.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCode"
      responses:
        "200":
          description: MFA is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmed"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/passkey/options:
    post:
      operationId: createPasskeySessionOptions
      summary: "Sign in with a passkey (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. No email: the device offers its passkeys for this server (discoverable credentials, user verification required). A whole sign-in, both steps, for admins too (docs/ADMIN.md §5). Needs no session. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/passkey:
    post:
      operationId: createPasskeySession
      summary: "Sign in with a passkey (the device's answer)"
      description: >-
        The device's answer to the challenge from .../options, as
        PublicKeyCredential.toJSON() gives it. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAnswer"
      responses:
        "200":
          description: Signed in; sets the session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/mfa/passkey/options:
    post:
      operationId: verifySessionMfaPasskeyOptions
      summary: "Sign in (step 2: a passkey) (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. For a session pending its second step whose person has a passkey (`methods` includes `passkey`). Needs the session cookie and CSRF header. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/mfa/passkey:
    post:
      operationId: verifySessionMfaPasskey
      summary: "Sign in (step 2: a passkey) (the device's answer)"
      description: >-
        The device's answer to the challenge from .../options, as
        PublicKeyCredential.toJSON() gives it. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAnswer"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/confirm/passkey/options:
    post:
      operationId: confirmSessionPasskeyOptions
      summary: "\"Confirm it's you\" with a passkey (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. One of the person's own passkeys, for the actions that need a fresh proof (docs/ADMIN.md §7). Needs a whole (not pending) session and the CSRF header. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/confirm/passkey:
    post:
      operationId: confirmSessionPasskey
      summary: "\"Confirm it's you\" with a passkey (the device's answer)"
      description: >-
        The device's answer to the challenge from .../options, as
        PublicKeyCredential.toJSON() gives it. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAnswer"
      responses:
        "200":
          description: Confirmed for 10 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/passkeys/options:
    post:
      operationId: addMyPasskeyOptions
      summary: "Add a passkey to my account (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. At most 10. In a whole session this needs "confirm it's you" (a new passkey is a new way in); a session pending its second step's setup may add its first one, which finishes signing in. Needs the session cookie and CSRF header. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/setup-links/{token}/passkey/options:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completeSetupLinkPasskeyOptions
      summary: "Set up an account with a passkey instead of a password (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. The "Passkey" choice on a set-password link (docs/ADMIN.md §5), only for an account with no passkey or authenticator yet (409 `second_step_exists`). The link is used up, any password the account had is removed, and every other session ends. Needs no session. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/setup-links/{token}/passkey:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completeSetupLinkPasskey
      summary: "Set up an account with a passkey instead of a password (the device's answer)"
      description: >-
        The device's answer to the challenge from .../options, as
        PublicKeyCredential.toJSON() gives it. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyNew"
      responses:
        "200":
          description: Signed in; recovery_codes shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: List my passkeys
      tags: [people]
      responses:
        "200":
          description: The caller's own passkeys, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMyPasskey
      summary: "Add a passkey to my account (the device's answer)"
      description: >-
        The device's answer to the challenge from POST
        /me/passkeys/options, as PublicKeyCredential.toJSON() gives it. At
        most 10 passkeys. In a whole session this needs "confirm it's you"
        (a new passkey is a new way in); a session pending its second
        step's setup may add its first one, which finishes signing in.
        Served by a hand-written handler (excluded from code generation):
        it clears the challenge cookie.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyNew"
      responses:
        "201":
          description: Added. recovery_codes is present (shown once) when this is the person's first second step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAdded"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/passkeys/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameMyPasskey
      summary: Rename one of my passkeys
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMyPasskey
      summary: Remove one of my passkeys
      description: >-
        Needs "confirm it's you" (docs/ADMIN.md §7). Refused (409
        `last_sign_in_method`) when it's the only way a person without a
        password can sign in. When it's an admin's last passkey and they
        have no authenticator app, 409 `password_only_warning` unless
        accept_password_only=true: they'd sign in with a password only (not
        recommended, docs/ADMIN.md §5).
      tags: [people]
      parameters:
        - name: accept_password_only
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/sign-in-options:
    get:
      operationId: getSignInOptions
      summary: What the sign-in page offers
      description: >-
        The company sign-in buttons, whether passwords are off for most
        people, and whether passkeys work here. Public (the sign-in page
        has no session yet). Served by a hand-written handler.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInOptions"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/company:
    post:
      operationId: startCompanySignIn
      summary: Sign in with a company account (start)
      description: >-
        Returns the provider's sign-in page and sets the short-lived
        __Host-linx_sso cookie (SameSite=Lax, so it comes back with the
        provider's redirect) that binds the flow to this browser
        (docs/ADMIN.md §6). The provider sends the browser to GET
        /sso/callback. Hand-written (sets a cookie).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStart"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRedirect"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/confirm/company:
    post:
      operationId: startCompanyConfirm
      summary: "\"Confirm it's you\" with a company account (start)"
      description: >-
        Like POST /session/company, for a signed-in session with a linked
        account on that provider. The callback confirms the session, or,
        when the person has a passkey or authenticator, answers
        `code_required`: POST /session/confirm with just the code finishes
        it. Hand-written.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStart"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRedirect"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/sso/callback:
    get:
      operationId: companyCallback
      summary: Where providers send the browser back
      description: >-
        Registered at every provider as the redirect URI. Checks state
        against the __Host-linx_sso cookie, exchanges the code (PKCE) and
        checks the ID token (signature, issuer, audience, nonce), then
        redirects (303): signing in sets the session cookies and goes to
        `/` (the second step follows there, if the person has one); linking
        goes to `/account?company=linked`; confirming goes to
        `/company-done?result=confirmed|code_required`. A refusal goes to
        the same place with `company_error=<code>`: `no_account`,
        `email_unverified`, `not_linked`, `linked_elsewhere`,
        `email_mismatch`, `account_disabled`, `company_cancelled`,
        `company_expired`, `company_failed`. Hand-written.
      tags: [sessions]
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "303":
          description: Back to the web app.

  /api/v1/me/sso-links:
    get:
      operationId: listMyCompanyLinks
      summary: My company accounts
      tags: [people]
      responses:
        "200":
          description: The caller's linked company accounts, and the providers one can be linked on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCompanyAccounts"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startMyCompanyLink
      summary: Link a company account to mine (start)
      description: >-
        Like POST /session/company, for a signed-in session. The provider
        must vouch for an email equal to the person's Linx email. The
        callback goes to `/account?company=linked`. Hand-written.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStart"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRedirect"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/sso-links/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: unlinkMyCompanyAccount
      summary: Unlink one of my company accounts
      description: Refused (409 `last_sign_in_method`) when it's the only way left to sign in.
      tags: [people]
      responses:
        "204":
          description: Unlinked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/sso-links:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listUserCompanyLinks
      summary: A person's company accounts
      tags: [people]
      security:
        - bearer: [users:read]
      responses:
        "200":
          description: Their linked company accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyLinkList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/sso-links/{link_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: unlinkUserCompanyAccount
      summary: Unlink a person's company account
      description: Refused (409 `last_sign_in_method`) when it's the only way left for them to sign in.
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "204":
          description: Unlinked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/sso-providers:
    get:
      operationId: listSsoProviders
      summary: Company sign-in providers
      tags: [sso]
      security:
        - bearer: [sso:read]
      responses:
        "200":
          description: Every provider, in button order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProviderList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSsoProvider
      summary: Add a company sign-in provider
      description: >-
        Linx reads the issuer's discovery document first (422
        `issuer_unreachable` if it can't; `issuer_blocked` for a private
        address not on the outbound allowlist). Needs a fresh "confirm it's
        you" (docs/ADMIN.md §7).
      tags: [sso]
      security:
        - bearer: [sso:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoProviderNew"
      responses:
        "201":
          description: Added.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProvider"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/sso-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSsoProvider
      summary: Get a company sign-in provider
      tags: [sso]
      security:
        - bearer: [sso:read]
      responses:
        "200":
          description: The provider.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProvider"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSsoProvider
      summary: Change a company sign-in provider
      description: JSON Merge Patch with optional If-Match. Needs a fresh "confirm it's you".
      tags: [sso]
      security:
        - bearer: [sso:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SsoProviderPatch"
      responses:
        "200":
          description: The provider as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProvider"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSsoProvider
      summary: Remove a company sign-in provider
      description: Everyone's links to it go too. Needs a fresh "confirm it's you".
      tags: [sso]
      security:
        - bearer: [sso:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password-only:
    post:
      operationId: acceptPasswordOnly
      summary: Choose to sign in with a password only
      description: >-
        For an admin whose sign-in is waiting on setting up a passkey or an
        authenticator app (`mfa_setup_required`): they accept the "not
        recommended" warning and sign in with a password only (docs/ADMIN.md
        §5, owner decision 2026-09-27). Finishes that sign-in. Refused (409
        `second_step_exists`) once the person has a passkey or authenticator.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept:
                  type: boolean
                  enum: [true]
                  description: The warning was shown and accepted.
      responses:
        "204":
          description: Recorded; the session is signed in.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/web-phone:
    post:
      operationId: issueMyWebPhone
      summary: Get this browser's phone line
      description: >-
        For a signed-in browser session only (docs/WEB.md §5). Creates the
        session's web device for the caller's extension the first time, and
        gives it a new password every time after (the page keeps it in
        memory only, so a reloaded page has lost it). The password is shown
        this once. The line works only through this server's `/sip` relay
        and only while this session lasts: signing out, or anything else that
        ends the session, ends the line at once. Also returns relay (TURN)
        credentials, as GET /me/turn-credentials does. 409 `no_extension` if
        the caller has no extension, `extension_unavailable` if it's off or
        deleted.
      tags: [people]
      responses:
        "200":
          description: The phone line, with its password shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPhone"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/turn-credentials:
    get:
      operationId: getMyTurnCredentials
      summary: Fresh relay (TURN) credentials
      description: >-
        For a signed-in person (docs/WEB.md §5). Valid for an hour; ask for
        new ones before `expires_at`. Use them as an RTCIceServer: `urls`,
        `username`, `credential`.
      tags: [people]
      responses:
        "200":
          description: Relay credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnCredentials"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/presence:
    put:
      operationId: setMyPresence
      summary: Set my status
      description: >-
        Available, Away or Do not disturb (the account menu's "Set status").
        Do not disturb also stops the person's extension ringing: callers
        hear "not available". Queues `presence.changed` when it changes.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presence]
              properties:
                presence:
                  $ref: "#/components/schemas/Presence"
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/team:
    get:
      operationId: listTeam
      summary: The Team list
      description: >-
        Every extension with the name of the person on it and what they're
        doing now (docs/ui/WEB_SCREENS_PHASE1C.md §6), sorted by name. For
        live updates open the websocket at `/api/v1/team/live` instead.
      tags: [team]
      security:
        - bearer: [team:read]
      responses:
        "200":
          description: The Team list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/team/live:
    get:
      operationId: watchTeam
      summary: The Team list, live (websocket)
      description: >-
        A websocket (subprotocol `linx.team.v1`) that sends the whole Team
        list as a TeamList JSON message at once and again whenever it
        changes. It never reads anything the client sends. Signed-in
        browser sessions only, from this server's own page (Origin must
        match); it closes when the session ends. API clients use GET /team.
        Served by a hand-written handler (excluded from code generation).
      tags: [team]
      security:
        - bearer: [team:read]
      responses:
        "101":
          description: Switching to the websocket.
        default:
          $ref: "#/components/responses/Problem"

  /oauth/token:
    post:
      operationId: oauthToken
      summary: Get an access token (OAuth 2.0 client credentials)
      description: >-
        RFC 6749 §4.4. Authenticate the client with HTTP Basic or with
        client_id and client_secret in the form, not both. Returns a JWT
        (EdDSA) valid for 15 minutes; there are no refresh tokens. Errors use
        the OAuth format (RFC 6749 §5.2), not problem+json. Served by a
        hand-written handler (excluded from code generation).
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An access token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: A malformed request, unknown grant type or scope not held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: The client couldn't be authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: Too many failed attempts or requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

webhooks:
  webhook.test:
    post:
      summary: A test message (POST /webhooks/{id}/test)
      description: >-
        `data` is `{"webhook_id": "<uuid>", "message": "..."}`. Other events
        are added here with the features that send them.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received. 410 Gone turns the endpoint off; anything else is retried.

  alert.fired:
    post:
      summary: An admin alert opened (docs/API.md §5)
      description: >-
        Sent once an alert has been open for 5 minutes (a flapping problem
        that clears sooner never fires this). `data` is
        `{"alert_id", "key", "severity", "title", "message", "link"}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received.

  alert.resolved:
    post:
      summary: An admin alert cleared (docs/API.md §5)
      description: Sent once for an alert that was fired. Same `data` shape as alert.fired.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received.

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        An API key (`linx_<id>_<secret>`) or an access token from
        /oauth/token. Operations list the scopes they need (docs/API.md §3).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceName:
      name: service
      in: path
      required: true
      description: A Linx service, as System → Status lists them (e.g. `asterisk`).
      schema:
        type: string
        maxLength: 32
    Limit:
      name: limit
      in: query
      description: Maximum items per page (docs/API.md §2).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous page's `next_cursor`.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: The resource's `etag`; the change is refused with 412 if it no longer matches.
      schema:
        type: string

  headers:
    ETag:
      description: The resource's version, for If-Match.
      schema:
        type: string

  responses:
    Problem:
      description: An error (docs/API.md §2).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    OpenApiDocument:
      description: The full OpenAPI document served by this API. Free-form JSON.
      type: object
      additionalProperties: true

    Principal:
      description: The authenticated caller (docs/API.md §3).
      type: object
      required: [id, type, scopes]
      properties:
        id:
          type: string
          description: The user, API key or OAuth client id.
        type:
          type: string
          enum: [user, api_key, oauth_client, system]
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          description: The role ceiling; scopes never exceed it.
        scopes:
          type: array
          items:
            type: string
          description: e.g. `extensions:write`, `webhooks:write`.
        pending:
          type: boolean
          description: >-
            True for a signed-in person's session still waiting on its
            authenticator code or first-run MFA enrollment (docs/WEB.md §4):
            scopes is empty until then.
        email:
          type: string
          description: A signed-in person's own email (type user only).
        name:
          type: string
          description: A signed-in person's own name (type user only).
        extension_id:
          type: string
          format: uuid
          description: The extension a signed-in person answers on the web client, if they have one.
        mfa_enabled:
          type: boolean
          description: Whether a signed-in person has turned on an authenticator app.
        passkeys:
          type: integer
          description: How many passkeys a signed-in person has.
        has_password:
          type: boolean
          description: False for a person who set up their account with a passkey only.
        password_only:
          type: boolean
          description: >-
            A signed-in person with no passkey and no authenticator app:
            for an admin, the "not recommended" reminder (docs/ADMIN.md §5).
        recovery_codes_left:
          type: integer
        extension:
          type: string
          description: The number of that extension, e.g. "101".
        presence:
          $ref: "#/components/schemas/Presence"
        company_sign_in:
          type: array
          items:
            type: string
          description: The company sign-in providers a signed-in person has linked an account on (their names).
        admin_network_restricted:
          type: boolean
          description: >-
            True when this session's admin/system_admin scopes were dropped
            to an ordinary person's because it signed in from outside the
            allowed networks (docs/ADMIN.md §3): the admin area explains why
            it's missing rather than just hiding.

    EventType:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: e.g. `call.missed`.
        description:
          type: string

    EventTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
        next_cursor:
          type: string
          description: Pass as `?cursor=` to fetch the next page; absent on the last page.

    Role:
      type: string
      enum: [system_admin, admin, user, reporter]

    CredentialCreate:
      description: A new API key or OAuth client.
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What it's for, e.g. "CRM sync".
        role:
          $ref: "#/components/schemas/Role"
          description: Defaults to the caller's role; can't be above it.
        scopes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
          description: >-
            Scopes to grant, each held by the caller. `all` means every
            non-sensitive scope the role and caller have; sensitive scopes
            (api_keys:write, oauth_clients:write, recordings:read,
            transcripts:read, calls:control, devices:write) must be named.
        expires_at:
          type: string
          format: date-time
          description: Defaults to one year from now; at most two years.
        allowed_ips:
          type: array
          maxItems: 20
          items:
            type: string
          description: Addresses or CIDR ranges it may be used from. Empty allows any.

    ApiKey:
      type: object
      required: [id, name, prefix, role, scopes, allowed_ips, created_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The key's public start, `linx_<id>`, to recognise it.
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        revoked_at:
          type: string
          format: date-time

    ApiKeyCreated:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: The full key. Shown once; store it somewhere safe.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: string

    OAuthClient:
      type: object
      required: [id, client_id, name, role, scopes, allowed_ips, created_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          description: Sent to /oauth/token.
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        revoked_at:
          type: string
          format: date-time

    OAuthClientCreated:
      type: object
      required: [oauth_client, client_secret]
      properties:
        oauth_client:
          $ref: "#/components/schemas/OAuthClient"
        client_secret:
          type: string
          description: Shown once; store it somewhere safe.

    OAuthClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
        next_cursor:
          type: string

    Webhook:
      description: A webhook endpoint (docs/API.md §4).
      type: object
      required: [id, url, description, event_types, enabled, created_by, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
        event_types:
          type: array
          items:
            type: string
          description: Events sent to it; empty means every event.
        enabled:
          type: boolean
        disabled_reason:
          type: string
          enum: [gone, failing, admin]
          description: >-
            Why it's off: `gone` (the receiver answered 410), `failing`
            (every delivery failed for 5 days) or `admin` (turned off).
        disabled_at:
          type: string
          format: date-time
        failing_since:
          type: string
          format: date-time
          description: When the current run of failed deliveries started; absent while healthy.
        last_success_at:
          type: string
          format: date-time
        previous_secret_expires_at:
          type: string
          format: date-time
          description: After a rotation, when the old secret stops signing.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: An https:// URL, without a user name or password in it.
        description:
          type: string
          maxLength: 200
        event_types:
          type: array
          maxItems: 50
          items:
            type: string
          description: Event types to send (GET /event-types). Empty or absent means every event.
        enabled:
          type: boolean
          description: Defaults to true.

    WebhookPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 200
        event_types:
          type: array
          maxItems: 50
          items:
            type: string
        enabled:
          type: boolean

    WebhookWithSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: >-
            The signing secret (`whsec_...`) for your Standard Webhooks
            library. Shown once; store it somewhere safe.

    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        next_cursor:
          type: string

    DeliveryStatus:
      type: string
      enum: [pending, succeeded, failed, cancelled]

    WebhookDelivery:
      description: One event on its way to one endpoint.
      type: object
      required: [id, webhook_id, event_id, event_type, status, attempts, max_attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The `webhook-id` header receivers de-duplicate on.
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
          description: When a pending delivery is tried next.
        replay_of:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        log:
          type: array
          description: Each attempt, oldest first (only on GET /webhook-deliveries/{id} and /test).
          items:
            $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryAttempt:
      type: object
      required: [at, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        status_code:
          type: integer
          description: The receiver's HTTP status; absent if there was no answer.
        duration_ms:
          type: integer
        response_excerpt:
          type: string
          description: The first 4 KB of the receiver's answer.
        error:
          type: string
          description: Why the attempt failed, in plain language.

    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string

    WebhookReplay:
      type: object
      additionalProperties: false
      required: [since]
      properties:
        since:
          type: string
          format: date-time

    WebhookReplayResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer

    AllowlistEntry:
      type: object
      required: [id, value, kind, description, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
          description: The CIDR range or host name.
        kind:
          type: string
          enum: [cidr, host]
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    AllowlistEntryCreate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 253
        description:
          type: string
          maxLength: 200

    AllowlistEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllowlistEntry"

    WebhookMessage:
      description: >-
        The body of every webhook (Standard Webhooks). Headers:
        `webhook-id` (the event id; the same on retries and replays, so
        de-duplicate on it), `webhook-timestamp` (Unix seconds of this
        attempt) and `webhook-signature` (`v1,<base64 HMAC-SHA256>` of
        `id.timestamp.body`, one per active secret, space-separated).
        Order isn't guaranteed.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          type: string
          description: The event type, e.g. `call.missed`.
        timestamp:
          type: string
          format: date-time
          description: When the event happened.
        data:
          type: object
          description: Event-specific; documented per event.

    AlertChannelKind:
      type: string
      enum: [ntfy, gotify, slack, teams, telegram, webhook]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    QuietHours:
      description: >-
        A do-not-disturb window in the channel's own local time
        (docs/API.md §5). `start` may be after `end`: the window then
        wraps past midnight (e.g. 22:00-07:00).
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time quiet hours begin, e.g. "22:00". Required when enabled.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time quiet hours end, e.g. "07:00". Required when enabled.
        timezone:
          type: string
          description: IANA time zone name, e.g. "Europe/Istanbul". Required when enabled.
        bypass_critical:
          type: boolean
          description: Send critical alerts even during quiet hours. Defaults to true.

    AlertChannelConfig:
      description: >-
        Fields for this channel's kind (docs/API.md §5); a field another
        kind uses is refused. Never returned once saved — use Test to
        check it still works.
      type: object
      additionalProperties: false
      properties:
        server_url:
          type: string
          maxLength: 2048
          description: ntfy or Gotify server. Defaults to https://ntfy.sh for ntfy; required for Gotify.
        topic:
          type: string
          maxLength: 64
          description: ntfy topic name.
        access_token:
          type: string
          maxLength: 512
          description: ntfy access token, if the topic needs one.
        app_token:
          type: string
          maxLength: 512
          description: Gotify application token.
        url:
          type: string
          maxLength: 2048
          description: The incoming webhook URL (Slack, Teams) or the receiving URL (generic webhook).
        bot_token:
          type: string
          maxLength: 512
          description: Telegram bot token (from @BotFather).
        chat_id:
          type: string
          maxLength: 64
          description: Telegram chat id to send to.

    AlertChannel:
      description: A place Linx sends admin alerts (docs/API.md §5).
      type: object
      required: [id, kind, name, min_severity, enabled, created_by, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AlertChannelKind"
        name:
          type: string
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
          description: Alerts below this severity aren't sent here.
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    AlertChannelCreate:
      type: object
      additionalProperties: false
      required: [kind, name, config]
      properties:
        kind:
          $ref: "#/components/schemas/AlertChannelKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: "#/components/schemas/AlertChannelConfig"
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
          description: Defaults to "info".
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean
          description: Defaults to true.

    AlertChannelPatch:
      description: >-
        JSON Merge Patch; fields not sent stay as they are. `config` and
        `quiet_hours`, when sent, replace as a whole.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: "#/components/schemas/AlertChannelConfig"
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean

    AlertChannelCreated:
      type: object
      required: [alert_channel]
      properties:
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        secret:
          type: string
          description: >-
            Only for a `webhook` channel: the signing secret (`whsec_...`),
            generated by Linx. Shown once; store it somewhere safe.

    AlertChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertChannel"
        next_cursor:
          type: string

    AlertChannelTestResult:
      type: object
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
        status_code:
          type: integer
        duration_ms:
          type: integer
        error:
          type: string
          description: Plain-language reason it failed; absent when succeeded is true.

    AlertStatus:
      type: string
      enum: [open, resolved]

    Alert:
      type: object
      required: [id, key, severity, title, message, status, first_seen_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: De-duplicates this problem, e.g. `trunk.down:<trunk-id>`.
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        title:
          type: string
        message:
          type: string
        link:
          type: string
          description: Link to the relevant admin page.
        status:
          $ref: "#/components/schemas/AlertStatus"
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          type: string

    Extension:
      description: An extension (docs/PBX.md §3), e.g. "101".
      type: object
      required: [id, number, display_name, enabled, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: 2 to 6 digits, unique. Refused (422 number_reserved) if it starts like an outside number in the country Linx is set up in (0 in the UAE) or is an emergency or short service number there (999, 112, 901, ...).
        display_name:
          type: string
        email:
          type: string
        call_permission_level_id:
          type: string
          format: uuid
          description: Who this extension may call out to (docs/TRUNKS.md §5). Absent means it may only call emergency numbers.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    ExtensionCreate:
      type: object
      additionalProperties: false
      required: [number, display_name]
      properties:
        number:
          type: string
          maxLength: 20
          description: 2 to 6 digits; same rules as when creating.
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
        call_permission_level_id:
          type: string
          format: uuid
          description: Needs the routing:write scope as well (a level decides which numbers cost money to call); 403 scope_missing otherwise.
        enabled:
          type: boolean
          description: Defaults to true.

    ExtensionPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        number:
          type: string
          maxLength: 20
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
        call_permission_level_id:
          type: string
          description: Empty string clears it (only emergency numbers stay allowed). Changing it needs the routing:write scope as well; 403 scope_missing otherwise.
        enabled:
          type: boolean

    ExtensionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Extension"
        next_cursor:
          type: string

    DeviceKind:
      type: string
      enum: [softphone, web, ios, desk]
      description: Only `softphone` works in this slice (ADR-035); the others arrive with the web client and the iOS app.

    CallParty:
      description: >-
        One end of a call: one of Linx's devices (extension, device_id and
        its name), or someone outside (number, and name if their provider
        sent one).
      type: object
      required: [name]
      properties:
        extension:
          type: string
          description: The device's extension number.
        device_id:
          type: string
          format: uuid
        name:
          type: string
          description: The device's name, or the outside caller's name as their provider sent it (letters, digits, spaces and dots only; may be empty).
        number:
          type: string
          description: An outside party's number, in E.164 (+971...) when Linx can read it.

    ActiveCall:
      type: object
      required: [id, direction, from, to, state, started_at]
      properties:
        id:
          type: string
          format: uuid
          description: The same id the call's webhook events carry.
        direction:
          type: string
          enum: [internal, inbound, outbound]
          description: >-
            `internal`: between Linx's own extensions (or to Linx itself,
            like the echo test). `inbound`: from outside, through a trunk.
            `outbound`: to an outside number.
        trunk_id:
          type: string
          format: uuid
          description: The trunk an inbound call came in on, or the line an outbound call went out on (the last one tried).
        from:
          $ref: "#/components/schemas/CallParty"
        to:
          type: string
          description: The number dialled (for an inbound call, the phone number the caller dialled).
        ringing:
          type: string
          description: The extension this call rings, once Linx knows it.
        state:
          type: string
          enum: [ringing, answered, system]
          description: >-
            `ringing`: devices are ringing (or about to). `answered`: a
            device answered. `system`: Linx itself answered, for the echo
            test or a spoken message ("not available", "not in use").
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
        answered_by:
          $ref: "#/components/schemas/CallParty"

    ActiveCallList:
      type: object
      required: [items, phone_engine_connected]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveCall"
        phone_engine_connected:
          type: boolean

    Device:
      description: A phone or app that rings for an extension (docs/PBX.md §3).
      type: object
      required: [id, extension_id, name, kind, sip_username, enabled, online, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        extension_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/DeviceKind"
        sip_username:
          type: string
          description: The SIP login's public part (Asterisk's endpoint id); random, so it never reveals the extension.
        enabled:
          type: boolean
        revoked_at:
          type: string
          format: date-time
          description: When the device was revoked (it stays off for good). Absent if it wasn't.
        online:
          type: boolean
          description: Signed in right now (as the phone engine last reported; always false for a turned-off device).
        last_registered_at:
          type: string
          format: date-time
        last_registered_from:
          type: string
          description: The address it last registered from.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    DeviceCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Mohammed's iPhone".
        kind:
          $ref: "#/components/schemas/DeviceKind"
          description: Defaults to `softphone`.
        enabled:
          type: boolean
          description: Defaults to true.

    DevicePatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        next_cursor:
          type: string

    DeviceCredentials:
      description: A device with its SIP login, shown once (ADR-033).
      type: object
      required: [device, password, server, port, transport, settings_text]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        password:
          type: string
          description: Shown once; Linx stores only its digest hash. Store it somewhere safe.
        server:
          type: string
          description: e.g. "sip.example.com".
        port:
          type: integer
          description: "5061."
        transport:
          type: string
          const: tls
        settings_text:
          type: string
          description: A plain-language summary of the above, ready to paste into a phone app.

    TrunkKind:
      type: string
      enum: [registration, ip_authenticated, lan_peer]
      description: >-
        `registration`: Linx signs in to the provider. `ip_authenticated`:
        the provider calls in from its own fixed addresses. `lan_peer`:
        another phone system on the LAN (docs/TRUNKS.md §3).

    TrunkTransport:
      type: string
      enum: [tls, tcp, udp]
      description: tcp and udp need confirm_unencrypted (ADR-023).

    TrunkMediaEncryption:
      type: string
      enum: [srtp, none]
      description: none needs confirm_unencrypted (ADR-023).

    TrunkCertTrust:
      type: string
      enum: [public, pinned]
      description: pinned is a certificate or CA the admin compared and approved (ADR-045).

    TrunkDialFormat:
      type: string
      enum: [e164, "00_prefix", local]
      description: How outgoing numbers are written for this trunk.

    TrunkCodec:
      type: string
      enum: [ulaw, alaw, g722, opus]

    NumberCategory:
      type: string
      enum: [landline, mobile, national, shared_cost, toll_free, premium, international, service]
      description: A numbering.Category a call permission level can name. Emergency numbers are always allowed and never listed here.

    Trunk:
      description: A phone line to a provider or another phone system (docs/TRUNKS.md §3). Its password is write-only and never returned.
      type: object
      required: [id, name, kind, host, port, transport, media_encryption, cert_trust, dial_format, codecs, max_calls, unencrypted, enabled, status, status_detail, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [registered, reachable, rejected, unreachable, unknown, disabled]
          description: >-
            Whether it works, as Asterisk last reported it (checked every
            few seconds; each change fires trunk.status_changed).
            `registered`: Linx is signed in to the provider. `reachable`:
            it answers Linx's keep-alive checks. `rejected`: it answers but
            refuses Linx's login. `unreachable`: no answer. `unknown`: not
            checked yet. `disabled`: turned off.
        status_detail:
          type: string
          description: The status in plain words.
        status_since:
          type: string
          format: date-time
          description: When it last changed.
        kind:
          $ref: "#/components/schemas/TrunkKind"
        template:
          type: string
          description: Which entry of the provider template catalogue this was created from, if any.
        host:
          type: string
        port:
          type: integer
        transport:
          $ref: "#/components/schemas/TrunkTransport"
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
        pinned_certificate:
          type: string
          description: Present only when cert_trust is pinned.
        username:
          type: string
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
        caller_id_number:
          type: string
        max_calls:
          type: integer
        wireguard_profile_id:
          type: string
          format: uuid
          description: >-
            The WireGuard profile this trunk connects through. Absent means "Internet" (ADR-024). Through a tunnel,
            `host` must be an IPv4 address (422 `host_must_be_address`): the tunnel carries only addresses known in advance.
        outbound_priority:
          type: integer
          description: 1 = tried first for outgoing calls. Absent means this trunk isn't used for outgoing calls. Set with PUT /outbound-routing.
        unencrypted:
          type: boolean
          description: Calls on this trunk travel without TLS or without SRTP media (ADR-023), and it isn't reached through a WireGuard profile.
        unencrypted_confirmed_by:
          type: string
          description: Who confirmed the ADR-023 warning. Present only while unencrypted is true.
        unencrypted_confirmed_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    TrunkCreate:
      type: object
      additionalProperties: false
      required: [name, kind, host]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          $ref: "#/components/schemas/TrunkKind"
        template:
          type: string
          maxLength: 50
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          description: Defaults to 5061.
        transport:
          $ref: "#/components/schemas/TrunkTransport"
          description: Defaults to tls.
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
          description: Defaults to srtp.
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
          description: Defaults to public.
        pinned_certificate:
          type: string
          description: Required when cert_trust is pinned.
        username:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 200
          description: Write-only; never returned.
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
          description: Defaults to e164.
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
          description: Defaults to [alaw, ulaw].
        caller_id_number:
          type: string
          maxLength: 32
        max_calls:
          type: integer
          description: Defaults to 4.
        wireguard_profile_id:
          type: string
          format: uuid
        confirm_unencrypted:
          type: boolean
          description: >-
            Must be true if the trunk as given is unencrypted and isn't
            reached through a WireGuard profile (ADR-023); refused with 422
            unencrypted_confirmation_required otherwise.
        enabled:
          type: boolean
          description: Defaults to true.

    TrunkPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 255
        port:
          type: integer
        transport:
          $ref: "#/components/schemas/TrunkTransport"
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
        pinned_certificate:
          type: string
        username:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 200
          description: Write-only; never returned. Empty string removes it.
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
        caller_id_number:
          type: string
          maxLength: 32
        max_calls:
          type: integer
        wireguard_profile_id:
          type: string
          description: Empty string moves the trunk to "Internet".
        confirm_unencrypted:
          type: boolean
          description: >-
            Must be true when the change leaves the trunk unencrypted and it
            wasn't confirmed before, or when an unencrypted trunk gets
            another host, transport or media encryption (the earlier
            confirmation no longer covers it); 422
            unencrypted_confirmation_required otherwise.
        enabled:
          type: boolean

    TrunkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trunk"
        next_cursor:
          type: string

    Did:
      description: A phone number a trunk owns (docs/TRUNKS.md §5).
      type: object
      required: [id, trunk_id, number, label, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        trunk_id:
          type: string
          format: uuid
        number:
          type: string
          description: Digits, optionally starting with +.
        label:
          type: string
        extension_id:
          type: string
          format: uuid
          description: Absent means calls to this number hear "not in use".
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    DidCreate:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: string
          maxLength: 20
        label:
          type: string
          maxLength: 100
        extension_id:
          type: string
          format: uuid

    DidPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 100
        extension_id:
          type: string
          description: Empty string clears the route.

    DidList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Did"
        next_cursor:
          type: string

    InboundRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Did"
        next_cursor:
          type: string

    OutboundRouting:
      description: The order outgoing calls try trunks in (docs/TRUNKS.md §5).
      type: object
      required: [country, trunks, international_alert]
      properties:
        country:
          type: string
          description: The ISO 3166 country code Linx is set up in.
        international_alert:
          $ref: "#/components/schemas/InternationalAlert"
        trunks:
          type: array
          items:
            $ref: "#/components/schemas/Trunk"
          description: Every trunk used for outgoing calls, in the order they're tried.

    TrunkTest:
      type: object
      required: [ok, steps]
      properties:
        ok:
          type: boolean
          description: No step failed (warnings allowed).
        steps:
          type: array
          items:
            type: object
            required: [name, result, words]
            properties:
              name:
                type: string
                enum: [tunnel, address, connection, certificate, sip, login, audio_encryption, tls_offered]
              result:
                type: string
                enum: [ok, warning, failed, skipped]
              words:
                type: string
                description: What was found, in plain words.
        certificates:
          type: array
          description: The certificates it presented, its own first (TLS only).
          items:
            type: object
            required: [subject, issuer, names, not_after, sha256, self_signed, pem]
            properties:
              subject:
                type: string
              issuer:
                type: string
              names:
                type: array
                items:
                  type: string
              not_after:
                type: string
                format: date-time
              sha256:
                type: string
                description: The fingerprint, as providers print it (AB:CD:...).
              self_signed:
                type: boolean
              pem:
                type: string
        untrusted:
          type: boolean
          description: The certificate failed only because nothing Linx trusts signed it; pinning the last of `certificates` would let it pass, if the admin recognises its fingerprint.

    RouteTestRequest:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        direction:
          type: string
          enum: [outbound, inbound]
          default: outbound
          description: >-
            outbound tests a call from one of your extensions; inbound
            tests a call to one of your phone numbers (docs/ADMIN.md §9).
        number:
          type: string
          maxLength: 40
          description: >-
            Outbound: dialled the way you'd dial it on a mobile ("050 123
            4567", "+44 20 7946 0958"). Inbound: one of your phone numbers.
        from:
          type: string
          description: Outbound only. The calling extension's number. Without it, only what kind of number it is.

    RouteTest:
      type: object
      required: [category, kind, words]
      properties:
        category:
          type: string
          enum: [emergency, service, landline, mobile, national, shared_cost, toll_free, premium, international, invalid]
        kind:
          type: string
          description: What the number is, in plain words.
        e164:
          type: string
        region:
          type: string
          description: The number's country (ISO 3166; "001" for international services).
        allowed:
          type: boolean
          description: With `from`, whether the call would go out (or, for emergency numbers, is always let through).
        reason:
          type: string
          enum: [emergency, invalid, unknown_caller, not_permitted, no_lines, allowed, routed, not_assigned, unknown_number]
        lines:
          type: array
          description: With `from`, the lines it would go out on, in the order they're tried.
          items:
            type: object
            required: [trunk, number]
            properties:
              trunk:
                type: string
              number:
                type: string
                description: The number as that line is sent it.
              caller_id:
                type: string
                description: What the called person sees; absent means the provider's default.
        extension:
          description: Inbound only, when the number routes to an extension.
          type: object
          required: [number, display_name]
          properties:
            number:
              type: string
            display_name:
              type: string
        words:
          type: string
          description: The whole decision in plain words, as `linx route test` prints it.

    InternationalAlert:
      type: object
      additionalProperties: false
      required: [minutes, calls]
      description: The "unusual calling abroad" alert fires when an hour has more than this many minutes, or calls, to numbers abroad (docs/TRUNKS.md §9).
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 10000
        calls:
          type: integer
          minimum: 1
          maximum: 10000

    OutboundRoutingUpdate:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          type: array
          items:
            type: string
            format: uuid
          description: Every trunk id to use for outgoing calls, primary first. Trunks left out stop being used for outgoing calls.
        international_alert:
          $ref: "#/components/schemas/InternationalAlert"

    WireguardProfile:
      description: A WireGuard tunnel trunks can be reached through (docs/TRUNKS.md §7). Its keys are write-only and never returned.
      type: object
      required: [id, name, address, public_key, peer_public_key, peer_endpoint_host, peer_endpoint_port, status, status_detail, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          description: This end's own tunnel address, e.g. "10.6.0.2/32" (it must include an IPv4 address).
        public_key:
          type: string
          description: Derived from the private key; give this to the provider if it needs it registered.
        peer_public_key:
          type: string
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
        persistent_keepalive:
          type: integer
          description: Seconds between keep-alives. Absent means Linx's default (25), so the tunnel's state is always known.
        status:
          type: string
          enum: [up, connecting, down, unknown]
          description: >-
            The tunnel's state as Linx's WireGuard service last reported it: `down` after 3 minutes with no handshake
            (its phone lines are then down too, and the "WireGuard tunnel is down" alert goes out while a line uses it).
        status_detail:
          type: string
          description: Why, in plain words.
        status_since:
          type: string
          format: date-time
        last_handshake_at:
          type: string
          format: date-time
        notes:
          type: array
          items:
            type: string
          description: Said once, when the profile is created (e.g. an imported AllowedIPs narrowed to the phone lines' addresses).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    WireguardProfileCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        config:
          type: string
          description: A whole wg-quick configuration file ([Interface] and [Peer]); takes priority over the fields below.
        private_key:
          type: string
          description: Base64, 32 bytes. Write-only; never returned.
        address:
          type: string
        peer_public_key:
          type: string
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
          description: Defaults to 51820.
        preshared_key:
          type: string
          description: Base64, 32 bytes. Write-only; never returned.
        persistent_keepalive:
          type: integer

    WireguardProfilePatch:
      description: JSON Merge Patch of the profile's non-secret fields; reissue it (delete and re-create) to change its keys.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
        persistent_keepalive:
          type: integer

    WireguardProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WireguardProfile"
        next_cursor:
          type: string

    CallPermissionLevel:
      description: Who a group of extensions may call out to (docs/TRUNKS.md §5).
      type: object
      required: [id, name, allowed_categories, withhold_caller_id, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean
          description: Send "withheld" instead of a caller ID, if the trunk's provider supports it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    CallPermissionLevelCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean
          description: Defaults to false.

    CallPermissionLevelPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean

    CallPermissionLevelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CallPermissionLevel"
        next_cursor:
          type: string

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        scope:
          type: string
          description: Space-separated scopes to narrow the token to; defaults to all the client holds.
        client_id:
          type: string
        client_secret:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds (900).
        scope:
          type: string

    OAuthError:
      description: RFC 6749 §5.2.
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_scope, unsupported_grant_type, server_error, temporarily_unavailable]
        error_description:
          type: string

    Problem:
      description: RFC 9457 `application/problem+json` (docs/API.md §2).
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          description: A URI identifying the problem type; `about:blank` when none is registered.
        title:
          type: string
          description: Short, human-readable summary of the status code.
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code, e.g. `scope_missing`.
        detail:
          type: string
          description: Plain-language explanation. Never a stack trace.
        instance:
          type: string

    SignIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    SessionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_verify_required, mfa_setup_required]
          description: >-
            `mfa_verify_required`: finish with one of `methods` (POST
            /session/mfa with an authenticator or recovery code, or
            /session/mfa/passkey). `mfa_setup_required`: an admin must add a
            passkey (/me/passkeys) or an authenticator app (/me/mfa), or
            choose a password only (/me/password-only), before doing anything
            else.
        methods:
          type: array
          items:
            type: string
            enum: [authenticator, passkey, recovery_code]
          description: What can finish a `mfa_verify_required` sign-in.
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once, when a passkey set up through a setup link is the account's first second step.

    SetupLinkInfo:
      type: object
      required: [email, name, role, has_second_step, passkeys_available]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        has_second_step:
          type: boolean
          description: >-
            The account already has a passkey or authenticator app: the
            link only sets a new password, and the second step is still
            asked for.
        passkeys_available:
          type: boolean
          description: False when the server has no domain set (passkeys need one).

    PasskeyAnswer:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON().

    PasskeyNew:
      type: object
      additionalProperties: false
      required: [name, credential]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: e.g. "Mohammed's iPhone".
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON().

    Passkey:
      type: object
      required: [id, name, synced, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        synced:
          type: boolean
          description: Backed up to the device maker's cloud (e.g. iCloud Keychain) when last used.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    CompanyButton:
      description: A company sign-in provider a person can use.
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
          description: Shown as "Continue with <name>".

    SignInOptions:
      type: object
      required: [company, company_sign_in_required, passkeys_available]
      properties:
        company:
          type: array
          items:
            $ref: "#/components/schemas/CompanyButton"
          description: The company sign-in buttons, in order.
        company_sign_in_required:
          type: boolean
          description: Passwords are off for everyone but system admins.
        passkeys_available:
          type: boolean

    CompanyStart:
      type: object
      additionalProperties: false
      required: [provider_id]
      properties:
        provider_id:
          type: string
          format: uuid

    CompanyRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The provider's sign-in page. Send the browser there (a full navigation).

    CompanyLink:
      description: A person's company account.
      type: object
      required: [id, provider_id, provider_name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        email:
          type: string
          description: The email the provider vouched for when it was linked.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    CompanyLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyLink"

    MyCompanyAccounts:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyLink"
        available:
          type: array
          items:
            $ref: "#/components/schemas/CompanyButton"
          description: The enabled providers an account can be linked on.

    SsoProviderKind:
      type: string
      enum: [google, microsoft, authentik, keycloak, oidc]
      description: >-
        The template it was made from. Decides how a verified email is read
        (Microsoft: `xms_edov` with `email`, or `upn`; everyone else:
        `email_verified`).

    SsoProvider:
      type: object
      required: [id, kind, name, issuer, client_id, client_secret_set, enabled, shown, position, redirect_uri, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        client_secret_set:
          type: boolean
          description: The secret itself is never shown again.
        enabled:
          type: boolean
          description: Usable at all (sign in, link, confirm).
        shown:
          type: boolean
          description: Its button is on the sign-in page.
        position:
          type: integer
          description: Buttons are shown lowest first.
        redirect_uri:
          type: string
          description: The address to register at the provider.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string

    SsoProviderList:
      type: object
      required: [items, redirect_uri]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SsoProvider"
        redirect_uri:
          type: string
          description: The address to register at every provider ("" when company sign-in is off).

    SsoProviderNew:
      type: object
      additionalProperties: false
      required: [kind, client_id]
      properties:
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
          maxLength: 60
          description: Defaults to the kind's name; required for `oidc`.
        issuer:
          type: string
          description: >-
            e.g. https://login.microsoftonline.com/<tenant ID>/v2.0. Google's
            is filled in. Linx reads its discovery document before saving.
        client_id:
          type: string
        client_secret:
          type: string
        enabled:
          type: boolean
        shown:
          type: boolean
        position:
          type: integer

    SsoProviderPatch:
      description: JSON Merge Patch; fields not sent stay as they are. An empty client_secret removes it.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        enabled:
          type: boolean
        shown:
          type: boolean
        position:
          type: integer

    PasskeyAdded:
      type: object
      required: [passkey]
      properties:
        passkey:
          $ref: "#/components/schemas/Passkey"
        recovery_codes:
          type: array
          items:
            type: string

    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A 6-digit authenticator code, or a recovery code.

    NumberingRange:
      type: object
      additionalProperties: false
      required: [kind, from, to]
      properties:
        kind:
          type: string
          enum: [people, groups, reserved]
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0

    Settings:
      type: object
      required: [country, extension_digits, extension_ranges, site_kind, simple_mode, admin_network_restricted, admin_networks, setup_step]
      properties:
        country:
          type: string
          description: ISO 3166 code (docs/TRUNKS.md §5).
        extension_digits:
          type: integer
          minimum: 2
          maximum: 6
        extension_ranges:
          type: array
          items:
            $ref: "#/components/schemas/NumberingRange"
        site_kind:
          type: string
          enum: ["", home, business]
        simple_mode:
          type: boolean
        admin_network_restricted:
          type: boolean
          description: >-
            "Only from my home/office network" (docs/ADMIN.md §3); false
            (the default) is "anywhere, with a second step".
        admin_networks:
          type: array
          items:
            type: string
          description: Addresses or networks admins may sign in from when admin_network_restricted is true.
        default_call_permission_level_id:
          type: string
          format: uuid
          description: >-
            The "Everyone" level new extensions get by default, once the
            setup wizard (or an admin) has set one.
        setup_step:
          type: integer
        setup_completed_at:
          type: string
          format: date-time
        company_sign_in_required:
          type: boolean
          description: >-
            "People must use company sign-in" (docs/ADMIN.md §6): passwords
            stop working for everyone except system admins. Passkeys keep
            working.

    SettingsPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        extension_digits:
          type: integer
          minimum: 2
          maximum: 6
        extension_ranges:
          type: array
          items:
            $ref: "#/components/schemas/NumberingRange"
        site_kind:
          type: string
          enum: ["", home, business]
        simple_mode:
          type: boolean
        admin_network_restricted:
          type: boolean
        admin_networks:
          type: array
          items:
            type: string
        company_sign_in_required:
          type: boolean
          description: Also needs sso:write, and a fresh "confirm it's you".

    SetupProgress:
      type: object
      required: [step, completed]
      properties:
        step:
          type: integer
        completed:
          type: boolean
        completed_at:
          type: string
          format: date-time

    AuditLogEntry:
      type: object
      required: [id, at, actor, action, result]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: string
        ip:
          type: string
        action:
          type: string
        target:
          type: string
        result:
          type: string
          enum: [ok, denied, failed]
        detail:
          type: object
          additionalProperties: true

    AuditLogEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        next_cursor:
          type: string

    BackupSettings:
      type: object
      required: [frequency, time_of_day, day_of_week, day_of_month]
      properties:
        frequency:
          type: string
          enum: [off, daily, weekly, monthly]
        time_of_day:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes since midnight, server-local time.
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 (Sunday) to 6 (Saturday); used only when frequency is weekly.
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
          description: Used only when frequency is monthly.
        requested_at:
          type: string
          format: date-time
          description: Set while a "back up now" request is waiting for linx-backup-agent's next tick.

    BackupSettingsPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        frequency:
          type: string
          enum: [off, daily, weekly, monthly]
        time_of_day:
          type: integer
          minimum: 0
          maximum: 1439
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28

    BackupRunDestination:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
        ok:
          type: boolean
        snapshot_id:
          type: string
        size:
          type: integer
          format: int64
          description: Bytes backed up (the database and the keys), before compression.
        error:
          type: string

    BackupRun:
      type: object
      required: [id, trigger, started_at, finished_at, status, destinations]
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [manual, scheduled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, partial, failure]
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/BackupRunDestination"
        error:
          type: string

    BackupRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupRun"
        next_cursor:
          type: string

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [source, location, password]
      properties:
        source:
          type: string
          enum: [folder, destination, upload]
          description: folder, a backup folder on the server; destination, one set up there with `linx backup destination add`; upload, a backup file sent with `PUT /backup-restore/file`.
        location:
          type: string
          maxLength: 4096
          description: The folder's full path (starting with /), the destination's name, or the upload_id.
        snapshot:
          type: string
          maxLength: 64
          description: '"latest" (the default) or a backup id.'
        password:
          type: string
          maxLength: 1024
          description: The backup's password (shown once when its destination was set up).

    RestoreStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, running, failed]
        source:
          type: string
          enum: [folder, destination, upload]
        location:
          type: string
        snapshot:
          type: string
        error:
          type: string
        requested_at:
          type: string
          format: date-time

    RestoreUpload:
      type: object
      required: [upload_id, size]
      properties:
        upload_id:
          type: string
        size:
          type: integer
          format: int64

    BackupDownload:
      type: object
      required: [status, mine]
      properties:
        status:
          type: string
          enum: [none, pending, preparing, ready, failed]
        mine:
          type: boolean
          description: Whether the caller asked for it (only they may fetch the file and its password).
        error:
          type: string
        size:
          type: integer
          format: int64
        snapshot_time:
          type: string
          format: date-time
          description: When the newest backup in the file was made.
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    BackupPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string

    SystemStatus:
      type: object
      required: [services, helper, containers, open_alerts, trunks, wireguard_profiles]
      properties:
        helper:
          type: object
          description: >-
            The server helper (linx-ops-agent): connected, and when it last
            checked the services. Not connected: `containers` is empty or
            old, and logs and Restart aren't available.
          required: [connected]
          properties:
            connected:
              type: boolean
            checked_at:
              type: string
              format: date-time
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
        certificate:
          type: object
          description: The certificate linx-certd last reported (absent before the first).
          required: [expires_at]
          properties:
            expires_at:
              type: string
              format: date-time
        services:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, down]
        open_alerts:
          type: array
          items:
            type: object
            required: [severity, title, message, since]
            properties:
              severity:
                type: string
                enum: [warning, critical]
              title:
                type: string
              message:
                type: string
              since:
                type: string
                format: date-time
        trunks:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string
              status_since:
                type: string
                format: date-time
        wireguard_profiles:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string

    ServiceHealth:
      type: object
      required: [service, label, state, restarts, can_restart, optional]
      properties:
        service:
          type: string
        label:
          type: string
          description: Its plain name ("Phone system").
        state:
          type: string
          enum: [running, starting, unhealthy, restarting, stopped, missing]
        started_at:
          type: string
          format: date-time
        restarts:
          type: integer
          description: How many times Docker has restarted it by itself since it was created.
        can_restart:
          type: boolean
        optional:
          type: boolean
          description: Only some installs run it; `missing` is then fine.

    ServiceLog:
      type: object
      required: [service, lines]
      properties:
        service:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [text]
            properties:
              time:
                type: string
                format: date-time
              text:
                type: string

    ServiceRestart:
      type: object
      required: [service, result]
      properties:
        service:
          type: string
        result:
          type: string
          enum: [restarted, restarting]

    User:
      type: object
      required: [id, email, name, role, mfa_enabled, disabled, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        extension_id:
          type: string
          format: uuid
        mfa_enabled:
          type: boolean
        passkeys:
          type: integer
        has_password:
          type: boolean
        password_only:
          type: boolean
          description: No passkey and no authenticator app ("Password only ⚠" for an admin).
        company_sign_in:
          type: array
          items:
            type: string
          description: The company sign-in providers they've linked an account on (their names).
        disabled:
          type: boolean
        locked:
          type: boolean
          description: Too many wrong passwords; waiting out the lockout (`linx user unlock`, or POST .../unlock).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: For If-Match.

    UserCreate:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
          description: Can't exceed the caller's own role.
        extension_id:
          type: string
          format: uuid

    UserPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        extension_id:
          type: string
          format: uuid
        disabled:
          type: boolean

    UserCreated:
      type: object
      required: [user, setup_link_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        setup_link_token:
          type: string
          description: Shown once; build the link as https://meet.<domain>/setup/<token>.

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string

    SetupLinkIssued:
      type: object
      required: [setup_link_token]
      properties:
        setup_link_token:
          type: string
          description: Shown once; build the link as https://meet.<domain>/setup/<token>.

    PasswordChange:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          type: string
          description: >-
            Required when the account has a password. A passkey-only account
            adding its first password leaves it out and needs "confirm it's
            you" instead.
        new_password:
          type: string
          description: At least 12 characters.

    MfaEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32, for typing in by hand if the QR code can't be scanned.
        otpauth_url:
          type: string
          description: otpauth://totp/... — encode this as a QR code.

    WebPhone:
      description: A browser session's phone line (docs/WEB.md §5).
      type: object
      required: [device_id, sip_username, password, sip_uri, websocket_path, display_name, extension, turn]
      properties:
        device_id:
          type: string
          format: uuid
        sip_username:
          type: string
          description: The line's SIP username (also its digest authentication username).
        password:
          type: string
          description: Shown once. Keep it in the page's memory only, never in storage.
        sip_uri:
          type: string
          description: e.g. "sip:d_Ab12Cd34@sip.example.com".
        websocket_path:
          type: string
          const: /sip
          description: Open wss://<this page's own host>/sip with subprotocol "sip".
        display_name:
          type: string
        extension:
          type: string
          description: The extension number this line answers for, e.g. "101".
        turn:
          $ref: "#/components/schemas/TurnCredentials"

    Presence:
      description: A person's chosen status. `dnd` (Do not disturb) also stops their extension ringing.
      type: string
      enum: [available, away, dnd]

    TeamMember:
      type: object
      required: [extension, name, status]
      properties:
        extension:
          type: string
          description: The extension number, e.g. "101".
        name:
          type: string
          description: The person on this extension, or the extension's own name when nobody is.
        status:
          type: string
          enum: [on_call, ringing, dnd, away, available, offline]
          description: >-
            What they're doing now: on a call or ringing beats their chosen
            status; `available` and `away` need a phone signed in, or it's
            `offline`.
        since:
          type: string
          format: date-time
          description: For `on_call` and `ringing`, when the call was answered or started ringing.

    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    TurnCredentials:
      description: Credentials for Linx's relay, as an RTCIceServer (ADR-039).
      type: object
      required: [urls, username, credential, expires_at]
      properties:
        urls:
          type: array
          items:
            type: string
          description: e.g. ["turn:turn.example.com:443?transport=udp", "turns:turn.example.com:443?transport=tcp"].
        username:
          type: string
        credential:
          type: string
        expires_at:
          type: string
          format: date-time

    MfaConfirmed:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: 10 codes, shown once. Each works instead of an authenticator code, one time.
