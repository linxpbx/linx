        /me/passkeys/options, as PublicKeyCredential.toJSON() gives it. At
        most 10 passkeys. In a whole session this needs "confirm it's you"
        (a new passkey is a new way in); a session pending its second
        step's setup may add its first one, which finishes signing in.
