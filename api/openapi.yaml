      security:
        - bearer: [sso:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password-only:
    post:
      operationId: acceptPasswordOnly
      summary: Choose to sign in with a password only
      description: >-
        For an admin whose sign-in is waiting on setting up a passkey or an
        authenticator app (`mfa_setup_required`): they accept the "not
        recommended" warning and sign in with a password only (docs/ADMIN.md
        §5, owner decision 2026-09-27). Finishes that sign-in. Refused (409
        `second_step_exists`) once the person has a passkey or authenticator.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept:
                  type: boolean
                  enum: [true]
                  description: The warning was shown and accepted.
      responses:
        "204":
          description: Recorded; the session is signed in.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/web-phone:
    post:
      operationId: issueMyWebPhone
      summary: Get this browser's phone line
      description: >-
        For a signed-in browser session only (docs/WEB.md §5). Creates the
        session's web device for the caller's extension the first time, and
        gives it a new password every time after (the page keeps it in
        memory only, so a reloaded page has lost it). The password is shown
        this once. The line works only through this server's `/sip` relay
        and only while this session lasts: signing out, or anything else that
        ends the session, ends the line at once. Also returns relay (TURN)
        credentials, as GET /me/turn-credentials does. 409 `no_extension` if
        the caller has no extension, `extension_unavailable` if it's off or
        deleted.
      tags: [people]
      responses:
        "200":
          description: The phone line, with its password shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPhone"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/turn-credentials:
    get:
      operationId: getMyTurnCredentials
      summary: Fresh relay (TURN) credentials
      description: >-
        For a signed-in person (docs/WEB.md §5). Valid for an hour; ask for
        new ones before `expires_at`. Use them as an RTCIceServer: `urls`,
        `username`, `credential`.
      tags: [people]
      responses:
        "200":
          description: Relay credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnCredentials"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/presence:
    put:
      operationId: setMyPresence
      summary: Set my status
      description: >-
        Available, Away or Do not disturb (the account menu's "Set status").
        Do not disturb also stops the person's extension ringing: callers
        hear "not available". Queues `presence.changed` when it changes.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presence]
              properties:
                presence:
                  $ref: "#/components/schemas/Presence"
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/team:
    get:
      operationId: listTeam
      summary: The Team list
      description: >-
        Every extension with the name of the person on it and what they're
        doing now (docs/ui/WEB_SCREENS_PHASE1C.md §6), sorted by name. For
        live updates open the websocket at `/api/v1/team/live` instead.
      tags: [team]
      security:
        - bearer: [team:read]
      responses:
        "200":
          description: The Team list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/team/live:
    get:
      operationId: watchTeam
      summary: The Team list, live (websocket)
      description: >-
        A websocket (subprotocol `linx.team.v1`) that sends the whole Team
        list as a TeamList JSON message at once and again whenever it
        changes. It never reads anything the client sends. Signed-in
        browser sessions only, from this server's own page (Origin must
        match); it closes when the session ends. API clients use GET /team.
        Served by a hand-written handler (excluded from code generation).
      tags: [team]
      security:
        - bearer: [team:read]
      responses:
        "101":
          description: Switching to the websocket.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail:
    get:
      operationId: listVoicemail
      summary: My voicemail
      description: >-
        The Voicemail tab (ADR-069, docs/ui/SCREENS_PHASE1F.md §12.1):
        the boxes the signed-in person may see (their own, their ring
        groups', and with `all` every box for an admin) and the newest 500
        messages in them, newest first, without audio. `box` lists one
        box. Signed-in browser sessions only (`not_a_session` for API
        keys: the audio is people's voices); `voicemail.created` tells API
        clients a message arrived.
      tags: [voicemail]
      parameters:
        - name: box
          in: query
          schema:
            type: string
            format: uuid
        - name: all
          in: query
          description: Every box (admins only; ignored for others).
          schema:
            type: boolean
      responses:
        "200":
          description: The boxes and their messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateVoicemail
      summary: Mark a voicemail heard or new
      description: >-
        Heard by the first person who marks it (a ring group's members see
        "Heard by Sara"); `heard: false` makes it new again for everyone
        who sees the box.
      tags: [voicemail]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [heard]
              properties:
                heard:
                  type: boolean
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteVoicemail
      summary: Delete a voicemail
      description: Deleted for everyone who sees the box. Audited.
      tags: [voicemail]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail/{id}/audio:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getVoicemailAudio
      summary: A voicemail's audio
      description: >-
        16-bit PCM WAV made from the stored recording, with ranges for the
        player. `download=1` names it as a file. Signed-in browser
        sessions only. Served by a hand-written handler (excluded from
        code generation).
      tags: [voicemail]
      parameters:
        - name: download
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The audio.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/voicemail-count:
    get:
      operationId: getMyVoicemailCount
      summary: How many new voicemails I have
      description: >-
        The sidebar badge: messages nobody has heard in the person's own
        and ring groups' boxes. Fetched again when the Team websocket's
        `voicemail` counter changes.
      tags: [voicemail]
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required: [new]
                properties:
                  new:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail-boxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getVoicemailBox
      summary: A voicemail box's settings
      description: >-
        Voicemail → Settings (docs/ui/SCREENS_PHASE1F.md §12.3), a ring
        group's Voicemail section, People's Voicemail line. A box's id is
        its person's extension id or its ring group's id.
      tags: [voicemail]
      responses:
        "200":
          description: The box.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailBoxSettings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateVoicemailBox
      summary: Change a voicemail box
      description: >-
        On or off and email (the box's person, or an admin; 403
        otherwise), and which greeting plays (also a ring group's
        members). A box that's off plays "not available". A ring group's
        box can't email (`email_not_for_groups`); email needs email set up
        first (`email_not_set_up`); `own` needs a recording
        (`greeting_not_recorded`). Audited.
      tags: [voicemail]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/VoicemailBoxPatch"
      responses:
        "200":
          description: The box as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailBoxSettings"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail-boxes/{id}/greetings/{kind}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [unavailable, closed]
    get:
      operationId: getVoicemailGreeting
      summary: Hear a box's own greeting
      description: >-
        As a WAV. Served by a hand-written handler (excluded from code
        generation).
      tags: [voicemail]
      responses:
        "200":
          description: The greeting.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putVoicemailGreeting
      summary: Record a box's own greeting
      description: >-
        The browser's recording as a WAV (16-bit PCM, one channel, 8000
        samples a second), half a second to 30 seconds; Linx converts it
        for phones and plays it from now on. The box's person, its ring
        group's members, or an admin. Audited. Served by a hand-written
        handler (excluded from code generation).
      tags: [voicemail]
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Saved and in use.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteVoicemailGreeting
      summary: Forget a box's own greeting
      description: Linx's own greeting plays again. Audited.
      tags: [voicemail]
      responses:
        "204":
          description: Forgotten.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/voicemail-settings:
    get:
      operationId: getVoicemailSettings
      summary: How long voicemail is kept
      description: System → Settings (docs/ui/SCREENS_PHASE1F.md §12.5), with the space voicemail uses now.
      tags: [voicemail]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailSettings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateVoicemailSettings
      summary: Change how long voicemail is kept
      description: >-
        7 to 365 days. Older messages are deleted within the hour. Audited.
      tags: [voicemail]
      security:
        - bearer: [settings:write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              required: [keep_days]
              properties:
                keep_days:
                  type: integer
                  minimum: 7
                  maximum: 365
      responses:
        "200":
          description: The settings as they now are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailSettings"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/calls:
    get:
      operationId: listMyCalls
      summary: My call history
      description: >-
        The Call history tab (ADR-070, docs/ui/SCREENS_PHASE1F.md §13.1):
        the calls the signed-in person made, was rung for, answered, or
        whose voicemail they reached, newest first. `missed` lists only
        the ones they missed. A person with no extension has none.
        Signed-in browser sessions only (`not_a_session` for API keys,
        which use GET /calls).
      tags: [calls]
      parameters:
        - $ref: "#/components/parameters/CallsMissed"
        - $ref: "#/components/parameters/CallsNumber"
        - $ref: "#/components/parameters/CallsBefore"
        - $ref: "#/components/parameters/CallsLimit"
      responses:
        "200":
          description: A page of calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistoryPage"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/missed-calls:
    get:
      operationId: getMyMissedCalls
      summary: How many calls I missed since I last looked
      description: >-
        The Call history badge. Fetched again when the Team websocket's
        `calls` counter changes. Signed-in browser sessions only.
      tags: [calls]
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required: [missed]
                properties:
                  missed:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearMyMissedCalls
      summary: Clear the Call history badge
      description: Called when the person opens Call history. Signed-in browser sessions only.
      tags: [calls]
      responses:
        "204":
          description: Cleared.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/calls:
    get:
      operationId: listCalls
      summary: Everyone's call history
      description: >-
        Admin → Calls (ADR-070, docs/ui/SCREENS_PHASE1F.md §13.2), newest
        first, kept for the days call history settings say (1 year by
        default). Filters: one person's calls (`extension_id`), a number
        (digits, anywhere in the caller's or the called number), missed
        only, and a time range (`from` inclusive, `to` exclusive). Page
        with `before` (the `next` of the last page).
      tags: [calls]
      security:
        - bearer: [calls:read]
      parameters:
        - name: extension_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CallsMissed"
        - $ref: "#/components/parameters/CallsNumber"
        - $ref: "#/components/parameters/CallsFrom"
        - $ref: "#/components/parameters/CallsTo"
        - $ref: "#/components/parameters/CallsBefore"
        - $ref: "#/components/parameters/CallsLimit"
      responses:
        "200":
          description: A page of calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistoryPage"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/calls/csv:
    get:
      operationId: downloadCalls
      summary: Download call history (CSV)
      description: >-
        The same filters as GET /calls, one line per call, up to 100,000
        calls, times in the server's time zone; the file name says the
        dates. Served by a hand-written handler (excluded from code
        generation).
      tags: [calls]
      security:
        - bearer: [calls:read]
      parameters:
        - name: extension_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CallsMissed"
        - $ref: "#/components/parameters/CallsNumber"
        - $ref: "#/components/parameters/CallsFrom"
        - $ref: "#/components/parameters/CallsTo"
      responses:
        "200":
          description: The calls.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/call-history-settings:
    get:
      operationId: getCallHistorySettings
      summary: How long call history is kept
      description: System → Settings, with how many calls are kept and the space call history uses.
      tags: [calls]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistorySettings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCallHistorySettings
      summary: Change how long call history is kept
      description: 30 to 730 days. Older calls are deleted within the hour. Audited.
      tags: [calls]
      security:
        - bearer: [settings:write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              required: [keep_days]
              properties:
                keep_days:
                  type: integer
                  minimum: 30
                  maximum: 730
      responses:
        "200":
          description: The settings as they now are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistorySettings"
        default:
          $ref: "#/components/responses/Problem"

  /oauth/token:
    post:
      operationId: oauthToken
      summary: Get an access token (OAuth 2.0 client credentials)
      description: >-
        RFC 6749 §4.4. Authenticate the client with HTTP Basic or with
        client_id and client_secret in the form, not both. Returns a JWT
        (EdDSA) valid for 15 minutes; there are no refresh tokens. Errors use
        the OAuth format (RFC 6749 §5.2), not problem+json. Served by a
        hand-written handler (excluded from code generation).
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An access token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: A malformed request, unknown grant type or scope not held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: The client couldn't be authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: Too many failed attempts or requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/v1/help/guides:
    get:
      operationId: listHelpGuides
      summary: The help guides the caller may read
      description: >-
        The guide list (docs/HELP.md): every guide the caller may read, by
        section, with the screens each is about (for the **?** button).
        Without a session only the sign-in guides; with one, by role. Any
        Authorization header is ignored: Help is for people, not API keys.
        Served by a hand-written handler (one page for both the signed-in
        and the signed-out).
      tags: [help]
      security: []
      responses:
        "200":
          description: The guides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpGuideList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help/guides/{name}:
    get:
      operationId: getHelpGuide
      summary: One help guide
      description: >-
        A guide as blocks the page draws itself (never HTML). A guide that
        doesn't exist and one the caller may not read get the same 404.
      tags: [help]
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,64}$"
      responses:
        "200":
          description: The guide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpGuide"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help/search:
    get:
      operationId: searchHelp
      summary: Search the help guides
      description: >-
        The sections of the guides the caller may read that best match a
        plain question (docs/HELP.md §3), best first. Nothing found is an
        empty list.
      tags: [help]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpSearchResults"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help/pictures/{file}:
    get:
      operationId: getHelpPicture
      summary: A picture in a help guide
      description: >-
        A screenshot a guide shows, `light-<name>.webp` or
        `dark-<name>.webp`, only when a guide the caller may read uses it;
        otherwise the same 404 as a picture that doesn't exist.
      tags: [help]
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^(light|dark)-[a-z0-9-]{1,64}\\.webp$"
      responses:
        "200":
          description: The picture.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help/answer:
    post:
      operationId: answerHelpQuestion
      summary: A written answer from the guides
      description: >-
        Where an admin turned written answers on (docs/HELP.md §4): the
        question and the guide sections search finds for it go to the
        provider the admin chose, and its answer comes back as it's
        written, as newline-delimited JSON: `{"text": "…"}` pieces, then
        `{"done": true, "guides": [{"name", "title"}], "by": "…"}` (with
        `"cut": true` if it reached its length limit), or
        `{"error": "…"}` if it fails part way. Shown as text, never HTML.
        Needs a full session (not an API key); counted against 10 a minute
        and the daily limits. A problem before anything is written (off,
        limits, the provider refusing) comes back as usual. Hand-written
        (services/control-plane/help.go): the answer streams.
      tags: [help]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: The answer, as it's written.
          content:
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help-answers:
    get:
      operationId: getHelpAnswers
      summary: Help's written answers setting
      description: The provider, address, model and limits (docs/HELP.md §4); the API key is never shown, only whether one is set.
      tags: [help]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The setting.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpAnswers"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateHelpAnswers
      summary: Change Help's written answers setting
      description: >-
        JSON Merge Patch with If-Match. Needs a fresh "confirm it's you";
        audited without the key. A new provider or address needs the API
        key pasted again (a key only goes where it was given for).
      tags: [help]
      security:
        - bearer: [settings:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/HelpAnswersPatch"
      responses:
        "200":
          description: The setting as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpAnswers"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/help-answers/test:
    post:
      operationId: testHelpAnswers
      summary: Ask one question with the saved setting
      description: >-
        Sends one question (by default "How do I add a desk phone?") with
        the saved setting, on or off, and returns the whole answer. Counts
        as one of the caller's questions.
      tags: [help]
      security:
        - bearer: [settings:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                question:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpAnswersTest"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/email:
    get:
      operationId: getEmail
      summary: How Linx sends email
      description: >-
        The mail account Linx sends through (ADR-066, docs/PHASE1F.md §4)
        and its queue; the password is never shown, only whether one is set.
      tags: [settings]
      security:
        - bearer: [settings:read]
      responses:
        "200":
          description: The setting.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateEmail
      summary: Change how Linx sends email
      description: >-
        JSON Merge Patch with If-Match. A system admin only, after a fresh
        "confirm it's you"; audited without the password. A new server or
        address needs the password typed again. A server on a private
        network is refused (host_blocked) unless it's on the outbound
        allowlist.
      tags: [settings]
      security:
        - bearer: [settings:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EmailPatch"
      responses:
        "200":
          description: The setting as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/email/test:
    post:
      operationId: testEmail
      summary: Send the test email to yourself
      description: >-
        Sends "Linx can send email" to the caller's own address with the
        saved setting, on or off, straight away (not queued), and says how
        far it got. A system admin only; 5 a minute.
      tags: [settings]
      security:
        - bearer: [settings:write]
      responses:
        "200":
          description: How far it got.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTest"
        default:
          $ref: "#/components/responses/Problem"

webhooks:
  webhook.test:
    post:
      summary: A test message (POST /webhooks/{id}/test)
      description: >-
        `data` is `{"webhook_id": "<uuid>", "message": "..."}`. Other events
        are added here with the features that send them.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received. 410 Gone turns the endpoint off; anything else is retried.

  alert.fired:
    post:
      summary: An admin alert opened (docs/API.md §5)
      description: >-
        Sent once an alert has been open for 5 minutes (a flapping problem
        that clears sooner never fires this). `data` is
        `{"alert_id", "key", "severity", "title", "message", "link"}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received.

  alert.resolved:
    post:
      summary: An admin alert cleared (docs/API.md §5)
      description: Sent once for an alert that was fired. Same `data` shape as alert.fired.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received.

  voicemail.created:
    post:
      summary: A caller left a voicemail (ADR-069)
      description: >-
        Sent once the message is kept. `data` is `{"id", "box": {"id",
        "kind": "extension" | "ring_group", "extension_id" |
        "ring_group_id"}, "from": {"number", "name", "extension_id"?},
        "received_at", "duration_seconds"}`. No audio: a caller from a
        line's number and name are as the line sent them (cleaned), so
        treat them as text.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessage"
      responses:
        "200":
          description: Any 2xx means received.

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        An API key (`linx_<id>_<secret>`) or an access token from
        /oauth/token. Operations list the scopes they need (docs/API.md §3).

  parameters:
    CallsMissed:
      name: missed
      in: query
      schema:
        type: boolean
    CallsNumber:
      name: number
      in: query
      schema:
        type: string
        maxLength: 40
    CallsFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    CallsTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    CallsBefore:
      name: before
      in: query
      schema:
        type: string
        maxLength: 80
    CallsLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceName:
      name: service
      in: path
      required: true
      description: A Linx service, as System → Status lists them (e.g. `asterisk`).
      schema:
        type: string
        maxLength: 32
    Limit:
      name: limit
      in: query
      description: Maximum items per page (docs/API.md §2).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous page's `next_cursor`.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: The resource's `etag`; the change is refused with 412 if it no longer matches.
      schema:
        type: string

  headers:
    ETag:
      description: The resource's version, for If-Match.
      schema:
        type: string

  responses:
    Problem:
      description: An error (docs/API.md §2).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CallHistoryParty:
      type: object
      required: [number, name]
      properties:
        number:
          type: string
          description: An outside number (E.164 when Linx could tell), a person's extension, or what was dialled; "" when withheld.
        name:
          type: string
          description: The person's name, or what the caller's provider sent (plain text, show as text only).
        extension_id:
          type: string
          format: uuid

    CallHistoryVoicemail:
      type: object
      required: [box]
      properties:
        box:
          type: string
          description: Whose voicemail, e.g. "Sara Haddad (101)" or "Sales".
        id:
          type: string
          format: uuid
          description: The message left, while it's kept (absent - none left, or deleted since).
        box_id:
          type: string
          format: uuid
        duration_ms:
          type: integer

    CallRecord:
      type: object
      required: [id, direction, started_at, ended_at, talk_seconds, result, missed, rang_unanswered, from, to, steps]
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [internal, inbound, outbound]
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        talk_seconds:
          type: integer
        result:
          type: string
          enum: [answered, missed, voicemail, not_available, not_in_use, closed, not_permitted, no_lines, limit_reached, echo_test, busy, failed]
          description: >-
            missed - phones rang and nobody answered (the caller's own view
            says "No answer"); voicemail - reached a voicemail box (after
            ringing when rang_unanswered); the others are where Linx ended
            the call itself.
        missed:
          type: boolean
          description: In my history, I missed it; in everyone's, someone did.
        rang_unanswered:
          type: boolean
        placed_by_me:
          type: boolean
          description: In my history, I made this call.
        from:
          $ref: "#/components/schemas/CallHistoryParty"
        to:
          $ref: "#/components/schemas/CallHistoryParty"
        line:
          type: string
          description: The phone line it came in or went out on.
        ring_group:
          type: string
        answered_by:
          type: string
          description: The person who answered ("Sara Haddad (101)"), or the outside number for an outgoing call.
        answered_by_extension_id:
          type: string
          format: uuid
        voicemail:
          $ref: "#/components/schemas/CallHistoryVoicemail"
        steps:
          type: array
          items:
            type: string
          description: The call's way through Linx, one plain sentence per step.

    CallHistoryPage:
      type: object
      required: [items, keep_days]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CallRecord"
        next:
          type: string
          description: Pass as `before` for the next page; absent on the last.
        keep_days:
          type: integer

    CallHistorySettings:
      type: object
      required: [keep_days, calls, bytes]
      properties:
        keep_days:
          type: integer
        calls:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64

    OpenApiDocument:
      description: The full OpenAPI document served by this API. Free-form JSON.
      type: object
      additionalProperties: true

    Principal:
      description: The authenticated caller (docs/API.md §3).
      type: object
      required: [id, type, scopes]
      properties:
        id:
          type: string
          description: The user, API key or OAuth client id.
        type:
          type: string
          enum: [user, api_key, oauth_client, system]
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          description: The role ceiling; scopes never exceed it.
        scopes:
          type: array
          items:
            type: string
          description: e.g. `extensions:write`, `webhooks:write`.
        pending:
          type: boolean
          description: >-
            True for a signed-in person's session still waiting on its
            authenticator code or first-run MFA enrollment (docs/WEB.md §4):
            scopes is empty until then.
        email:
          type: string
          description: A signed-in person's own email (type user only).
        name:
          type: string
          description: A signed-in person's own name (type user only).
        extension_id:
          type: string
          format: uuid
          description: The extension a signed-in person answers on the web client, if they have one.
        mfa_enabled:
          type: boolean
          description: Whether a signed-in person has turned on an authenticator app.
        passkeys:
          type: integer
          description: How many passkeys a signed-in person has.
        has_password:
          type: boolean
          description: False for a person who set up their account with a passkey only.
        password_only:
          type: boolean
          description: >-
            A signed-in person with no passkey and no authenticator app:
            for an admin, the "not recommended" reminder (docs/ADMIN.md §5).
        recovery_codes_left:
          type: integer
        extension:
          type: string
          description: The number of that extension, e.g. "101".
        presence:
          $ref: "#/components/schemas/Presence"
        company_sign_in:
          type: array
          items:
            type: string
          description: The company sign-in providers a signed-in person has linked an account on (their names).
        admin_network_restricted:
          type: boolean
          description: >-
            True when this session's admin/system_admin scopes were dropped
            to an ordinary person's because it signed in from outside the
            allowed networks (docs/ADMIN.md §3): the admin area explains why
            it's missing rather than just hiding.

    EventType:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: e.g. `call.missed`.
        description:
          type: string

    EventTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
        next_cursor:
          type: string
          description: Pass as `?cursor=` to fetch the next page; absent on the last page.

    Role:
      type: string
      enum: [system_admin, admin, user, reporter]

    CredentialCreate:
      description: A new API key or OAuth client.
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What it's for, e.g. "CRM sync".
        role:
          $ref: "#/components/schemas/Role"
          description: Defaults to the caller's role; can't be above it.
        scopes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
          description: >-
            Scopes to grant, each held by the caller. `all` means every
            non-sensitive scope the role and caller have; sensitive scopes
            (api_keys:write, oauth_clients:write, recordings:read,
            transcripts:read, calls:control, devices:write) must be named.
        expires_at:
          type: string
          format: date-time
          description: Defaults to one year from now; at most two years.
        allowed_ips:
          type: array
          maxItems: 20
          items:
            type: string
          description: Addresses or CIDR ranges it may be used from. Empty allows any.

    ApiKey:
      type: object
      required: [id, name, prefix, role, scopes, allowed_ips, created_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The key's public start, `linx_<id>`, to recognise it.
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        revoked_at:
          type: string
          format: date-time

    ApiKeyCreated:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: The full key. Shown once; store it somewhere safe.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: string

    OAuthClient:
      type: object
      required: [id, client_id, name, role, scopes, allowed_ips, created_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          description: Sent to /oauth/token.
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        revoked_at:
          type: string
          format: date-time

    OAuthClientCreated:
      type: object
      required: [oauth_client, client_secret]
      properties:
        oauth_client:
          $ref: "#/components/schemas/OAuthClient"
        client_secret:
          type: string
          description: Shown once; store it somewhere safe.

    OAuthClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
        next_cursor:
          type: string

    Webhook:
      description: A webhook endpoint (docs/API.md §4).
      type: object
      required: [id, url, description, event_types, enabled, created_by, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
        event_types:
          type: array
          items:
            type: string
          description: Events sent to it; empty means every event.
        enabled:
          type: boolean
        disabled_reason:
          type: string
          enum: [gone, failing, admin]
          description: >-
            Why it's off: `gone` (the receiver answered 410), `failing`
            (every delivery failed for 5 days) or `admin` (turned off).
        disabled_at:
          type: string
          format: date-time
        failing_since:
          type: string
          format: date-time
          description: When the current run of failed deliveries started; absent while healthy.
        last_success_at:
          type: string
          format: date-time
        previous_secret_expires_at:
          type: string
          format: date-time
          description: After a rotation, when the old secret stops signing.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: An https:// URL, without a user name or password in it.
        description:
          type: string
          maxLength: 200
        event_types:
          type: array
          maxItems: 50
          items:
            type: string
          description: Event types to send (GET /event-types). Empty or absent means every event.
        enabled:
          type: boolean
          description: Defaults to true.

    WebhookPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 200
        event_types:
          type: array
          maxItems: 50
          items:
            type: string
        enabled:
          type: boolean

    WebhookWithSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: >-
            The signing secret (`whsec_...`) for your Standard Webhooks
            library. Shown once; store it somewhere safe.

    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        next_cursor:
          type: string

    DeliveryStatus:
      type: string
      enum: [pending, succeeded, failed, cancelled]

    WebhookDelivery:
      description: One event on its way to one endpoint.
      type: object
      required: [id, webhook_id, event_id, event_type, status, attempts, max_attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The `webhook-id` header receivers de-duplicate on.
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
          description: When a pending delivery is tried next.
        replay_of:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        log:
          type: array
          description: Each attempt, oldest first (only on GET /webhook-deliveries/{id} and /test).
          items:
            $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryAttempt:
      type: object
      required: [at, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        status_code:
          type: integer
          description: The receiver's HTTP status; absent if there was no answer.
        duration_ms:
          type: integer
        response_excerpt:
          type: string
          description: The first 4 KB of the receiver's answer.
        error:
          type: string
          description: Why the attempt failed, in plain language.

    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string

    WebhookReplay:
      type: object
      additionalProperties: false
      required: [since]
      properties:
        since:
          type: string
          format: date-time

    WebhookReplayResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer

    AllowlistEntry:
      type: object
      required: [id, value, kind, description, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
          description: The CIDR range or host name.
        kind:
          type: string
          enum: [cidr, host]
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    AllowlistEntryCreate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 253
        description:
          type: string
          maxLength: 200

    AllowlistEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllowlistEntry"

    WebhookMessage:
      description: >-
        The body of every webhook (Standard Webhooks). Headers:
        `webhook-id` (the event id; the same on retries and replays, so
        de-duplicate on it), `webhook-timestamp` (Unix seconds of this
        attempt) and `webhook-signature` (`v1,<base64 HMAC-SHA256>` of
        `id.timestamp.body`, one per active secret, space-separated).
        Order isn't guaranteed.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          type: string
          description: The event type, e.g. `call.missed`.
        timestamp:
          type: string
          format: date-time
          description: When the event happened.
        data:
          type: object
          description: Event-specific; documented per event.

    AlertChannelKind:
      type: string
      enum: [ntfy, gotify, slack, teams, telegram, webhook, email]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    QuietHours:
      description: >-
        A do-not-disturb window in the channel's own local time
        (docs/API.md §5). `start` may be after `end`: the window then
        wraps past midnight (e.g. 22:00-07:00).
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time quiet hours begin, e.g. "22:00". Required when enabled.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time quiet hours end, e.g. "07:00". Required when enabled.
        timezone:
          type: string
          description: IANA time zone name, e.g. "Europe/Istanbul". Required when enabled.
        bypass_critical:
          type: boolean
          description: Send critical alerts even during quiet hours. Defaults to true.

    AlertChannelConfig:
      description: >-
        Fields for this channel's kind (docs/API.md §5); a field another
        kind uses is refused. Never returned once saved — use Test to
        check it still works.
      type: object
      additionalProperties: false
      properties:
        server_url:
          type: string
          maxLength: 2048
          description: ntfy or Gotify server. Defaults to https://ntfy.sh for ntfy; required for Gotify.
        topic:
          type: string
          maxLength: 64
          description: ntfy topic name.
        access_token:
          type: string
          maxLength: 512
          description: ntfy access token, if the topic needs one.
        app_token:
          type: string
          maxLength: 512
          description: Gotify application token.
        url:
          type: string
          maxLength: 2048
          description: The incoming webhook URL (Slack, Teams) or the receiving URL (generic webhook).
        bot_token:
          type: string
          maxLength: 512
          description: Telegram bot token (from @BotFather).
        chat_id:
          type: string
          maxLength: 64
          description: Telegram chat id to send to.
        to:
          type: string
          maxLength: 2600
          description: >-
            Email addresses, separated by commas (at most 10), for an email
            channel. Needs email set up (System → Settings). The "email
            isn't sending" alert never goes to an email channel.

    AlertChannel:
      description: A place Linx sends admin alerts (docs/API.md §5).
      type: object
      required: [id, kind, name, min_severity, enabled, created_by, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AlertChannelKind"
        name:
          type: string
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
          description: Alerts below this severity aren't sent here.
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    AlertChannelCreate:
      type: object
      additionalProperties: false
      required: [kind, name, config]
      properties:
        kind:
          $ref: "#/components/schemas/AlertChannelKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: "#/components/schemas/AlertChannelConfig"
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
          description: Defaults to "info".
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean
          description: Defaults to true.

    AlertChannelPatch:
      description: >-
        JSON Merge Patch; fields not sent stay as they are. `config` and
        `quiet_hours`, when sent, replace as a whole.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: "#/components/schemas/AlertChannelConfig"
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        enabled:
          type: boolean

    AlertChannelCreated:
      type: object
      required: [alert_channel]
      properties:
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        secret:
          type: string
          description: >-
            Only for a `webhook` channel: the signing secret (`whsec_...`),
            generated by Linx. Shown once; store it somewhere safe.

    AlertChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertChannel"
        next_cursor:
          type: string

    AlertChannelTestResult:
      type: object
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
        status_code:
          type: integer
        duration_ms:
          type: integer
        error:
          type: string
          description: Plain-language reason it failed; absent when succeeded is true.

    AlertStatus:
      type: string
      enum: [open, resolved]

    Alert:
      type: object
      required: [id, key, severity, title, message, status, first_seen_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: De-duplicates this problem, e.g. `trunk.down:<trunk-id>`.
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        title:
          type: string
        message:
          type: string
        link:
          type: string
          description: Link to the relevant admin page.
        status:
          $ref: "#/components/schemas/AlertStatus"
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          type: string

    Extension:
      description: An extension (docs/PBX.md §3), e.g. "101".
      type: object
      required: [id, number, display_name, enabled, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: 2 to 6 digits, unique. Refused (422 number_reserved) if it starts like an outside number in the country Linx is set up in (0 in the UAE) or is an emergency or short service number there (999, 112, 901, ...).
        display_name:
          type: string
        email:
          type: string
        call_permission_level_id:
          type: string
          format: uuid
          description: Who this extension may call out to (docs/TRUNKS.md §5). Absent means it may only call emergency numbers.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    ExtensionCreate:
      type: object
      additionalProperties: false
      required: [number, display_name]
      properties:
        number:
          type: string
          maxLength: 20
          description: 2 to 6 digits; same rules as when creating.
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
        call_permission_level_id:
          type: string
          format: uuid
          description: Needs the routing:write scope as well (a level decides which numbers cost money to call); 403 scope_missing otherwise.
        enabled:
          type: boolean
          description: Defaults to true.

    ExtensionPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        number:
          type: string
          maxLength: 20
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
        call_permission_level_id:
          type: string
          description: Empty string clears it (only emergency numbers stay allowed). Changing it needs the routing:write scope as well; 403 scope_missing otherwise.
        enabled:
          type: boolean

    ExtensionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Extension"
        next_cursor:
          type: string

    DeviceKind:
      type: string
      enum: [softphone, web, ios, desk]
      description: Only `softphone` works in this slice (ADR-035); the others arrive with the web client and the iOS app.

    CallParty:
      description: >-
        One end of a call: one of Linx's devices (extension, device_id and
        its name), or someone outside (number, and name if their provider
        sent one).
      type: object
      required: [name]
      properties:
        extension:
          type: string
          description: The device's extension number.
        device_id:
          type: string
          format: uuid
        name:
          type: string
          description: The device's name, or the outside caller's name as their provider sent it (letters, digits, spaces and dots only; may be empty).
        number:
          type: string
          description: An outside party's number, in E.164 (+971...) when Linx can read it.

    ActiveCall:
      type: object
      required: [id, direction, from, to, state, started_at]
      properties:
        id:
          type: string
          format: uuid
          description: The same id the call's webhook events carry.
        direction:
          type: string
          enum: [internal, inbound, outbound]
          description: >-
            `internal`: between Linx's own extensions (or to Linx itself,
            like the echo test). `inbound`: from outside, through a trunk.
            `outbound`: to an outside number.
        trunk_id:
          type: string
          format: uuid
          description: The trunk an inbound call came in on, or the line an outbound call went out on (the last one tried).
        from:
          $ref: "#/components/schemas/CallParty"
        to:
          type: string
          description: The number dialled (for an inbound call, the phone number the caller dialled).
        ringing:
          type: string
          description: The extension this call rings, once Linx knows it.
        state:
          type: string
          enum: [ringing, answered, system]
          description: >-
            `ringing`: devices are ringing (or about to). `answered`: a
            device answered. `system`: Linx itself answered, for the echo
            test or a spoken message ("not available", "not in use").
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
        answered_by:
          $ref: "#/components/schemas/CallParty"

    ActiveCallList:
      type: object
      required: [items, phone_engine_connected]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveCall"
        phone_engine_connected:
          type: boolean

    Device:
      description: A phone or app that rings for an extension (docs/PBX.md §3).
      type: object
      required: [id, extension_id, name, kind, sip_username, enabled, online, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        extension_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/DeviceKind"
        sip_username:
          type: string
          description: The SIP login's public part (Asterisk's endpoint id); random, so it never reveals the extension.
        enabled:
          type: boolean
        revoked_at:
          type: string
          format: date-time
          description: When the device was revoked (it stays off for good). Absent if it wasn't.
        online:
          type: boolean
          description: Signed in right now (as the phone engine last reported; always false for a turned-off device).
        last_registered_at:
          type: string
          format: date-time
        last_registered_from:
          type: string
          description: The address it last registered from.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    DeviceCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Mohammed's iPhone".
        kind:
          $ref: "#/components/schemas/DeviceKind"
          description: Defaults to `softphone`.
        enabled:
          type: boolean
          description: Defaults to true.

    DevicePatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        next_cursor:
          type: string

    DeviceCredentials:
      description: A device with its SIP login, shown once (ADR-033).
      type: object
      required: [device, password, server, port, transport, settings_text]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        password:
          type: string
          description: Shown once; Linx stores only its digest hash. Store it somewhere safe.
        server:
          type: string
          description: e.g. "sip.example.com".
        port:
          type: integer
          description: "5061."
        transport:
          type: string
          const: tls
        settings_text:
          type: string
          description: A plain-language summary of the above, ready to paste into a phone app.

    TrunkKind:
      type: string
      enum: [registration, ip_authenticated, lan_peer, registers_here]
      description: >-
        `registration`: Linx signs in to the provider. `ip_authenticated`:
        the provider calls in from its own fixed addresses. `lan_peer`:
        another phone system on the LAN that Linx connects to
        (docs/TRUNKS.md §3). `registers_here`: a phone system or gateway
        that signs in to Linx with a login Linx makes for it, like a desk
        phone (docs/SIMPLER.md §1): it has no host, login or connection
        settings of its own (always TLS with encrypted audio; 422
        `registers_here_fixed` if any are sent).

    TrunkTransport:
      type: string
      enum: [tls, tcp, udp]
      description: tcp and udp need confirm_unencrypted (ADR-023).

    TrunkMediaEncryption:
      type: string
      enum: [srtp, none]
      description: none needs confirm_unencrypted (ADR-023).

    TrunkCertTrust:
      type: string
      enum: [public, pinned]
      description: pinned is a certificate or CA the admin compared and approved (ADR-045).

    TrunkDialFormat:
      type: string
      enum: [e164, "00_prefix", local]
      description: How outgoing numbers are written for this trunk.

    TrunkCodec:
      type: string
      enum: [ulaw, alaw, g722, opus]

    NumberCategory:
      type: string
      enum: [landline, mobile, national, shared_cost, toll_free, premium, international, service]
      description: A numbering.Category a call permission level can name. Emergency numbers are always allowed and never listed here.

    Trunk:
      description: A phone line to a provider or another phone system (docs/TRUNKS.md §3). Its password is write-only and never returned.
      type: object
      required: [id, name, kind, host, port, transport, media_encryption, cert_trust, dial_format, codecs, max_calls, unencrypted, enabled, status, status_detail, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [registered, reachable, rejected, unreachable, unknown, disabled]
          description: >-
            Whether it works, as Asterisk last reported it (checked every
            few seconds; each change fires trunk.status_changed).
            `registered`: Linx is signed in to the provider. `reachable`:
            it answers Linx's keep-alive checks. `rejected`: it answers but
            refuses Linx's login. `unreachable`: no answer. `unknown`: not
            checked yet. `disabled`: turned off.
        status_detail:
          type: string
          description: The status in plain words.
        status_since:
          type: string
          format: date-time
          description: When it last changed.
        kind:
          $ref: "#/components/schemas/TrunkKind"
        template:
          type: string
          description: Which entry of the provider template catalogue this was created from, if any.
        host:
          type: string
        port:
          type: integer
        transport:
          $ref: "#/components/schemas/TrunkTransport"
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
        pinned_certificate:
          type: string
          description: Present only when cert_trust is pinned.
        username:
          type: string
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
        caller_id_number:
          type: string
        max_calls:
          type: integer
        rings_extension_id:
          type: string
          format: uuid
          description: >-
            Where this line's calls for none of its numbers ring (an analog
            landline often sends no number, docs/SIMPLER.md §1.2). Absent:
            they hear "not in use".
        rings_ring_group_id:
          type: string
          format: uuid
          readOnly: true
          description: The ring group this line's calls for none of its numbers ring (set in Incoming).
        login:
          $ref: "#/components/schemas/TrunkLogin"
        wireguard_profile_id:
          type: string
          format: uuid
          description: >-
            The WireGuard profile this trunk connects through. Absent means "Internet" (ADR-024). Through a tunnel,
            `host` must be an IPv4 address (422 `host_must_be_address`): the tunnel carries only addresses known in advance.
        outbound_priority:
          type: integer
          description: 1 = tried first for outgoing calls. Absent means this trunk isn't used for outgoing calls. Set with PUT /outbound-routing.
        unencrypted:
          type: boolean
          description: Calls on this trunk travel without TLS or without SRTP media (ADR-023), and it isn't reached through a WireGuard profile.
        unencrypted_confirmed_by:
          type: string
          description: Who confirmed the ADR-023 warning. Present only while unencrypted is true.
        unencrypted_confirmed_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    TrunkLogin:
      description: >-
        A `registers_here` line's sign-in, only in the answer to creating it
        or to POST /trunks/{id}/reset-password: shown once, Linx keeps only
        its digest hash (ADR-033). The username is the line's `username`.
      type: object
      required: [username, password, server, port, transport, settings_text]
      properties:
        username:
          type: string
        password:
          type: string
        server:
          type: string
          description: e.g. "sip.example.com".
        port:
          type: integer
          description: "5061."
        transport:
          type: string
          const: tls
        settings_text:
          type: string
          description: A plain-language summary of the above, ready to paste.

    TrunkCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          $ref: "#/components/schemas/TrunkKind"
        template:
          type: string
          maxLength: 50
        host:
          type: string
          maxLength: 255
          description: Required for every kind but `registers_here`, which has none.
        port:
          type: integer
          description: Defaults to 5061.
        transport:
          $ref: "#/components/schemas/TrunkTransport"
          description: Defaults to tls.
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
          description: Defaults to srtp.
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
          description: Defaults to public.
        pinned_certificate:
          type: string
          description: Required when cert_trust is pinned.
        username:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 200
          description: Write-only; never returned.
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
          description: Defaults to e164.
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
          description: Defaults to [alaw, ulaw].
        caller_id_number:
          type: string
          maxLength: 32
        max_calls:
          type: integer
          description: Defaults to 4.
        wireguard_profile_id:
          type: string
          format: uuid
        rings_extension_id:
          type: string
          format: uuid
        confirm_unencrypted:
          type: boolean
          description: >-
            Must be true if the trunk as given is unencrypted and isn't
            reached through a WireGuard profile (ADR-023); refused with 422
            unencrypted_confirmation_required otherwise.
        enabled:
          type: boolean
          description: Defaults to true.

    TrunkPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 255
        port:
          type: integer
        transport:
          $ref: "#/components/schemas/TrunkTransport"
        media_encryption:
          $ref: "#/components/schemas/TrunkMediaEncryption"
        cert_trust:
          $ref: "#/components/schemas/TrunkCertTrust"
        pinned_certificate:
          type: string
        username:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 200
          description: Write-only; never returned. Empty string removes it.
        dial_format:
          $ref: "#/components/schemas/TrunkDialFormat"
        codecs:
          type: array
          items:
            $ref: "#/components/schemas/TrunkCodec"
        caller_id_number:
          type: string
          maxLength: 32
        max_calls:
          type: integer
        wireguard_profile_id:
          type: string
          description: Empty string moves the trunk to "Internet".
        rings_extension_id:
          type: string
          description: Empty string clears it.
        confirm_unencrypted:
          type: boolean
          description: >-
            Must be true when the change leaves the trunk unencrypted and it
            wasn't confirmed before, or when an unencrypted trunk gets
            another host, transport or media encryption (the earlier
            confirmation no longer covers it); 422
            unencrypted_confirmation_required otherwise.
        enabled:
          type: boolean

    TrunkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trunk"
        next_cursor:
          type: string

    Did:
      description: A phone number a trunk owns (docs/TRUNKS.md §5).
      type: object
      required: [id, trunk_id, number, label, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        trunk_id:
          type: string
          format: uuid
        number:
          type: string
          description: Digits, optionally starting with +.
        label:
          type: string
        extension_id:
          type: string
          format: uuid
          description: Absent (and no `ring_group_id`) means calls to this number hear "not in use".
        ring_group_id:
          type: string
          format: uuid
          readOnly: true
          description: The ring group it rings (set in Incoming, `PUT /incoming/{id}`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    DidCreate:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: string
          maxLength: 20
        label:
          type: string
          maxLength: 100
        extension_id:
          type: string
          format: uuid

    DidPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 100
        extension_id:
          type: string
          description: Empty string clears the route.

    DidList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Did"
        next_cursor:
          type: string

    InboundRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Did"
        next_cursor:
          type: string

    OutboundRouting:
      description: The order outgoing calls try trunks in (docs/TRUNKS.md §5).
      type: object
      required: [country, trunks, international_alert]
      properties:
        country:
          type: string
          description: The ISO 3166 country code Linx is set up in.
        international_alert:
          $ref: "#/components/schemas/InternationalAlert"
        trunks:
          type: array
          items:
            $ref: "#/components/schemas/Trunk"
          description: Every trunk used for outgoing calls, in the order they're tried.

    TrunkTest:
      type: object
      required: [ok, steps]
      properties:
        ok:
          type: boolean
          description: No step failed (warnings allowed).
        steps:
          type: array
          items:
            type: object
            required: [name, result, words]
            properties:
              name:
                type: string
                enum: [tunnel, address, connection, certificate, sip, login, audio_encryption, tls_offered, signed_in]
                description: "`signed_in`: the only step for a `registers_here` line, which Linx never connects out to: whether it's signed in now." 
              result:
                type: string
                enum: [ok, warning, failed, skipped]
              words:
                type: string
                description: What was found, in plain words.
        certificates:
          type: array
          description: The certificates it presented, its own first (TLS only).
          items:
            type: object
            required: [subject, issuer, names, not_after, sha256, self_signed, pem]
            properties:
              subject:
                type: string
              issuer:
                type: string
              names:
                type: array
                items:
                  type: string
              not_after:
                type: string
                format: date-time
              sha256:
                type: string
                description: The fingerprint, as providers print it (AB:CD:...).
              self_signed:
                type: boolean
              pem:
                type: string
        untrusted:
          type: boolean
          description: The certificate failed only because nothing Linx trusts signed it; pinning the last of `certificates` would let it pass, if the admin recognises its fingerprint.

    RouteTestRequest:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        direction:
          type: string
          enum: [outbound, inbound]
          default: outbound
          description: >-
            outbound tests a call from one of your extensions; inbound
            tests a call to one of your phone numbers (docs/ADMIN.md §9).
        number:
          type: string
          maxLength: 40
          description: >-
            Outbound: dialled the way you'd dial it on a mobile ("050 123
            4567", "+44 20 7946 0958"). Inbound: one of your phone numbers.
        from:
          type: string
          description: Outbound only. The calling extension's number. Without it, only what kind of number it is.
        at:
          type: string
          format: date-time
          description: >-
            When the call is made (office hours and holidays depend on it).
            Leave out for now.

    RouteTest:
      type: object
      required: [category, kind, words]
      properties:
        category:
          type: string
          enum: [emergency, service, landline, mobile, national, shared_cost, toll_free, premium, international, invalid]
        kind:
          type: string
          description: What the number is, in plain words.
        e164:
          type: string
        region:
          type: string
          description: The number's country (ISO 3166; "001" for international services).
        allowed:
          type: boolean
          description: With `from`, whether the call would go out (or, for emergency numbers, is always let through).
        reason:
          type: string
          enum: [emergency, invalid, unknown_caller, not_permitted, no_lines, allowed, routed, not_assigned, unknown_number]
        lines:
          type: array
          description: With `from`, the lines it would go out on, in the order they're tried.
          items:
            type: object
            required: [trunk, number]
            properties:
              trunk:
                type: string
              number:
                type: string
                description: The number as that line is sent it.
              caller_id:
                type: string
                description: What the called person sees; absent means the provider's default.
        extension:
          description: Inbound only, when the number routes to an extension.
          type: object
          required: [number, display_name]
          properties:
            number:
              type: string
            display_name:
              type: string
        words:
          type: string
          description: The whole decision in plain words, as `linx route test` prints it.
        when:
          type: string
          description: >-
            Inbound, for a number with office hours: the moment in the
            server's time zone and whether it's open ("Friday 20:00 (Asia/Dubai
            time): outside office hours").
        steps:
          type: array
          description: >-
            A call to one of your numbers, or from an extension to another
            one or a ring group: where it goes, step by step, if nobody
            answers along the way (the same function real calls use).
          items:
            type: object
            required: [words, rings]
            properties:
              words:
                type: string
              rings:
                type: boolean
                description: This step rings someone (the next one happens if nobody answers).

    InternationalAlert:
      type: object
      additionalProperties: false
      required: [minutes, calls]
      description: The "unusual calling abroad" alert fires when an hour has more than this many minutes, or calls, to numbers abroad (docs/TRUNKS.md §9).
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 10000
        calls:
          type: integer
          minimum: 1
          maximum: 10000

    OutboundRoutingUpdate:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          type: array
          items:
            type: string
            format: uuid
          description: Every trunk id to use for outgoing calls, primary first. Trunks left out stop being used for outgoing calls.
        international_alert:
          $ref: "#/components/schemas/InternationalAlert"

    WireguardProfile:
      description: A WireGuard tunnel trunks can be reached through (docs/TRUNKS.md §7). Its keys are write-only and never returned.
      type: object
      required: [id, name, address, public_key, peer_public_key, peer_endpoint_host, peer_endpoint_port, status, status_detail, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          description: This end's own tunnel address, e.g. "10.6.0.2/32" (it must include an IPv4 address).
        public_key:
          type: string
          description: Derived from the private key; give this to the provider if it needs it registered.
        peer_public_key:
          type: string
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
        persistent_keepalive:
          type: integer
          description: Seconds between keep-alives. Absent means Linx's default (25), so the tunnel's state is always known.
        status:
          type: string
          enum: [up, connecting, down, unknown]
          description: >-
            The tunnel's state as Linx's WireGuard service last reported it: `down` after 3 minutes with no handshake
            (its phone lines are then down too, and the "WireGuard tunnel is down" alert goes out while a line uses it).
        status_detail:
          type: string
          description: Why, in plain words.
        status_since:
          type: string
          format: date-time
        last_handshake_at:
          type: string
          format: date-time
        notes:
          type: array
          items:
            type: string
          description: Said once, when the profile is created (e.g. an imported AllowedIPs narrowed to the phone lines' addresses).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    WireguardProfileCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        config:
          type: string
          description: A whole wg-quick configuration file ([Interface] and [Peer]); takes priority over the fields below.
        private_key:
          type: string
          description: Base64, 32 bytes. Write-only; never returned.
        address:
          type: string
        peer_public_key:
          type: string
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
          description: Defaults to 51820.
        preshared_key:
          type: string
          description: Base64, 32 bytes. Write-only; never returned.
        persistent_keepalive:
          type: integer

    WireguardProfilePatch:
      description: JSON Merge Patch of the profile's non-secret fields; reissue it (delete and re-create) to change its keys.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        peer_endpoint_host:
          type: string
        peer_endpoint_port:
          type: integer
        persistent_keepalive:
          type: integer

    WireguardProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WireguardProfile"
        next_cursor:
          type: string

    CallPermissionLevel:
      description: Who a group of extensions may call out to (docs/TRUNKS.md §5).
      type: object
      required: [id, name, allowed_categories, withhold_caller_id, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean
          description: Send "withheld" instead of a caller ID, if the trunk's provider supports it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    CallPermissionLevelCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean
          description: Defaults to false.

    CallPermissionLevelPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        allowed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategory"
        withhold_caller_id:
          type: boolean

    CallPermissionLevelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CallPermissionLevel"
        next_cursor:
          type: string

    Destination:
      description: >-
        Where a call goes (ADR-068): an extension, a ring group, a
        voicemail box (ADR-069: `extension_id` for a person's,
        `ring_group_id` for a group's; on a ring group's own
        `if_no_answer`, neither means its own), or a message and hang up
        (`not-available`, or `closed`: "We're closed"). A voicemail box
        reached outside office hours or on a holiday plays the "we're
        closed" greeting; one that's turned off, or whose person is gone,
        plays "not available".
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [extension, ring_group, voicemail, message]
        extension_id:
          type: string
          format: uuid
        ring_group_id:
          type: string
          format: uuid
        message:
          type: string
          enum: [not-available, closed]
        label:
          type: string
          readOnly: true
          description: The destination in a few words ("Sara Haddad (101)", "Sales").

    Span:
      description: Open from `opens` to `closes` on one weekday, in the server's time zone.
      type: object
      additionalProperties: false
      required: [weekday, opens, closes]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 Sunday … 6 Saturday.
        opens:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        closes:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          description: After `opens`; 24:00 is midnight at the day's end.

    Holiday:
      description: Closed all day, from `first_day` to `last_day`.
      type: object
      additionalProperties: false
      required: [name, first_day, last_day]
      properties:
        name:
          type: string
          maxLength: 60
        first_day:
          type: string
          format: date
        last_day:
          type: string
          format: date
        every_year:
          type: boolean
          description: The same dates every year (a fixed holiday; Eid moves, so not for it).

    Schedule:
      type: object
      required: [id, name, spans, holidays, words, now, used_by, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
        words:
          type: string
          description: The hours in a few words ("Mon–Fri 08:00–17:00").
        now:
          type: object
          required: [open]
          description: The same answer a call gets right now.
          properties:
            open:
              type: boolean
            holiday:
              type: string
              description: The holiday closing it today.
            changes_at:
              type: string
              format: date-time
              description: When it next opens or closes (absent if not within a month).
        used_by:
          type: array
          description: The numbers and lines whose "When someone calls" uses it.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string

    ScheduleList:
      type: object
      required: [time_zone, items]
      properties:
        time_zone:
          type: string
          description: The server's time zone, which every schedule is in ("Asia/Dubai").
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        spans:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Span"
        holidays:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Holiday"

    SchedulePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        spans:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Span"
        holidays:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Holiday"

    Incoming:
      description: >-
        "When someone calls" one number (`kind` number) or a line's calls
        for none of its numbers (`kind` line).
      type: object
      required: [id, kind, line_id, line_name, line_kind, if_no_answer_seconds, if_no_answer, after_hours, just_ring, words, etag]
      properties:
        id:
          type: string
          format: uuid
          description: The number's id, or the line's.
        kind:
          type: string
          enum: [number, line]
        number:
          type: string
        label:
          type: string
        line_id:
          type: string
          format: uuid
        line_name:
          type: string
        line_kind:
          type: string
        rings:
          $ref: "#/components/schemas/Destination"
        if_no_answer_seconds:
          type: integer
          description: How long a person is rung (a ring group decides for itself).
        if_no_answer:
          $ref: "#/components/schemas/Destination"
        schedule_id:
          type: string
          format: uuid
          description: Absent means the same all the time.
        after_hours:
          $ref: "#/components/schemas/Destination"
        holidays:
          $ref: "#/components/schemas/Destination"
        just_ring:
          type: boolean
          description: Only who it rings is set (the quick change); everything else is the default.
        words:
          type: string
          description: What a caller gets, in plain sentences.
        etag:
          type: string

    IncomingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incoming"

    IncomingSet:
      type: object
      additionalProperties: false
      properties:
        rings:
          $ref: "#/components/schemas/Destination"
        just_ring:
          type: boolean
          description: >-
            Set only `rings`, all the time, and forget the rest: a person
            rings 30 seconds, then their voicemail.
        preview:
          type: boolean
          description: Check it and return it with its sentence, without saving (the wizard's live sentence).
        if_no_answer_seconds:
          type: integer
          minimum: 5
          maximum: 300
          description: Defaults to 25.
        if_no_answer:
          $ref: "#/components/schemas/Destination"
          description: Defaults to the voicemail of whoever `rings`.
        schedule_id:
          type: string
          format: uuid
          description: Leave out for the same all the time.
        after_hours:
          $ref: "#/components/schemas/Destination"
          description: >-
            Defaults to the voicemail of whoever `rings` (with the "we're
            closed" greeting), or "We're closed" when it rings nobody.
        holidays:
          $ref: "#/components/schemas/Destination"
          description: Leave out for the same as `after_hours`.

    RingGroupMember:
      type: object
      required: [extension_id, number, display_name, can_ring]
      properties:
        extension_id:
          type: string
          format: uuid
        number:
          type: string
        display_name:
          type: string
        can_ring:
          type: boolean
          description: A phone or browser of it is connected and its person isn't on Do not disturb.

    RingGroup:
      description: Several extensions rung for one call (docs/PHASE1F.md §6).
      type: object
      required: [id, name, strategy, ring_seconds, turn_seconds, members, if_no_answer, used_by, words, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: string
          description: Its own number, so people can dial it or transfer a call to it. Absent when it has none.
        strategy:
          type: string
          enum: [all, in_turn]
          description: All at once, or one after another in the members' order.
        ring_seconds:
          type: integer
          description: All at once, how long everyone rings before `if_no_answer`.
        turn_seconds:
          type: integer
          description: One after another, how long each person rings.
        members:
          type: array
          items:
            $ref: "#/components/schemas/RingGroupMember"
        if_no_answer:
          $ref: "#/components/schemas/Destination"
        used_by:
          type: array
          description: What sends calls here.
          items:
            type: object
            required: [kind, id, name, how]
            properties:
              kind:
                type: string
                enum: [ring_group, number, line]
              id:
                type: string
                format: uuid
              name:
                type: string
              how:
                type: string
                enum: [if_nobody_answers, rings, after_hours, holidays]
        words:
          type: string
          description: What a caller gets, in one plain sentence.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: Send as If-Match when changing it.

    RingGroupCreate:
      type: object
      additionalProperties: false
      required: [name, member_ids]
      properties:
        name:
          type: string
          maxLength: 60
        number:
          type: string
          description: Its own number (2 to 6 digits), not an extension's. Leave out for none.
        strategy:
          type: string
          enum: [all, in_turn]
          description: Defaults to all.
        ring_seconds:
          type: integer
          minimum: 5
          maximum: 300
          description: Defaults to 25.
        turn_seconds:
          type: integer
          minimum: 5
          maximum: 120
          description: Defaults to 15.
        member_ids:
          type: array
          description: Extensions, in the order "one after another" rings them.
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        if_no_answer:
          $ref: "#/components/schemas/Destination"

    RingGroupPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        number:
          type: string
          description: Empty removes it.
        strategy:
          type: string
          enum: [all, in_turn]
        ring_seconds:
          type: integer
          minimum: 5
          maximum: 300
        turn_seconds:
          type: integer
          minimum: 5
          maximum: 120
        member_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        if_no_answer:
          $ref: "#/components/schemas/Destination"

    RingGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RingGroup"

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        scope:
          type: string
          description: Space-separated scopes to narrow the token to; defaults to all the client holds.
        client_id:
          type: string
        client_secret:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds (900).
        scope:
          type: string

    OAuthError:
      description: RFC 6749 §5.2.
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_scope, unsupported_grant_type, server_error, temporarily_unavailable]
        error_description:
          type: string

    Problem:
      description: RFC 9457 `application/problem+json` (docs/API.md §2).
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          description: A URI identifying the problem type; `about:blank` when none is registered.
        title:
          type: string
          description: Short, human-readable summary of the status code.
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code, e.g. `scope_missing`.
        detail:
          type: string
          description: Plain-language explanation. Never a stack trace.
        instance:
          type: string

    SignIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    SessionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_verify_required, mfa_setup_required]
          description: >-
            `mfa_verify_required`: finish with one of `methods` (POST
            /session/mfa with an authenticator or recovery code, or
            /session/mfa/passkey). `mfa_setup_required`: an admin must add a
            passkey (/me/passkeys) or an authenticator app (/me/mfa), or
            choose a password only (/me/password-only), before doing anything
            else.
        methods:
          type: array
          items:
            type: string
            enum: [authenticator, passkey, recovery_code]
          description: What can finish a `mfa_verify_required` sign-in.
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once, when a passkey set up through a setup link is the account's first second step.

    SetupLinkInfo:
      type: object
      required: [email, name, role, has_second_step, passkeys_available]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        has_second_step:
          type: boolean
          description: >-
            The account already has a passkey or authenticator app: the
            link only sets a new password, and the second step is still
            asked for.
        passkeys_available:
          type: boolean
          description: False when the server has no domain set (passkeys need one).

    PasskeyAnswer:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON().

    PasskeyNew:
      type: object
      additionalProperties: false
      required: [name, credential]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: e.g. "Mohammed's iPhone".
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON().

    Passkey:
      type: object
      required: [id, name, synced, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        synced:
          type: boolean
          description: Backed up to the device maker's cloud (e.g. iCloud Keychain) when last used.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    CompanyButton:
      description: A company sign-in provider a person can use.
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
          description: Shown as "Continue with <name>".

    SignInOptions:
      type: object
      required: [company, company_sign_in_required, passkeys_available, password_reset]
      properties:
        company:
          type: array
          items:
            $ref: "#/components/schemas/CompanyButton"
          description: The company sign-in buttons, in order.
        company_sign_in_required:
          type: boolean
          description: Passwords are off for everyone but system admins.
        passkeys_available:
          type: boolean
        passkeys_moved:
          type: boolean
          description: >-
            This server was restored from a backup made at another domain:
            passkeys from the old address don't work here (docs/INSTALL.md §8).
        password_reset:
          type: boolean
          description: >-
            Email is set up, so the page offers "Forgot your password?"
            (ADR-067).

    ResetLinkInfo:
      type: object
      required: [email, methods]
      properties:
        email:
          type: string
        methods:
          type: array
          items:
            type: string
            enum: [authenticator, passkey, recovery_code]
          description: What finishes the reset; empty for an account with no second step.

    HelpGuideList:
      type: object
      required: [guides]
      properties:
        answers_by:
          type: string
          description: >-
            Who writes answers ("Anthropic (Claude)", "Ollama", or an
            OpenAI-compatible service's host name), when written answers are
            turned on and the caller is signed in; absent otherwise.
        guides:
          type: array
          items:
            $ref: "#/components/schemas/HelpGuideSummary"

    HelpAnswers:
      type: object
      required: [enabled, provider, base_url, model, api_key_set, person_daily_limit, server_daily_limit, used_today, etag]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [anthropic, openai, ollama]
        base_url:
          type: string
          description: Empty for Anthropic (its address is fixed).
        model:
          type: string
        api_key_set:
          type: boolean
        person_daily_limit:
          type: integer
        server_daily_limit:
          type: integer
        used_today:
          type: integer
          description: Questions asked today (UTC) on this server.
        etag:
          type: string

    HelpAnswersPatch:
      description: JSON Merge Patch; fields not sent stay as they are. An empty api_key removes it.
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [anthropic, openai, ollama]
        base_url:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 100
        api_key:
          type: string
          maxLength: 1000
        person_daily_limit:
          type: integer
          minimum: 1
          maximum: 10000
        server_daily_limit:
          type: integer
          minimum: 1
          maximum: 100000

    HelpAnswersTest:
      type: object
      required: [question, ok, by, guides]
      properties:
        question:
          type: string
        ok:
          type: boolean
        answer:
          type: string
        error:
          type: string
          description: Why there's no answer, in plain words, when ok is false.
        by:
          type: string
        guides:
          type: array
          items:
            $ref: "#/components/schemas/HelpGuideRef"

    HelpGuideRef:
      type: object
      required: [name, title]
      properties:
        name:
          type: string
        title:
          type: string

    Email:
      type: object
      required: [enabled, preset, host, port, security, username, from_address, from_name, password_set, hourly_limit, etag, status]
      properties:
        enabled:
          type: boolean
        preset:
          type: string
          description: Who sends it (web/src/lib/email-presets.json).
        host:
          type: string
        port:
          type: integer
        security:
          type: string
          enum: [tls, starttls]
          description: TLS from the start, or STARTTLS. There is no plain choice.
        username:
          type: string
        from_address:
          type: string
        from_name:
          type: string
        password_set:
          type: boolean
        hourly_limit:
          type: integer
        arrived_at:
          type: string
          format: date-time
          description: When a system admin said the test email arrived; absent until then.
        etag:
          type: string
        status:
          type: object
          required: [sent_last_hour, waiting, last_error]
          properties:
            last_sent_at:
              type: string
              format: date-time
            sent_last_hour:
              type: integer
            waiting:
              type: integer
            last_error:
              type: string
              description: The newest failure still waiting, or of the last day with nothing sent since; empty when there's none.

    EmailPatch:
      description: JSON Merge Patch; fields not sent stay as they are. An empty password removes it.
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        preset:
          type: string
          maxLength: 30
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          type: string
          enum: [tls, starttls]
        username:
          type: string
          maxLength: 254
        from_address:
          type: string
          maxLength: 254
        from_name:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 500
        hourly_limit:
          type: integer
          minimum: 1
          maximum: 1000
        arrived:
          type: boolean
          description: The test email arrived (true), or didn't (false).

    EmailTest:
      type: object
      required: [to, ok, passed]
      properties:
        to:
          type: string
        ok:
          type: boolean
        passed:
          type: array
          description: The stages passed, in order.
          items:
            type: string
            enum: [connect, encrypt, certificate, sign_in, send]
        stage:
          type: string
          enum: [connect, encrypt, certificate, sign_in, send]
          description: Where it stopped, when ok is false.
        error:
          type: string
          description: Why, in plain words, with what the mail server said.
        blocked_host:
          type: string
          description: The server is on a private network an admin may allow (the outbound allowlist).

    HelpGuideSummary:
      type: object
      required: [name, title, section, screens]
      properties:
        name:
          type: string
        title:
          type: string
        section:
          type: string
          enum: [whats-new, install, everyday, admin, running]
        screens:
          type: array
          items:
            type: string
          description: The app's addresses this guide is about.

    HelpGuide:
      type: object
      required: [name, title, section, blocks]
      properties:
        name:
          type: string
        title:
          type: string
        section:
          type: string
          enum: [whats-new, install, everyday, admin, running]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/HelpBlock"

    HelpBlock:
      type: object
      required: [type]
      description: >-
        A heading (`level` 1 to 3, `text`, `anchor`), paragraph (`inlines`),
        list (`items`, `ordered`, `start`), code block (`text`) or picture
        (`picture`, the name of a light and a dark screenshot, and `alt`).
      properties:
        type:
          type: string
          enum: [heading, paragraph, list, code, picture]
        level:
          type: integer
        anchor:
          type: string
        text:
          type: string
        inlines:
          type: array
          items:
            $ref: "#/components/schemas/HelpInline"
        ordered:
          type: boolean
        start:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/HelpListItem"
        picture:
          type: string
        alt:
          type: string

    HelpListItem:
      type: object
      required: [inlines]
      properties:
        inlines:
          type: array
          items:
            $ref: "#/components/schemas/HelpInline"
        list:
          $ref: "#/components/schemas/HelpBlock"

    HelpInline:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text, bold, italic, code, link]
        text:
          type: string
        guide:
          type: string
          description: A link's guide; empty for a heading in the same guide.
        anchor:
          type: string

    HelpSearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/HelpSearchResult"

    HelpSearchResult:
      type: object
      required: [guide, title, lines]
      properties:
        guide:
          type: string
        title:
          type: string
        heading:
          type: string
          description: The section's heading; none for the guide's opening part.
        anchor:
          type: string
        lines:
          type: array
          items:
            type: string
          description: The section's lines with the most of the question's words.

    CompanyStart:
      type: object
      additionalProperties: false
      required: [provider_id]
      properties:
        provider_id:
          type: string
          format: uuid

    CompanyRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The provider's sign-in page. Send the browser there (a full navigation).

    CompanyLink:
      description: A person's company account.
      type: object
      required: [id, provider_id, provider_name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        email:
          type: string
          description: The email the provider vouched for when it was linked.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    CompanyLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyLink"

    MyCompanyAccounts:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyLink"
        available:
          type: array
          items:
            $ref: "#/components/schemas/CompanyButton"
          description: The enabled providers an account can be linked on.

    SsoProviderKind:
      type: string
      enum: [google, microsoft, authentik, keycloak, oidc]
      description: >-
        The template it was made from. Decides how a verified email is read
        (Microsoft: `xms_edov` with `email`, or `upn`; everyone else:
        `email_verified`).

    SsoProvider:
      type: object
      required: [id, kind, name, issuer, client_id, client_secret_set, enabled, shown, position, redirect_uri, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        client_secret_set:
          type: boolean
          description: The secret itself is never shown again.
        enabled:
          type: boolean
          description: Usable at all (sign in, link, confirm).
        shown:
          type: boolean
          description: Its button is on the sign-in page.
        position:
          type: integer
          description: Buttons are shown lowest first.
        redirect_uri:
          type: string
          description: The address to register at the provider.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string

    SsoProviderList:
      type: object
      required: [items, redirect_uri]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SsoProvider"
        redirect_uri:
          type: string
          description: The address to register at every provider ("" when company sign-in is off).

    SsoProviderNew:
      type: object
      additionalProperties: false
      required: [kind, client_id]
      properties:
        kind:
          $ref: "#/components/schemas/SsoProviderKind"
        name:
          type: string
          maxLength: 60
          description: Defaults to the kind's name; required for `oidc`.
        issuer:
          type: string
          description: >-
            e.g. https://login.microsoftonline.com/<tenant ID>/v2.0. Google's
            is filled in. Linx reads its discovery document before saving.
        client_id:
          type: string
        client_secret:
          type: string
        enabled:
          type: boolean
        shown:
          type: boolean
        position:
          type: integer

    SsoProviderPatch:
      description: JSON Merge Patch; fields not sent stay as they are. An empty client_secret removes it.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        enabled:
          type: boolean
        shown:
          type: boolean
        position:
          type: integer

    PasskeyAdded:
      type: object
      required: [passkey]
      properties:
        passkey:
          $ref: "#/components/schemas/Passkey"
        recovery_codes:
          type: array
          items:
            type: string

    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A 6-digit authenticator code, or a recovery code.

    NumberingRange:
      type: object
      additionalProperties: false
      required: [kind, from, to]
      properties:
        kind:
          type: string
          enum: [people, groups, reserved]
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0

    Settings:
      type: object
      required: [country, extension_digits, extension_ranges, site_kind, simple_mode, admin_network_restricted, admin_networks, setup_step]
      properties:
        country:
          type: string
          description: ISO 3166 code (docs/TRUNKS.md §5).
        extension_digits:
          type: integer
          minimum: 2
          maximum: 6
        extension_ranges:
          type: array
          items:
            $ref: "#/components/schemas/NumberingRange"
        site_kind:
          type: string
          enum: ["", home, business]
        simple_mode:
          type: boolean
        admin_network_restricted:
          type: boolean
          description: >-
            "Only from my home/office network" (docs/ADMIN.md §3); false
            (the default) is "anywhere, with a second step".
        admin_networks:
          type: array
          items:
            type: string
          description: Addresses or networks admins may sign in from when admin_network_restricted is true.
        default_call_permission_level_id:
          type: string
          format: uuid
          description: >-
            The "Everyone" level new extensions get by default, once the
            setup wizard (or an admin) has set one.
        setup_step:
          type: integer
        setup_completed_at:
          type: string
          format: date-time
        company_sign_in_required:
          type: boolean
          description: >-
            "People must use company sign-in" (docs/ADMIN.md §6): passwords
            stop working for everyone except system admins. Passkeys keep
            working.

    SettingsPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        extension_digits:
          type: integer
          minimum: 2
          maximum: 6
        extension_ranges:
          type: array
          items:
            $ref: "#/components/schemas/NumberingRange"
        site_kind:
          type: string
          enum: ["", home, business]
        simple_mode:
          type: boolean
        admin_network_restricted:
          type: boolean
        admin_networks:
          type: array
          items:
            type: string
        company_sign_in_required:
          type: boolean
          description: Also needs sso:write, and a fresh "confirm it's you".

    SetupProgress:
      type: object
      required: [step, completed]
      properties:
        step:
          type: integer
        completed:
          type: boolean
        completed_at:
          type: string
          format: date-time

    AuditLogEntry:
      type: object
      required: [id, at, actor, action, result]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: string
        ip:
          type: string
        action:
          type: string
        target:
          type: string
        result:
          type: string
          enum: [ok, denied, failed]
        detail:
          type: object
          additionalProperties: true

    AuditLogEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        next_cursor:
          type: string

    BackupSettings:
      type: object
      required: [frequency, time_of_day, day_of_week, day_of_month]
      properties:
        frequency:
          type: string
          enum: [off, daily, weekly, monthly]
        time_of_day:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes since midnight, server-local time.
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 (Sunday) to 6 (Saturday); used only when frequency is weekly.
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
          description: Used only when frequency is monthly.
        requested_at:
          type: string
          format: date-time
          description: Set while a "back up now" request is waiting for linx-backup-agent's next tick.

    BackupSettingsPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        frequency:
          type: string
          enum: [off, daily, weekly, monthly]
        time_of_day:
          type: integer
          minimum: 0
          maximum: 1439
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28

    BackupRunDestination:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
        ok:
          type: boolean
        snapshot_id:
          type: string
        size:
          type: integer
          format: int64
          description: Bytes backed up (the database and the keys), before compression.
        error:
          type: string

    BackupRun:
      type: object
      required: [id, trigger, started_at, finished_at, status, destinations]
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [manual, scheduled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, partial, failure]
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/BackupRunDestination"
        error:
          type: string

    BackupRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupRun"
        next_cursor:
          type: string

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [source, location, password]
      properties:
        source:
          type: string
          enum: [folder, destination, upload]
          description: folder, a backup folder on the server; destination, one set up there with `linx backup destination add`; upload, a backup file sent with `PUT /backup-restore/file`.
        location:
          type: string
          maxLength: 4096
          description: The folder's full path (starting with /), the destination's name, or the upload_id.
        snapshot:
          type: string
          maxLength: 64
          description: '"latest" (the default) or a backup id.'
        password:
          type: string
          maxLength: 1024
          description: The backup's password (shown once when its destination was set up).

    RestoreStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, running, failed]
        source:
          type: string
          enum: [folder, destination, upload]
        location:
          type: string
        snapshot:
          type: string
        error:
          type: string
        requested_at:
          type: string
          format: date-time

    RestoreUpload:
      type: object
      required: [upload_id, size]
      properties:
        upload_id:
          type: string
        size:
          type: integer
          format: int64

    BackupDownload:
      type: object
      required: [status, mine]
      properties:
        status:
          type: string
          enum: [none, pending, preparing, ready, failed]
        mine:
          type: boolean
          description: Whether the caller asked for it (only they may fetch the file and its password).
        error:
          type: string
        size:
          type: integer
          format: int64
        snapshot_time:
          type: string
          format: date-time
          description: When the newest backup in the file was made.
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    BackupPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string

    ReachCheck:
      type: object
      required: [lines, checked_at]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [state, text]
            properties:
              state:
                type: string
                enum: [ok, fail, warn, info]
              text:
                type: string
              meaning:
                type: string
                description: What a failure means for people, in one sentence.
              fix:
                type: string
                enum: [records, steps, router]
                description: Which fix helps.
        checked_at:
          type: string
          format: date-time

    DnsRecords:
      type: object
      required: [domain, zone, name_servers, company, records, checked_at]
      properties:
        domain:
          type: string
        zone:
          type: string
          description: Where the records live ("example.com" for "pbx.example.com"); empty when its name servers couldn't be found.
        name_servers:
          type: array
          items:
            type: string
        company:
          type: string
          description: The DNS company the name servers belong to; empty when Linx doesn't know it.
        records:
          type: array
          items:
            type: object
            required: [use, name, type, value, state, seen, kept]
            properties:
              use:
                type: string
                enum: [web, turn, sip]
                description: "web: the web app and sign-in; turn: call audio through firewalls; sip: desk phones and phone systems at home."
              name:
                type: string
              type:
                type: string
                enum: [A]
              value:
                type: string
                description: The address it should point at; empty when this network's public address couldn't be found.
              state:
                type: string
                enum: [ok, wrong, missing, error, unknown]
              seen:
                type: array
                items:
                  type: string
                description: What the domain's name servers answer now.
              kept:
                type: boolean
                description: Linx keeps this record right itself (a DNS token).
        automatic:
          type: object
          description: How Linx keeps the records right itself, when it does (a DNS key, not stopped).
          required: [company, address, previous]
          properties:
            company:
              type: string
              description: The DNS company's name, as Linx was set up with it ("Porkbun").
            address:
              type: string
              description: The address the records last pointed at; empty before the first time.
            previous:
              type: string
              description: The one before it; empty when it hasn't changed.
            changed_at:
              type: string
              format: date-time
              description: When the address last changed.
            checked_at:
              type: string
              format: date-time
              description: When the records were last written or confirmed.
            error:
              type: string
              description: Why the last try failed, in the DNS company's own words; empty when it worked.
        checked_at:
          type: string
          format: date-time

    ReachLink:
      type: object
      required: [id, url, state, expires_at, version]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        state:
          type: string
          enum: [waiting, reached, expired]
        expires_at:
          type: string
          format: date-time
        address:
          type: string
          description: The address Linx saw the phone come from.
        seen:
          type: string
          enum: [outside, home, local, proxy]
          description: >-
            outside: from outside, it works; home: this network's own
            public address (Wi-Fi still on?); local: a home-network address
            (Wi-Fi on); proxy: the front door's own address (it doesn't
            tell Linx who's visiting).
        relay:
          type: object
          required: [ok]
          properties:
            ok:
              type: boolean
            detail:
              type: string
        version:
          type: integer

    ReachClaim:
      type: object
      required: [domain, address, turn]
      properties:
        domain:
          type: string
        address:
          type: string
        turn:
          type: object
          required: [urls, username, credential]
          properties:
            urls:
              type: array
              items:
                type: string
            username:
              type: string
            credential:
              type: string

    SystemStatus:
      type: object
      required: [services, helper, containers, open_alerts, trunks, wireguard_profiles]
      properties:
        helper:
          type: object
          description: >-
            The server helper (linx-ops-agent): connected, and when it last
            checked the services. Not connected: `containers` is empty or
            old, and logs and Restart aren't available.
          required: [connected]
          properties:
            connected:
              type: boolean
            checked_at:
              type: string
              format: date-time
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
        certificate:
          type: object
          description: The certificate linx-certd last reported (absent before the first).
          required: [expires_at]
          properties:
            expires_at:
              type: string
              format: date-time
        services:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, down]
        open_alerts:
          type: array
          items:
            type: object
            required: [severity, title, message, since]
            properties:
              severity:
                type: string
                enum: [warning, critical]
              title:
                type: string
              message:
                type: string
              since:
                type: string
                format: date-time
        trunks:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string
              status_since:
                type: string
                format: date-time
        wireguard_profiles:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string

    ServiceHealth:
      type: object
      required: [service, label, state, restarts, can_restart, optional]
      properties:
        service:
          type: string
        label:
          type: string
          description: Its plain name ("Phone system").
        state:
          type: string
          enum: [running, starting, unhealthy, restarting, stopped, missing]
        started_at:
          type: string
          format: date-time
        restarts:
          type: integer
          description: How many times Docker has restarted it by itself since it was created.
        can_restart:
          type: boolean
        optional:
          type: boolean
          description: Only some installs run it; `missing` is then fine.

    ServiceLog:
      type: object
      required: [service, lines]
      properties:
        service:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [text]
            properties:
              time:
                type: string
                format: date-time
              text:
                type: string

    ServerSettings:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: Setup on the server has the page open (`sudo linx setup`, four hours).
        settings:
          $ref: "#/components/schemas/ServerSettingsView"

    ServerSettingsView:
      type: object
      required: [where, front_door, front_doors, domain, provider, token_saved, profile, profiles, portainer, portainer_allowed, apply, steps, keep, expires_at, repair, no_sign_in]
      properties:
        where:
          type: string
          enum: [home, rented]
        front_door:
          type: string
        proxy_address:
          type: string
          description: The front door's address, for Pangolin, nginx and Caddy.
        turn_udp_port:
          type: integer
          description: The call relay's UDP port on the router, when it isn't 443.
        public_port:
          type: integer
          description: For `public-port`, the public port browsers use (docs/SIMPLER.md §2.5).
        door_setup:
          description: What the front door in use needs (Show the steps), as "Before you apply" shows it for a new one.
          type: object
          required: [files, steps]
          properties:
            files:
              type: array
              items:
                type: object
                required: [title, text]
                properties:
                  title:
                    type: string
                  path:
                    type: string
                  text:
                    type: string
            steps:
              type: array
              items:
                type: string
            card:
              $ref: "#/components/schemas/FrontDoorCard"
        address:
          type: string
          description: Linx's web address now, https://<domain> with the public port unless it's 443.
        front_doors:
          type: array
          description: The front doors this server may use.
          items:
            type: string
        public_address:
          type: string
        lan_address:
          type: string
        problem:
          type: string
          description: Why the web address didn't answer when setup checked it.
        repair:
          type: boolean
          description: The page is also open on port 6464 (the web address is broken, docs/INSTALL.md §7).
        no_sign_in:
          type: boolean
          description: The repair link skips the sign-in.
        domain:
          type: string
        provider:
          type: string
        token_saved:
          type: boolean
        dns_by_hand:
          type: boolean
          description: There's a DNS key, but the owner keeps the records (Linx was told to stop).
        profile:
          type: string
        profiles:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name:
                type: string
              description:
                type: string
        profile_pick:
          type: string
        profile_reason:
          type: string
        portainer:
          type: boolean
        portainer_allowed:
          type: boolean
        apply:
          type: object
          description: "The last change: empty (none yet), running, ok or failed."
          required: [state]
          properties:
            state:
              type: string
            detail:
              type: string
        steps:
          type: array
          items:
            type: object
            required: [title, state]
            properties:
              title:
                type: string
              state:
                type: string
              detail:
                type: string
        keep:
          type: array
          description: What to write down now (Portainer's password when it's turned on), until the page closes.
          items:
            type: object
            required: [title, value]
            properties:
              title:
                type: string
              value:
                type: string
              note:
                type: string
        expires_at:
          type: string
          format: date-time

    ServerSettingsChange:
      type: object
      required: [profile, portainer]
      additionalProperties: false
      properties:
        profile:
          type: string
          enum: [lite, standard, performance]
        portainer:
          type: boolean
        token:
          type: string
          maxLength: 1000
          description: A new DNS token for the DNS company there is (left out keeps the one there is, or none). `dns_key` is the newer form.
        dns_key:
          $ref: "#/components/schemas/DnsKey"
        dns_by_hand:
          type: boolean
          description: "true: Linx stops keeping the DNS records right (they stay as they are; the key still gets the certificate). false: it starts again."
        domain:
          type: string
          maxLength: 253
          description: A new domain (left out keeps it).
        front_door:
          type: string
          enum: [linx-443, proxy, home-only, public-port, http-proxy]
          description: A new front door (left out keeps it). `proxy` is another program passing Linx through by name (Pangolin, nginx, HAProxy, Caddy, ...); `public-port` Linx on another public port (advanced, `public_port`); `http-proxy` a proxy that decrypts (advanced, home only).
        proxy_address:
          type: string
          maxLength: 253
        turn_udp_port:
          type: integer
          minimum: 0
          maximum: 65535
        public_port:
          type: integer
          minimum: 0
          maximum: 65535
          description: For `public-port`, the public port browsers use, like 8443.
        door_done:
          type: boolean
          description: The front door's steps (the preview's `setup`) are done.

    DnsKey:
      type: object
      description: A DNS company's key, as its form asks for it (docs/ui/SCREENS_PHASE1F.md §3.2).
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [cloudflare, duckdns, route53, godaddy, namecheap, porkbun, digitalocean, hetzner, desec, ovh]
        token:
          type: string
          maxLength: 1000
          description: The key when the company asks for one thing (its form's one field).
        key:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
            maxLength: 300
          description: The form's fields by their key (web/src/lib/dns-companies.json).

    ServerSettingsPreview:
      type: object
      required: [errors, add_records, warnings, steps, address]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ServerSettingsFieldError"
        add_records:
          type: array
          description: DNS records to add by hand first (no DNS token).
          items:
            type: object
            required: [type, name, value]
            properties:
              type:
                type: string
              name:
                type: string
              value:
                type: string
        setup:
          type: object
          description: The front door's own steps, to do first.
          required: [files, steps]
          properties:
            files:
              type: array
              items:
                type: object
                required: [title, text]
                properties:
                  title:
                    type: string
                  path:
                    type: string
                  text:
                    type: string
            steps:
              type: array
              items:
                type: string
            card:
              $ref: "#/components/schemas/FrontDoorCard"
        warnings:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        address:
          type: string
          description: The web address after the change.

    FrontDoorCard:
      type: object
      description: >-
        What a front door that passes Linx through does (the names, where each
        goes, which gets a PROXY v2 header) and how to do it in each product.
      required: [routes, proxy, guides]
      properties:
        routes:
          type: array
          items:
            type: object
            required: [name, address, proxy_protocol]
            properties:
              name:
                type: string
              address:
                type: string
              proxy_protocol:
                type: boolean
        proxy:
          type: string
          description: The front door's address, the only one Linx accepts PROXY headers from.
        pick:
          type: string
          description: The guide to show first.
        guides:
          type: array
          items:
            type: object
            required: [id, title, steps]
            properties:
              id:
                type: string
              title:
                type: string
              note:
                type: string
              steps:
                type: array
                items:
                  type: string
              files:
                type: array
                items:
                  type: object
                  required: [title, text]
                  properties:
                    title:
                      type: string
                    path:
                      type: string
                    text:
                      type: string

    MovedChecklistState:
      type: object
      properties:
        checklist:
          $ref: "#/components/schemas/MovedChecklist"

    MovedChecklist:
      type: object
      required: [detected_at, before, after, items]
      properties:
        detected_at:
          type: string
          format: date-time
        before:
          $ref: "#/components/schemas/InstallPlace"
        after:
          $ref: "#/components/schemas/InstallPlace"
        items:
          type: array
          items:
            type: object
            required: [id, title, why, done]
            properties:
              id:
                type: string
              title:
                type: string
              why:
                type: string
              link:
                type: string
                enum: [phone_lines, extensions, settings, account, backups]
              done:
                type: boolean
              auto:
                type: boolean
                description: It ticks itself.
        hidden_until:
          type: string
          format: date-time
          description: Folded to one line until then.

    InstallPlace:
      type: object
      required: [domain, lan_networks, lan_address, public_address, front_door]
      properties:
        domain:
          type: string
        lan_networks:
          type: array
          items:
            type: string
        lan_address:
          type: string
        public_address:
          type: string
        front_door:
          type: string

    MovedChecklistChange:
      type: object
      additionalProperties: false
      properties:
        ticks:
          type: object
          maxProperties: 50
          additionalProperties:
            type: boolean
        hide:
          type: boolean

    ServerSettingsFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ServiceRestart:
      type: object
      required: [service, result]
      properties:
        service:
          type: string
        result:
          type: string
          enum: [restarted, restarting]

    User:
      type: object
      required: [id, email, name, role, mfa_enabled, disabled, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        extension_id:
          type: string
          format: uuid
        mfa_enabled:
          type: boolean
        passkeys:
          type: integer
        has_password:
          type: boolean
        password_only:
          type: boolean
          description: No passkey and no authenticator app ("Password only ⚠" for an admin).
        company_sign_in:
          type: array
          items:
            type: string
          description: The company sign-in providers they've linked an account on (their names).
        disabled:
          type: boolean
        locked:
          type: boolean
          description: Too many wrong passwords; waiting out the lockout (`linx user unlock`, or POST .../unlock).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: For If-Match.

    UserCreate:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
          description: Can't exceed the caller's own role.
        extension_id:
          type: string
          format: uuid
        send_email:
          type: boolean
          description: Also email the link to the person (email must be on, ADR-066).

    UserPatch:
      description: JSON Merge Patch; fields not sent stay as they are.
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 200
          description: >-
            A new sign-in email. A session must have confirmed it's you
            (403 `confirm_required`); 409 `email_taken` if someone else has
            it. Drops the person's company-account links (each was allowed
            for the old address).
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        extension_id:
          type: string
          format: uuid
        disabled:
          type: boolean

    UserCreated:
      type: object
      required: [user, setup_link_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        setup_link_token:
          type: string
          description: Shown once; build the link as https://<domain>/setup/<token>.
        email:
          $ref: "#/components/schemas/InviteEmail"

    InviteEmail:
      description: The link sent by email, when send_email was asked for.
      type: object
      required: [to, queued]
      properties:
        to:
          type: string
        queued:
          type: boolean
          description: Waiting to go out (the Email card shows whether it went).
        error:
          type: string
          description: Why it wasn't queued (email off, say), in plain words.

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string

    SetupLinkIssued:
      type: object
      required: [setup_link_token]
      properties:
        setup_link_token:
          type: string
          description: Shown once; build the link as https://<domain>/setup/<token>.
        email:
          $ref: "#/components/schemas/InviteEmail"

    MySession:
      type: object
      required: [id, current, user_agent, created_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: This browser.
        user_agent:
          type: string
          description: What the browser said it was, when it signed in.
        ip:
          type: string
          description: Where it was last used from.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    MySessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MySession"

    PasswordChange:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          type: string
          description: >-
            Required when the account has a password. A passkey-only account
            adding its first password leaves it out and needs "confirm it's
            you" instead.
        new_password:
          type: string
          description: At least 12 characters.

    MfaEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32, for typing in by hand if the QR code can't be scanned.
        otpauth_url:
          type: string
          description: otpauth://totp/... — encode this as a QR code.

    WebPhone:
      description: A browser session's phone line (docs/WEB.md §5).
      type: object
      required: [device_id, sip_username, password, sip_uri, websocket_path, display_name, extension, turn]
      properties:
        device_id:
          type: string
          format: uuid
        sip_username:
          type: string
          description: The line's SIP username (also its digest authentication username).
        password:
          type: string
          description: Shown once. Keep it in the page's memory only, never in storage.
        sip_uri:
          type: string
          description: e.g. "sip:d_Ab12Cd34@sip.example.com".
        websocket_path:
          type: string
          const: /sip
          description: Open wss://<this page's own host>/sip with subprotocol "sip".
        display_name:
          type: string
        extension:
          type: string
          description: The extension number this line answers for, e.g. "101".
        turn:
          $ref: "#/components/schemas/TurnCredentials"

    Presence:
      description: A person's chosen status. `dnd` (Do not disturb) also stops their extension ringing.
      type: string
      enum: [available, away, dnd]

    TeamMember:
      type: object
      required: [extension, name, status]
      properties:
        extension:
          type: string
          description: The extension number, e.g. "101".
        name:
          type: string
          description: The person on this extension, or the extension's own name when nobody is.
        status:
          type: string
          enum: [on_call, ringing, dnd, away, available, offline]
          description: >-
            What they're doing now: on a call or ringing beats their chosen
            status; `available` and `away` need a phone signed in, or it's
            `offline`.
        since:
          type: string
          format: date-time
          description: For `on_call` and `ringing`, when the call was answered or started ringing.

    VoicemailBox:
      type: object
      required: [id, kind, owner, mine, member, removed, enabled, email, messages, new, bytes]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [person, ring_group]
        extension_id:
          type: string
          format: uuid
        ring_group_id:
          type: string
          format: uuid
        owner:
          type: string
          description: '"Sara Haddad (101)", "Sales".'
        mine:
          type: boolean
          description: The signed-in person's own box.
        member:
          type: boolean
          description: A ring group's the signed-in person is in.
        removed:
          type: boolean
          description: The person was removed; the box stays until its messages expire.
        enabled:
          type: boolean
        email:
          type: boolean
          description: New messages are emailed to the person (never for a ring group).
        messages:
          type: integer
        new:
          type: integer
        bytes:
          type: integer
          format: int64

    VoicemailMessage:
      type: object
      required: [id, box_id, caller_number, caller_name, received_at, duration_ms, heard_by_me]
      properties:
        id:
          type: string
          format: uuid
        box_id:
          type: string
          format: uuid
        caller_number:
          type: string
          description: The caller's number, or the calling person's extension; "" when withheld.
        caller_name:
          type: string
          description: Plain text from the caller (show as text only), or the calling person's name.
        caller_extension_id:
          type: string
          format: uuid
          description: Set when a person called from their phone.
        received_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        heard_at:
          type: string
          format: date-time
        heard_by:
          type: string
          description: Who heard it first.
        heard_by_me:
          type: boolean

    VoicemailList:
      type: object
      required: [boxes, items, keep_days]
      properties:
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/VoicemailBox"
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoicemailMessage"
        keep_days:
          type: integer

    VoicemailGreeting:
      type: object
      required: [recorded, in_use]
      properties:
        recorded:
          type: boolean
          description: The box has its own recording (false - Linx's own only).
        in_use:
          type: boolean
          description: The recording plays (false - Linx's own plays).
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer

    VoicemailBoxSettings:
      type: object
      required: [box, greetings, email_ready, can_switch]
      properties:
        box:
          $ref: "#/components/schemas/VoicemailBox"
        greetings:
          type: object
          required: [unavailable, closed]
          properties:
            unavailable:
              $ref: "#/components/schemas/VoicemailGreeting"
            closed:
              $ref: "#/components/schemas/VoicemailGreeting"
        email_to:
          type: string
          description: Where messages are emailed (a person's box).
        email_ready:
          type: boolean
          description: Email is set up on this server.
        can_switch:
          type: boolean
          description: The signed-in person may turn the box on or off and change its emails.

    VoicemailBoxPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        email:
          type: boolean
        greetings:
          type: object
          additionalProperties: false
          properties:
            unavailable:
              type: string
              enum: [own, linx]
            closed:
              type: string
              enum: [own, linx]

    VoicemailSettings:
      type: object
      required: [keep_days, messages, bytes]
      properties:
        keep_days:
          type: integer
        messages:
          type: integer
        bytes:
          type: integer
          format: int64
          description: The space messages and greetings take in the database.

    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        voicemail:
          type: integer
          format: int64
          description: >-
            Live updates only: changes whenever a voicemail on this server
            arrives, is heard or is deleted; fetch GET /me/voicemail-count
            then.
        calls:
          type: integer
          format: int64
          description: >-
            Live updates only: changes whenever call history on this server
            changes (a call ended); fetch GET /me/missed-calls then.

    TurnCredentials:
      description: Credentials for Linx's relay, as an RTCIceServer (ADR-039).
      type: object
      required: [urls, username, credential, expires_at]
      properties:
        urls:
          type: array
          items:
            type: string
          description: e.g. ["turn:turn.example.com:443?transport=udp", "turns:turn.example.com:443?transport=tcp"].
        username:
          type: string
        credential:
          type: string
        expires_at:
          type: string
          format: date-time

    MfaConfirmed:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: 10 codes, shown once. Each works instead of an authenticator code, one time.
