            schema:
              $ref: "#/components/schemas/CallPermissionLevelCreate"
      responses:
        "201":
          description: The new level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/call-permission-levels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCallPermissionLevel
      summary: Get a call permission level
      tags: [trunks]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The level.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCallPermissionLevel
      summary: Change a call permission level
      description: >-
        JSON Merge Patch: only the fields sent change. Send `If-Match` with
        the level's `etag` to refuse the change (412) if someone else
        changed it first.
      tags: [trunks]
      security:
        - bearer: [routing:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CallPermissionLevelPatch"
      responses:
        "200":
          description: The level as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPermissionLevel"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCallPermissionLevel
      summary: Delete a call permission level
      description: Refused (409 `permission_level_in_use`) while an extension still has it assigned.
      tags: [trunks]
      security:
        - bearer: [routing:write]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/ring-groups:
    get:
      operationId: listRingGroups
      summary: List ring groups
      description: >-
        Every ring group, by name (ADR-068, docs/PHASE1F.md §6). Not
        paginated: a server has at most 200.
      tags: [routing]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The ring groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingGroupList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRingGroup
      summary: Add a ring group
      description: >-
        Not idempotent: retrying adds a second group (or fails on its name).
        Unanswered calls default to the group's own voicemail box (a
        `voicemail` destination with neither id).
      tags: [routing]
      security:
        - bearer: [routing:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RingGroupCreate"
      responses:
        "201":
          description: The new ring group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingGroup"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/ring-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRingGroup
      summary: Get a ring group
      tags: [routing]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The ring group.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingGroup"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRingGroup
      summary: Change a ring group
      description: >-
        JSON Merge Patch: only the fields sent change (`member_ids`
        replaces the whole list, in order). A `if_no_answer` that would
        bring calls back to this group is refused (422 `routing_loop`).
        Send `If-Match` with the group's `etag` to refuse the change (412)
        if someone else changed it first.
      tags: [routing]
      security:
        - bearer: [routing:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/RingGroupPatch"
      responses:
        "200":
          description: The ring group as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingGroup"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRingGroup
      summary: Remove a ring group
      description: >-
        Refused (409 `ring_group_in_use`) while something in `used_by` still
        sends calls here: point those somewhere else first.
      tags: [routing]
      security:
        - bearer: [routing:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/schedules:
    get:
      operationId: listSchedules
      summary: List office-hours schedules
      description: >-
        Every schedule, by name (docs/PHASE1F.md §7): "Office hours", made
        at setup for a business, and any more added. `now` is the same
        open/closed answer calls get. Not paginated: at most 20.
      tags: [routing]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSchedule
      summary: Add a schedule
      description: >-
        Without `spans`, Monday to Friday 08:00-17:00. Not idempotent:
        retrying fails on the name.
      tags: [routing]
      security:
        - bearer: [routing:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateSchedule
      summary: Change a schedule
      description: >-
        JSON Merge Patch: `spans` and `holidays` each replace the whole
        list. Send `If-Match` with the schedule's `etag` to refuse the
        change (412) if someone else changed it first.
      tags: [routing]
      security:
        - bearer: [routing:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SchedulePatch"
      responses:
        "200":
          description: The schedule as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSchedule
      summary: Remove a schedule
      description: >-
        Refused (409 `schedule_in_use`) while a number's "When someone
        calls" uses it.
      tags: [routing]
      security:
        - bearer: [routing:write]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/incoming:
    get:
      operationId: listIncoming
      summary: Where each number's calls go
      description: >-
        Every phone number, and every line's calls for none of its numbers,
        with its "When someone calls" (docs/PHASE1F.md §7) and the sentence
        saying what a caller gets. Not paginated.
      tags: [routing]
      security:
        - bearer: [routing:read]
      responses:
        "200":
          description: The numbers and lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/incoming/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setIncoming
      summary: Set where a number's calls go
      description: >-
        `id` is a phone number's (`kind` number) or a line's (`kind` line).
        Replaces the whole "When someone calls". `just_ring` sets only who
        it rings, all the time (the quick change). Send `If-Match` with its
        `etag` to refuse the change (412) if someone else changed it first.
      tags: [routing]
      security:
        - bearer: [routing:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingSet"
      responses:
        "200":
          description: As it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incoming"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/calls/active:
    get:
      operationId: listActiveCalls
      summary: Calls in progress
      description: >-
        Live, from the phone engine's own view of its calls (docs/PBX.md §4).
        Not paginated: a Linx server has at most a few dozen calls at once.
        `phone_engine_connected` false means the control plane can't see
        the phone engine right now, so the list may be out of date (calls
        themselves keep working).
      tags: [calls]
      security:
        - bearer: [calls:read]
      responses:
        "200":
          description: The calls in progress, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCallList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session:
    post:
      operationId: createSession
      summary: "Sign in (step 1: email and password)"
      description: >-
        Sets the __Host-linx_session and __Host-linx_csrf cookies
        (docs/WEB.md §4). Served by a hand-written handler (excluded from
        code generation): it needs to set two cookies, which a typed JSON
        response can't do.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: Signed in, or pending an authenticator code or first-run MFA enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Sign out
      description: >-
        Ends the caller's own session and clears its cookies. Served by a
        hand-written handler (excluded from code generation): it
        authenticates the session cookie itself, not through the bearer
        scheme this spec's operations otherwise declare.
      tags: [sessions]
      security: []
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/mfa:
    post:
      operationId: verifySessionMfa
      summary: "Sign in (step 2: authenticator code)"
      description: >-
        For a session still pending its authenticator code. A recovery code
        also works. Served by a hand-written handler (excluded from code
        generation).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCode"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/confirm:
    post:
      operationId: confirmSession
      summary: "\"Confirm it's you\""
      description: >-
        A fresh proof of identity for the most dangerous actions
        (docs/ADMIN.md §7), without ending this or any other session:
        password, plus the authenticator code if one is enrolled. After
        company sign-in (POST /session/confirm/company) answered
        `code_required`, send just the code. Good for 10 minutes. Served by a hand-written handler (excluded from code
        generation, like the other session endpoints).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                code:
                  type: string
                  description: The authenticator (or recovery) code, if one is enrolled.
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/setup-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: checkSetupLink
      summary: Check a set-password link before asking for a password
      description: >-
        200 with the link's person if it can still be used; 400
        `setup_link_invalid` if it was used, has expired or doesn't exist
        (the page then says so instead of showing the password form). A
        link that fails counts against the caller's address like a failed
        sign-in. Served by a hand-written handler (excluded from code
        generation).
      tags: [sessions]
      security: []
      responses:
        "200":
          description: The link can be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeSetupLink
      summary: Pick a password with a one-time set-password link
      description: >-
        Signs the person in at once (docs/WEB.md §4). Served by a
        hand-written handler (excluded from code generation).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  description: At least 12 characters.
                password_only:
                  type: boolean
                  description: >-
                    The "Password only" choice (docs/ADMIN.md §5): for an
                    admin, the "not recommended" warning was shown and
                    accepted, so no passkey or authenticator is asked for.
                    Refused (409 `second_step_exists`) for an account that
                    already has one.
      responses:
        "200":
          description: Signed in, or pending its second step (or that step's setup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List people
      tags: [people]
      security:
        - bearer: [users:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Add a person
      description: >-
        Returns a one-time set-password link token, valid 24 hours
        (docs/WEB.md §4). Their role can't exceed the caller's.
      tags: [people]
      security:
        - bearer: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: The new person, with a one-time set-password link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getUser
      summary: Get a person
      tags: [people]
      security:
        - bearer: [users:read]
      responses:
        "200":
          description: The person.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateUser
      summary: Change a person
      description: >-
        JSON Merge Patch: only the fields sent change. `disabled: true` ends
        every session of theirs at once (docs/WEB.md §4). Send `If-Match`
        with the person's `etag` to refuse the change (412) if someone else
        changed them first. Giving the admin or system_admin role needs a
        fresh "confirm it's you" (docs/ADMIN.md §7).
      tags: [people]
      security:
        - bearer: [users:write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: The person as they now are.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: disableUser
      summary: Disable a person
      description: >-
        Stops them signing in and ends every session of theirs at once
        (docs/WEB.md §4). Disabling a disabled person succeeds and changes
        nothing. Never deletes their history.
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/password-reset:
    post:
      operationId: requestPasswordReset
      summary: "\"Forgot your password?\": email a reset link"
      description: >-
        ADR-067. Always 202, as fast, whether or not the email has an
        account (nobody can learn which do): the account is looked up and
        the link emailed afterwards, only for an account that isn't disabled
        and doesn't have to use company sign-in. The link works once, for 30
        minutes. At most 3 an hour per email and 10 per address (still 202;
        an address over its limit announces an alert). 409
        `password_reset_off` when email isn't set up (the sign-in page only
        shows the link when GET /sign-in-options says `password_reset`).
        Served by a hand-written handler (excluded from code generation).
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "202":
          description: If that's an account here, an email is on its way.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/reset-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: checkResetLink
      summary: Check an emailed password-reset link before asking for a password
      description: >-
        200 with the person's email and what finishes the reset; 400
        `reset_link_invalid` if it was used, is older than 30 minutes or
        doesn't exist. A link that fails counts against the caller's address
        like a failed sign-in. A set-password link isn't a reset link, nor
        the other way round. Served by a hand-written handler.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: The link can be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLinkInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeResetLink
      summary: Choose a new password with an emailed reset link
      description: >-
        For an account with a second step, `code` (authenticator or recovery
        code) must be right too, or nothing changes and the link still works
        (400 `second_step_required` without one; a wrong code counts towards
        the account's lockout like signing in). Then the link is used up,
        every other session ends, the person is signed in and emailed that
        their password changed. An admin with no second step is let in on
        the link alone and the other admins are alerted. Never resets an
        authenticator. Served by a hand-written handler.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  description: At least 12 characters.
                code:
                  type: string
                  description: The authenticator (or recovery) code, for an account that has one.
      responses:
        "200":
          description: Signed in (or, for an admin with no second step who never chose a password only, pending its setup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/reset-links/{token}/ask-admin:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: askSecondStepReset
      summary: "\"Ask my admin to reset it\": lost every second step"
      description: >-
        From an emailed reset link's second step: announces an alert asking
        the admins to check it's really this person and reset their
        authenticator in People. Changes nothing about the account; the link
        still works. At most one alert an hour per person (still 202). 400
        `no_second_step` for an account without one. Served by a
        hand-written handler.
      tags: [sessions]
      security: []
      responses:
        "202":
          description: The admins were asked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/mfa/ask-admin:
    post:
      operationId: askSecondStepResetSignedIn
      summary: "\"Ask my admin to reset it\" from the sign-in code step"
      description: >-
        The same as a reset link's ask-admin, from a session that has
        passed the password but not the second step (the session cookie
        stands in for the emailed link). Changes nothing about the
        account. At most one alert an hour per person (still 202). 400
        `no_second_step` for an account without one, `already_signed_in`
        for a full session. Served by a hand-written handler.
      tags: [sessions]
      responses:
        "202":
          description: The admins were asked.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/reset-links/{token}/passkey/options:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completeResetLinkPasskeyOptions
      summary: "Finish a password reset with a passkey (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON for one of the link's
        person's own passkeys, and sets the __Host-linx_passkey cookie (5
        minutes, single use). Served by a hand-written handler.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/reset-links/{token}/passkey:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completeResetLinkPasskey
      summary: "Finish a password reset with a passkey (the device's answer)"
      description: >-
        The new password and the device's answer to the challenge from
        .../options. The password changes only if the answer passes (as
        POST /reset-links/{token}). Served by a hand-written handler.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, credential]
              properties:
                password:
                  type: string
                credential:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Signed in; sets the session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/setup-link:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createUserSetupLink
      summary: Issue a new set-password link
      description: A fresh one-time link (24 hours), for a new person or one who lost theirs; send_email also emails it to them.
      tags: [people]
      security:
        - bearer: [users:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                send_email:
                  type: boolean
      responses:
        "200":
          description: A one-time set-password link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkIssued"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/reset-mfa:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resetUserMfa
      summary: Reset a person's authenticator
      description: >-
        Turns off their authenticator and passkeys and ends every session
        of theirs, for when they've lost their second step (docs/ADMIN.md
        §7); they enroll again from scratch. Needs a fresh "confirm it's
        you".
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "200":
          description: The person, with MFA now off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unlockUser
      summary: Let a locked person sign in again
      description: >-
        Clears their lockout wait and failed-attempt count; doesn't change
        their password — if someone else was guessing it, that's a separate
        decision (`linx user unlock`, docs/ui/ADMIN_SCREENS_PHASE1E.md §4).
      tags: [people]
      security:
        - bearer: [users:write]
      responses:
        "200":
          description: The person, unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      summary: Change my own password
      description: Ends every session of mine, including this one (docs/WEB.md §4).
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/email:
    put:
      operationId: changeMyEmail
      summary: Change my sign-in email
      description: >-
        After "confirm it's you" (403 `confirm_required`). Drops my
        company-account links, which were for the old address. Only for a
        signed-in browser session.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 200
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password/check:
    post:
      operationId: checkMyPassword
      summary: Check my current password
      description: >-
        Whether the current password is right, before the Change password
        dialog asks for a new one. Changes nothing; a wrong one counts
        toward the same guessing limit as a wrong sign-in (401
        `password_invalid`, 429 when too many).
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: It's right.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: My signed-in browsers
      description: >-
        Every session of mine that's still live, newest use first
        (docs/ui/ADMIN_SCREENS_PHASE1E.md §11). Only for a signed-in
        browser session.
      tags: [people]
      responses:
        "200":
          description: My sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySessionList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: signOutMySession
      summary: Sign out one of my browsers
      description: Its browser phone line closes at once. Another person's session is not found (404).
      tags: [people]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/sessions/sign-out-others:
    post:
      operationId: signOutMyOtherSessions
      summary: Sign out everywhere else
      description: Ends every session of mine except this one.
      tags: [people]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/mfa:
    post:
      operationId: beginMyMfaEnrollment
      summary: Start turning on an authenticator app
      description: >-
        Returns a secret and its otpauth:// URI to scan; unconfirmed until
        POST /me/mfa/confirm (docs/WEB.md §4).
      tags: [people]
      responses:
        "200":
          description: A pending authenticator secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/mfa/confirm:
    post:
      operationId: confirmMyMfaEnrollment
      summary: Confirm the authenticator app and turn MFA on
      description: >-
        Returns 10 recovery codes, shown once. If the caller's session was
        still pending MFA, it's promoted to a full session.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCode"
      responses:
        "200":
          description: MFA is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmed"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/passkey/options:
    post:
      operationId: createPasskeySessionOptions
      summary: "Sign in with a passkey (ask the device)"
      description: >-
        Returns the options for the browser's
        PublicKeyCredential.parse*OptionsFromJSON and sets the
        __Host-linx_passkey cookie (5 minutes, single use) that binds the
        challenge to this browser. No email: the device offers its passkeys for this server (discoverable credentials, user verification required). A whole sign-in, both steps, for admins too (docs/ADMIN.md §5). Needs no session. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/session/passkey:
    post:
      operationId: createPasskeySession
      summary: "Sign in with a passkey (the device's answer)"
      description: >-
        The device's answer to the challenge from .../options, as
        PublicKeyCredential.toJSON() gives it. Served by a hand-written handler (excluded from code generation): it sets or clears cookies.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAnswer"
      responses:
        "200":
          description: Signed in; sets the session cookies.
          content:
            application/json:
              schema:
