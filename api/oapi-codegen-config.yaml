# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# `make api` runs: go tool oapi-codegen -config api/oapi-codegen-config.yaml api/openapi.yaml
package: api
generate:
  std-http-server: true
  strict-server: true
  models: true
  embedded-spec: true
output: services/control-plane/api/gen.go
output-options:
  # /oauth/token speaks OAuth's own error format (RFC 6749), so it's a
  # hand-written handler (internal/auth/oauth.go), documented in the spec only.
  # The session endpoints need to set two cookies each, which a typed JSON
  # response can't do, so they're hand-written too (services/control-plane/session.go,
  # passkey.go). Help (services/control-plane/help.go) serves both the signed-in
  # and the signed-out, pictures that aren't JSON, and answers that stream.
  # Voicemail audio and greetings are WAV both ways (services/control-plane/voicemail.go).
  exclude-operation-ids: [oauthToken, askSecondStepResetSignedIn, uploadRestoreFile, getBackupDownloadFile, getSignInOptions, startCompanySignIn, startCompanyConfirm, companyCallback, startMyCompanyLink, createSession, deleteSession, verifySessionMfa, confirmSession, checkSetupLink, completeSetupLink, watchTeam,
    createPasskeySessionOptions, createPasskeySession, verifySessionMfaPasskeyOptions, verifySessionMfaPasskey,
    confirmSessionPasskeyOptions, confirmSessionPasskey, addMyPasskeyOptions, addMyPasskey,
    completeSetupLinkPasskeyOptions, completeSetupLinkPasskey,
    requestPasswordReset, checkResetLink, completeResetLink, completeResetLinkPasskeyOptions, completeResetLinkPasskey, askSecondStepReset,
    listHelpGuides, getHelpGuide, searchHelp, getHelpPicture, answerHelpQuestion,
    getVoicemailAudio, getVoicemailGreeting, putVoicemailGreeting]
  # WebhookMessage is only referenced from the spec's `webhooks:` section,
  # which pruning doesn't follow.
  skip-prune: true
