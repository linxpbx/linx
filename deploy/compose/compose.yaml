# Linx base stack. linx setup installs it as /etc/linx/compose.yaml, next to
# .env (non-secret settings) and secrets/ (root-owned, readable only by the
# service that needs it, never committed); you shouldn't need to edit this.
name: linx

services:
  certd:
    image: ${LINX_IMAGE_PREFIX:-ghcr.io/linxpbx}/linx-certd:${LINX_VERSION:?set by linx setup}
    container_name: linx-certd
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LINX_DOMAIN: ${LINX_DOMAIN:?set by linx setup}
      LINX_DNS_PROVIDER: ${LINX_DNS_PROVIDER:?set by linx setup}
      LINX_ACME_EMAIL: ${LINX_ACME_EMAIL:-}
      LINX_ACME_STAGING: ${LINX_ACME_STAGING:-true}
      LINX_CERT_WILDCARD: ${LINX_CERT_WILDCARD:-true}
      # Public names certd keeps pointed at this network's public address,
      # following it when it changes (or at LINX_DNS_ADDRESS, home only).
      # Empty: certd leaves DNS records alone.
      LINX_DNS_RECORDS: ${LINX_DNS_RECORDS:-}
      LINX_DNS_ADDRESS: ${LINX_DNS_ADDRESS:-}
    secrets: [linx_dns_token]
    volumes:
      - certd-state:/var/lib/linx/state
      # Consumers mount this read-only at the same path and add
      # group_add: ["65532"] to read privkey.pem (see docs/ops/CERT_RELOAD.md).
      - certs:/var/lib/linx/certs
    networks: [linx-private, linx-egress]
    mem_limit: 64m
    pids_limit: 64

  # Application data (ADR-026), never reachable from outside linx-private.
  postgres:
    image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    container_name: linx-postgres
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The image's entrypoint starts as root to set ownership of a fresh data
    # volume, then drops to the postgres user; these are what that needs.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: linx
      POSTGRES_DB: linx
      POSTGRES_PASSWORD_FILE: /run/secrets/linx_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [linx_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [linx-private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username linx --dbname linx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    pids_limit: 128

  # The web client, REST API, /sip relay, webhooks, ARI app, provisioning,
  # push gateway (docs/API.md, docs/WEB.md). HTTPS on 8443 only (ADR-037);
  # plain HTTP just on its own loopback, for the health check. Reaches
  # Postgres on linx-private; reached by the front door on linx-public
  # (nothing publishes 8443 yet: the front-door steps do, docs/WEB.md §3);
  # sends webhooks out through linx-egress. Webhook
  # requests never reach any of these three networks (internal/safehttp).
  control-plane:
    image: ${LINX_IMAGE_PREFIX:-ghcr.io/linxpbx}/linx-control-plane:${LINX_VERSION:?set by linx setup}
    container_name: linx-control-plane
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LINX_DB_HOST: postgres
      LINX_DB_PORT: "5432"
      LINX_DB_NAME: linx
      LINX_DB_USER: linx
      # For device SIP settings, "sip.<domain>" (docs/PBX.md §5).
      LINX_DOMAIN: ${LINX_DOMAIN:?set by linx setup}
      # The front door (docs/WEB.md §3): the only peers that may, and must,
      # send the visitor's address in a PROXY protocol header on 8443
      # (Pangolin's address, or linx-sni); set by linx setup.
      LINX_TRUSTED_PROXIES: ${LINX_TRUSTED_PROXIES:-}
      # false for an HTTP-only proxy, which sends X-Forwarded-For instead.
      LINX_PROXY_PROTOCOL: ${LINX_PROXY_PROTOCOL:-true}
      # The relay's addresses as browsers reach them; empty is
      # turn.<domain> on 443 (an HTTP-only proxy's TLS relay is on 5349).
      LINX_TURN_URLS: ${LINX_TURN_URLS:-}
    secrets:
      - linx_db_password
      - linx_db_encryption_key
      - linx_jwt_signing_key
      - linx_asterisk_db_password
      - linx_ari_password
      - linx_ca_services_password
      # Signs browsers' relay credentials (docs/WEB.md §5).
      - linx_turn_secret
    # Group 1000 (step-ca's): reads linx_ca_services_password, to get its
    # own ARI certificate from the internal CA (ADR-034). Only that one CA
    # secret is mounted here.
    group_add: ["1000"]
    volumes:
      # The internal CA's public certificates only (root_ca.crt), never its
      # keys or database: the rest of the volume stays with step-ca.
      - type: volume
        source: step-ca
        target: /etc/linx/ca
        read_only: true
        volume:
          subpath: certs
      # Writes Asterisk's browser-websocket certificate here (docs/WEB.md §2).
      - sipws-certs:/var/lib/linx/sipws-certs
      # Writes the trunks for Asterisk here, provider passwords included
      # (ADR-043, internal/trunkconf).
      - trunks:/var/lib/linx/trunks
      # Asterisk's report of each trunk's state (trunk.status_changed, the
      # trunk-down alert).
      - trunk-status:/var/lib/linx/trunk-status:ro
      # Writes the WireGuard tunnels, private keys included, for
      # linx-wireguard (docs/TRUNKS.md §7), and reads its report back.
      - wireguard:/var/lib/linx/wireguard
      - wireguard-status:/var/lib/linx/wireguard-status:ro
      # linx-certd's certificate, for HTTPS on 8443 (ADR-037): the web
      # client, the API and /sip. Picked up again on renewal by itself. This
      # image's user (65532) is certd's, so it can read privkey.pem.
      - certs:/var/lib/linx/certs:ro
    # For a front door on the home network (Pangolin): on the LAN address,
    # and the firewall lets only the front door in. 127.0.0.1 otherwise.
    ports:
      - ${LINX_WEB_ADDRESS:-127.0.0.1}:8443:8443/tcp
    depends_on:
      postgres:
        condition: service_healthy
    # No shell or curl in the image: the binary checks its own /healthz.
    healthcheck:
      test: [CMD, /usr/local/bin/service, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      linx-private:
        # Asterisk's ARI websocket connects to wss://linx-ari:8089 (ADR-034).
        # An alias on this network only, so the name never resolves to the
        # control plane's other networks; ARI also listens on this network's
        # address only (services/control-plane/ari.go).
        aliases: [linx-ari]
      linx-public: {}
      linx-egress: {}
      # Reaches Asterisk's browser websocket (wss://linx-sipws:8089/ws), for
      # the /sip relay (docs/WEB.md §5).
      linx-sipws: {}
    mem_limit: 256m
    pids_limit: 128

  # The relay for browsers away from home (ADR-039, docs/WEB.md §2): TURN
  # over UDP (3478) and TLS (5349, certd's certificate), relaying to
  # Asterisk's audio on linx-media and to nothing else (its entrypoint
  # renders coturn's allowed peer from Asterisk's address there). Only
  # credentials the control plane signed with linx_turn_secret work. The
  # front door reaches it on linx-public (docs/WEB.md §3); no port is
  # published on the server yet.
  coturn:
    image: ${LINX_IMAGE_PREFIX:-ghcr.io/linxpbx}/linx-coturn:${LINX_VERSION:?set by linx setup}
    container_name: linx-coturn
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LINX_DOMAIN: ${LINX_DOMAIN:?set by linx setup}
    secrets: [linx_turn_secret]
    # TLS for a front door on the home network (Pangolin passes turn.<domain>
    # through to it; the firewall lets only the front door in), and UDP,
    # which the router forwards from port 443 (docs/WEB.md §3). 127.0.0.1
    # when there's no front door.
    ports:
      - ${LINX_WEB_ADDRESS:-127.0.0.1}:5349:5349/tcp
      - ${LINX_TURN_UDP_ADDRESS:-127.0.0.1}:${LINX_TURN_UDP_PORT:-3478}:3478/udp
    volumes:
      - certs:/var/lib/linx/certs:ro
    tmpfs: [/tmp]
    networks:
      linx-public: {}
      linx-media: {}
    depends_on: [asterisk]
    healthcheck:
      test: [CMD, /usr/local/bin/coturn-entrypoint, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    pids_limit: 64

  # Phone engine (docs/PBX.md): Asterisk 22, pjsip. Reads extensions and
  # devices straight from Postgres, over ODBC, through the asterisk schema's
  # realtime views (role linx_asterisk, docs/PBX.md §3); no cache, so a
  # revoked device stops at once. Connects out to control-plane's ARI
  # websocket (wss://linx-ari:8089, ADR-034); nothing here listens for ARI.
  # Browsers: a secure SIP websocket on linx-sipws only, which only the
  # control plane's /sip relay reaches (docs/WEB.md §2); never published.
  # Their audio comes straight from the LAN, or through coturn on
  # linx-media.
  # Phones: SIP over TLS and encrypted audio, published on the server's LAN
  # address only and accepted from the LAN only (docs/PBX.md §6: Asterisk's
  # ACL, and linx setup's nftables table). Never 5060. The audio range must
  # match internal/asteriskconf's RTPStart/RTPEnd.
  asterisk:
    image: ${LINX_IMAGE_PREFIX:-ghcr.io/linxpbx}/linx-asterisk:${LINX_VERSION:?set by linx setup}
    container_name: linx-asterisk
    restart: unless-stopped
    # A minimal init as PID 1: the entrypoint stays beside Asterisk (it
    # reloads the TLS certificate on renewal), and something must reap
    # whatever exits under it.
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Reads the certs volume's privkey.pem (docs/ops/CERT_RELOAD.md).
    group_add: ["65532"]
    environment:
      LINX_DB_HOST: postgres
      LINX_DB_PORT: "5432"
      LINX_DB_NAME: linx
      LINX_SIP_ADDRESS: ${LINX_SIP_ADDRESS:?set by linx setup}
      LINX_SIP_NETWORKS: ${LINX_SIP_NETWORKS:?set by linx setup}
    ports:
      - ${LINX_SIP_ADDRESS}:5061:5061/tcp
      - ${LINX_SIP_ADDRESS}:10000-10199:10000-10199/udp
    secrets: [linx_asterisk_db_password, linx_ari_password]
    volumes:
      - asterisk-state:/var/lib/asterisk
      - certs:/var/lib/linx/certs:ro
      # The browser websocket's certificate, issued by the control plane
      # (Asterisk holds no internal-CA credential).
      - sipws-certs:/var/lib/linx/sipws-certs:ro
      # The trunks the control plane renders: pjsip.conf includes them, and
      # the entrypoint reloads PJSIP when they change (docs/TRUNKS.md §4).
      - trunks:/var/lib/linx/trunks:ro
      # The entrypoint writes each trunk's state here for the control plane.
      - trunk-status:/var/lib/linx/trunk-status
      # To check the control plane's ARI certificate (see control-plane).
      - type: volume
        source: step-ca
        target: /etc/linx/ca
        read_only: true
        volume:
          subpath: certs
    # Owner and mode are explicit: on a restart (not the first start) Docker
    # recreates a tmpfs as root-owned 0755 unless told otherwise, and
    # Asterisk (uid 100) could no longer write its config or console socket.
    tmpfs:
      - /etc/asterisk:uid=100,gid=101,mode=0750
      - /var/run/asterisk:uid=100,gid=101,mode=0750
      - /tmp
    networks:
      linx-private: {}
      linx-public: {}
      linx-sipws:
        # The name the websocket's certificate is for, on this network only:
        # the entrypoint binds the websocket to the address it resolves to.
        aliases: [linx-sipws]
      linx-media:
        # How coturn finds Asterisk's audio, on this network only; Asterisk
        # offers browsers this address (and the LAN one) and nothing else.
        aliases: [linx-asterisk-media]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, asterisk, -rx, "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    pids_limit: 512

  # WireGuard tunnels for phone lines that use one (docs/TRUNKS.md §7,
  # ADR-046). It lives in Asterisk's network namespace, so Asterisk's
  # traffic to such a provider goes through the tunnel while Asterisk
  # itself holds no capability, and no other container's routes change.
  # The only container with NET_ADMIN, and only in that namespace. It
  # starts as root just to keep NET_ADMIN as an ambient capability and run
  # on as uid 65532 (hence SETUID/SETGID, gone after that switch);
  # no-new-privileges and the bounding set keep it from regaining anything.
  # When Asterisk restarts it gets a new namespace: the agent notices it's
  # been left behind, exits, and "restart" brings it back in the new one.
  # Needs the host's wireguard kernel module (linx setup loads it).
  wireguard:
    image: ${LINX_IMAGE_PREFIX:-ghcr.io/linxpbx}/linx-wireguard:${LINX_VERSION:?set by linx setup}
    container_name: linx-wireguard
    restart: unless-stopped
    network_mode: service:asterisk
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    volumes:
      - wireguard:/var/lib/linx/wireguard:ro
      - wireguard-status:/var/lib/linx/wireguard-status
    depends_on: [asterisk]
    mem_limit: 64m
    pids_limit: 32

  # "Linx takes 443" (docs/WEB.md §3, ADR-009): TCP 443 by name, without
  # decrypting. turn.<domain> goes to coturn's TLS port, everything else to
  # the control plane with the visitor's address (PROXY v2). Only with that
  # front door (COMPOSE_PROFILES=linx-443, set by linx setup, which also
  # writes haproxy.cfg next to this file).
  sni:
    # haproxy:3.2.23-alpine (LTS)
    image: haproxy:3.2.23-alpine@sha256:5961c68bc8a81c5124d0a98ab20f81b74717d6afe596e805977d9cf84c126222
    container_name: linx-sni
    profiles: [linx-443]
    restart: unless-stopped
    read_only: true
    # Listens on 443 as its own unprivileged user: Docker lets containers
    # bind low ports without any capability (ip_unprivileged_port_start).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - ${LINX_SNI_ADDRESS:-127.0.0.1}:443:443/tcp
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    tmpfs: [/tmp]
    networks:
      linx-public:
        # The control plane trusts this name's address for PROXY headers.
        aliases: [linx-sni]
    depends_on: [control-plane, coturn]
    mem_limit: 64m
    pids_limit: 64

  # Internal certificate authority (ADR-011, docs/ops/INTERNAL_CA.md). linx
  # setup creates it in the linx-step-ca volume; the root key isn't on the server.
  step-ca:
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    container_name: linx-step-ca
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The step-ca binary carries this file capability; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: [step-ca]
    command: [--password-file, /run/secrets/linx_step_ca_password, /home/step/config/ca.json]
    secrets: [linx_step_ca_password]
    volumes:
      - step-ca:/home/step
    networks: [linx-private]
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, "https://localhost:9000", --root, /home/step/certs/root_ca.crt]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    pids_limit: 64

secrets:
  # Root-owned, group 65532 (the services' nonroot user), mode 0440.
  linx_dns_token:
    file: ./secrets/linx_dns_token
  # Root-owned, group 1000 (the image's step user), mode 0440.
  linx_step_ca_password:
    file: ./secrets/linx_step_ca_password
  # Root-owned, group 65532 (the services' nonroot user), mode 0440.
  # Postgres reads it as root, before it drops to its own user.
  linx_db_password:
    file: ./secrets/linx_db_password
  # AES-256-GCM key that encrypts secrets stored in the database (ADR-030).
  # Root-owned, group 65532, mode 0440.
  linx_db_encryption_key:
    file: ./secrets/linx_db_encryption_key
  # Ed25519 seed that signs API access tokens (ADR-027).
  # Root-owned, group 65532, mode 0440.
  linx_jwt_signing_key:
    file: ./secrets/linx_jwt_signing_key
  # The linx_asterisk Postgres role's password (docs/PBX.md §3): the
  # control plane sets the role to it, and Asterisk connects with it.
  # Root-owned, group 65532, mode 0440.
  linx_asterisk_db_password:
    file: ./secrets/linx_asterisk_db_password
  # What Asterisk presents to the control plane's ARI websocket (ADR-034).
  # Root-owned, group 65532, mode 0440.
  linx_ari_password:
    file: ./secrets/linx_ari_password
  # The internal CA's linx-services provisioner password: the control plane
  # uses it to get its own 24 h ARI certificate. Root-owned, group 1000,
  # mode 0440 (created with the CA by linx setup).
  linx_ca_services_password:
    file: ./secrets/linx_ca_services_password
  # The control plane signs browsers' relay credentials with it; coturn
  # checks them with it (ADR-039). Root-owned, group 65532, mode 0440.
  linx_turn_secret:
    file: ./secrets/linx_turn_secret

volumes:
  certd-state:
  certs:
  # Asterisk's browser-websocket certificate and key: in memory only, written
  # by the control plane (uid 65532), read by Asterisk (group 101, which the
  # setgid directory passes on to every file in it).
  sipws-certs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=101,mode=2750,size=1m
  # The trunks rendered for Asterisk, with their provider passwords
  # (ADR-043): in memory only, written by the control plane, read by
  # Asterisk's group, like sipws-certs.
  trunks:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=101,mode=2750,size=1m
  # Each trunk's registration and keep-alive state (internal/trunkstatus):
  # written by Asterisk's entrypoint (uid 100), read by the control plane.
  # States only, no addresses or logins, so readable by all.
  trunk-status:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=100,gid=101,mode=0755,size=64k
  # The WireGuard tunnels with their private keys (docs/TRUNKS.md §7): in
  # memory only, written by the control plane and read by linx-wireguard,
  # which run as the same user; nobody else.
  wireguard:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=0700,size=256k
  # Each tunnel's last handshake (internal/wgconf): written by
  # linx-wireguard, read by the control plane. No keys.
  wireguard-status:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=0755,size=64k
  postgres-data:
  asterisk-state:
  step-ca:
    name: linx-step-ca
    external: true # created by linx setup

networks:
  # Databases, CA, metrics and internal APIs. No route to the internet.
  linx-private:
    name: linx-private
    internal: true
  # Outbound-only access for services that call external APIs (ACME, DNS,
  # webhooks).
  linx-egress:
    name: linx-egress
  # Services the edge (SNI router or existing proxy) reaches. Nothing
  # publishes a port here yet; that arrives with the deployment profiles.
  linx-public:
    name: linx-public
  # The control plane's /sip relay to Asterisk's browser websocket, and
  # nothing else: no other container, no route out.
  linx-sipws:
    name: linx-sipws
    internal: true
  # Browser audio between coturn and Asterisk, and nothing else: no other
  # container, no route out (docs/WEB.md §2).
  linx-media:
    name: linx-media
    internal: true
